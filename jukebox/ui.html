  let pxs = null, pys = null;
  for (let j = RW; j >= -2; j--) {
    const idx = P.top + j, z = (idx - P.fp) * dz + z0;
    if (z < .12) continue;
    const row = bdSpecRow(P.f, idx * 2), xs = new Float32Array(NC), ys = new Float32Array(NC);
    /* a new row comes up out of the horizon flat and grows as it nears, so
       nothing pops in at the back (19 Oct 2026, "it glitches a little": the
       beat lift was keyed to a row's place in the list, so it jumped from row
       to row as they moved, and the far row arrived at full height) */
    const zFar = RW * dz + z0, rise = Math.min(1, Math.max(0, (zFar - z) / (dz * 6)));
    for (let k = 0; k < NC; k++) {
      const x = (k / (NC - 1) * 2 - 1) * 3.2, ax = Math.abs(x);
      let y = 0;
      if (ax > .35) { const u = Math.min(1, (ax - .35) / 2.6); y = bdBand(row, u) * (.15 + 1.05 * u) * rise * (1 + K * .25 * Math.max(0, 1 - Math.abs(idx - P.fp) / 4)); }
      xs[k] = cx + (x - camX) * F / z; ys[k] = hor + (camH - y) * F / z;
    }
    const fog = Math.pow(Math.max(0, 1 - z / zFar), .7), a = Math.min(1, .9 * fog * rise + .1 * rise), base = hor + camH * F / z;
    /* the rungs from the row behind to this one */
    if (pxs) {
      g.beginPath();
      for (let k = 0; k < NC; k++) { g.moveTo(pxs[k], pys[k]); g.lineTo(xs[k], ys[k]); }
      g.strokeStyle = bdRgba(line, a * .7); g.lineWidth = lw; g.stroke();
    }
    g.beginPath(); g.moveTo(xs[0], ys[0]);
    for (let k = 1; k < NC; k++) g.lineTo(xs[k], ys[k]);
    g.lineTo(xs[NC - 1], base + lw); g.lineTo(xs[0], base + lw); g.closePath();
    g.fillStyle = bdRgba(ground, 1); g.fill();
    g.beginPath(); g.moveTo(xs[0], ys[0]);
    for (let k = 1; k < NC; k++) g.lineTo(xs[k], ys[k]);
    const playing = Math.max(0, 1 - Math.abs(idx - P.fp));
    g.strokeStyle = bdRgba(bdMix(line, white, playing * K * .6), a); g.lineWidth = lw * Math.min(3, .6 + .5 / z); g.stroke();
    pxs = xs; pys = ys;
  }
}

/* Skyline: the LED meter grown into a city. 20 bands across and the last
   two and a half seconds going back, each a tower as tall as that band was
   loud, coloured from the cover across the bands, the camera circling. */
function bdSkyline(g, w, h, now) {
  g.fillStyle = bdCol(0); g.fillRect(0, 0, w, h);
  const P = bdSpecPos(), K = MC.kick * BD.amp, cols = bdArtCols(), ground = bdGround();
  const D = IS_TV ? 9 : 13, step = 2;                     // a row every fifth of a second; each row is 20 boxes to sort and fill, the dearest thing here
  const fq = P.fp / step, top = Math.floor(fq), frac = fq - top;
  const yaw = MC.drift * .1 + Math.sin(MC.dir) * .35, pitch = .55 + Math.sin(MC.drift * .09) * .12;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const F = w * .72, dist = 5, mid = h * .54, cx = w / 2;
  const NB = 20, cs = 3.2 / NB, fw = cs * .78, zs = 2.2 / D, zh = zs * .39;
  /* where the camera stands in the city, to know which two sides of a tower face it */
  const camX = -dist * cp * sy, camZ = -dist * cp * cy;
  /* each band's colour, once a frame */
  const bc = [];
  for (let b = 0; b < NB; b++) bc.push(bdColAt(cols, b / (NB - 1)));
  const boxes = [];
  for (let j = 0; j <= D; j++) {
    const row = bdSpecRow(P.f, (top - j) * step), z = -1.1 + (j + frac) * zs;
    /* the back third sinks into the floor and darkens to it, so a row goes
       away instead of vanishing (19 Oct 2026, "the blocks drop off
       dramatically"); the front row grows up out of the floor */
    const age = (j + frac) / (D + 1), u = Math.max(0, Math.min(1, (age - .45) / .55)), fade = 1 - u * u * (3 - 2 * u);
    if (fade <= .01) continue;
    for (let b = 0; b < NB; b++) {
      const lv = bdBand(row, b / (NB - 1)), x = -1.6 + (b + .5) * cs;
      const hgt = (.02 + lv * 1.1 * (1 + K * .25 * Math.max(0, 1 - (j + frac) / 2))) * (j === 0 ? Math.min(1, frac * 2.5) : 1) * (.15 + .85 * fade);
      const Z = x * sy + z * cy;
      boxes.push({ x: x, z: z, h: hgt, d: -hgt * .5 * sp + Z * cp, b: b, lv: lv, fade: fade, j: j });
    }
  }
  boxes.sort((p, q) => q.d - p.d);
  const sx = new Float32Array(8), syy = new Float32Array(8);
  const put = (i, x, y, z) => {
    const X = x * cy - z * sy, Z = x * sy + z * cy, Zt = Math.max(.3, -y * sp + Z * cp + dist), k = F / Zt;
    sx[i] = cx + X * k; syy[i] = mid - (y * cp + Z * sp) * k;
  };
  const quad = (a, b, c, d, r, gg, bb) => {
    g.beginPath(); g.moveTo(sx[a], syy[a]); g.lineTo(sx[b], syy[b]); g.lineTo(sx[c], syy[c]); g.lineTo(sx[d], syy[d]); g.closePath();
    g.fillStyle = 'rgb(' + (r | 0) + ',' + (gg | 0) + ',' + (bb | 0) + ')'; g.fill();
  };
  for (let n = 0; n < boxes.length; n++) {
    const B = boxes[n], x0 = B.x - fw / 2, x1 = B.x + fw / 2, z0 = B.z - zh, z1 = B.z + zh;
    put(0, x0, 0, z0); put(1, x1, 0, z0); put(2, x1, 0, z1); put(3, x0, 0, z1);
    put(4, x0, B.h, z0); put(5, x1, B.h, z0); put(6, x1, B.h, z1); put(7, x0, B.h, z1);
    /* the top in the band's colour, whiter where loud and on the hit, sinking
       into the ground as the row ages; the sides in two shades of it */
    const c = bc[B.b], wt = Math.min(.6, B.lv * .35 + (B.j === 0 ? K * .5 : 0)), f = B.fade;
    const r = ground[0] + (c[0] + (255 - c[0]) * wt - ground[0]) * f, gg = ground[1] + (c[1] + (255 - c[1]) * wt - ground[1]) * f, bb = ground[2] + (c[2] + (255 - c[2]) * wt - ground[2]) * f;
    if (camZ < z0) quad(0, 1, 5, 4, ground[0] + (r - ground[0]) * .45, ground[1] + (gg - ground[1]) * .45, ground[2] + (bb - ground[2]) * .45);
    else if (camZ > z1) quad(2, 3, 7, 6, ground[0] + (r - ground[0]) * .45, ground[1] + (gg - ground[1]) * .45, ground[2] + (bb - ground[2]) * .45);
    if (camX < x0) quad(3, 0, 4, 7, ground[0] + (r - ground[0]) * .62, ground[1] + (gg - ground[1]) * .62, ground[2] + (bb - ground[2]) * .62);
    else if (camX > x1) quad(1, 2, 6, 5, ground[0] + (r - ground[0]) * .62, ground[1] + (gg - ground[1]) * .62, ground[2] + (bb - ground[2]) * .62);
    quad(4, 5, 6, 7, r, gg, bb);
  }
}

/* Planet: the song written onto a turning globe. Each reading is a meridian,
   bass at the south pole and treble at the north, raised where it was loud;
   the newest is laid down at the front left and the globe carries the last
   six seconds round with it, the oldest disappearing round the back. */
function bdPlanet(g, w, h, now) {
  const ground = bdGround(), cols = bdArtCols(), white = [255, 255, 255], K = MC.kick * BD.amp;
  g.fillStyle = bdRgba(ground, 1); g.fillRect(0, 0, w, h);
  /* a still field of stars, drifting very slowly */
  if (!BD.stars) { BD.stars = []; for (let i = 0; i < 90; i++) BD.stars.push([Math.random(), Math.random(), Math.random()]); }
  for (let i = 0; i < BD.stars.length; i++) {
    const s = BD.stars[i], x = ((s[0] + MC.drift * .004 * (.5 + s[2])) % 1) * w, y = s[1] * h;
    g.fillStyle = bdRgba(white, .15 + .35 * s[2]); g.fillRect(x, y, 1 + s[2], 1 + s[2]);
  }
  /* a meridian every fifth of a second, so a turn is 12.8 s (19 Oct 2026:
     "rotate slower"), and the camera rises and sinks slowly over the poles */
  const P0 = bdSpecPos(), T = 64, LAT = 26, cx = w / 2, cyS = h * .5, F = h * 1.25, D = 4;
  const P = { f: P0.f, fp: P0.fp / 2, top: Math.floor(P0.fp / 2), frac: P0.fp / 2 - Math.floor(P0.fp / 2) };
  const tilt = .32 + Math.sin(MC.drift * .045) * .26, ct = Math.cos(tilt), st = Math.sin(tilt);
  const lon0 = -.55 + Math.sin(MC.dir) * .15;
  const R0 = F / Math.sqrt(D * D - 1);
  /* the air: a halo that breathes with the loudness and the hit */
  const halo = g.createRadialGradient(cx, cyS, R0 * .9, cx, cyS, R0 * 1.6);
  halo.addColorStop(0, bdRgba(cols[cols.length - 1], .16 + MC.loud * .12 + K * .15)); halo.addColorStop(1, bdRgba(cols[cols.length - 1], 0));
  g.fillStyle = halo; g.fillRect(0, 0, w, h);
  const grad = g.createLinearGradient(0, cyS - R0 * 1.3, 0, cyS + R0 * 1.3);
  for (let i = 0; i < cols.length; i++) grad.addColorStop(i / (cols.length - 1), bdRgba(bdMix(cols[cols.length - 1 - i], white, .15), 1));
  const lw = Math.max(1, h / 420);
  const pass = front => {
    for (let m = T - 1; m >= 0; m--) {
      const idx = P.top - m, row = bdSpecRow(P.f, idx * 2), age = (m + P.frac) / T;
      const L = lon0 + (P.fp - idx) * 6.2832 / T, sl = Math.sin(L), cl = Math.cos(L);
      let open = false;
      g.beginPath();
      for (let k = 0; k <= LAT; k++) {
        const lat = -1.35 + 2.7 * k / LAT, u = k / LAT, cL = Math.cos(lat);
        const r = 1 + .3 * bdBand(row, u) * Math.pow(cL, .7) * (m === 0 ? P.frac : 1) * (1 + (m < 3 ? K * .3 : 0));
        const sw = .16 * bdBand(row, u) * cL * (m === 0 ? P.frac : 1), sl2 = Math.sin(L + sw), cl2 = Math.cos(L + sw);
        const x = r * cL * sl2, y = r * Math.sin(lat), z = r * cL * cl2;
        const y2 = y * ct - z * st, z2 = y * st + z * ct;
        const vis = cL * cl * ct + Math.sin(lat) * st > -.02;   // the surface point faces us
        if (vis !== front) { open = false; continue; }
        const s = F / (D - z2), px = cx + x * s, py = cyS - y2 * s;
        if (open) g.lineTo(px, py); else { g.moveTo(px, py); open = true; }
      }
      const a = (front ? .25 + .75 * Math.pow(1 - age, 1.2) : .1 * (1 - age)) * (.6 + .4 * MC.live) * (m === 0 ? P.frac : 1);
      g.globalAlpha = Math.max(0, Math.min(1, a + (front && m < 3 ? K * .3 : 0)));
      g.lineWidth = lw * (front ? 1.3 : .8); g.stroke();
    }
    g.globalAlpha = 1;
  };
  g.strokeStyle = grad; g.lineJoin = 'round';
  pass(false);
  /* the body of the planet hides its far side */
  const body = g.createRadialGradient(cx - R0 * .35, cyS - R0 * .35, R0 * .1, cx, cyS, R0);
  body.addColorStop(0, bdRgba(bdMix(ground, cols[0], .22), .92)); body.addColorStop(1, bdRgba(ground, .92));
  g.beginPath(); g.arc(cx, cyS, R0 * .995, 0, 6.2832); g.fillStyle = body; g.fill();
  g.globalCompositeOperation = 'lighter'; g.strokeStyle = grad;
  pass(true);
  g.globalCompositeOperation = 'source-over';
}

/* Helix: the spectrum as a twisting ribbon seen from the side, like a strand
   of DNA. Each reading is a rung across the ribbon (bass on one edge, treble
   on the other) raised off it where it was loud; two rails run along the
   edges. The music still to come enters from the right, crosses the middle
   as it plays and fades out to the left, the ribbon turning about its own
   length on music time (a little faster on the hits, eased so it never
   jerks) while the camera drifts round it. */
function bdHelix(g, w, h, now) {
  g.fillStyle = bdCol(0); g.fillRect(0, 0, w, h);
  const P = bdSpecPos(), K = MC.kick * BD.amp, cols = bdArtCols(), white = [255, 255, 255];
  const dt = BD.dt || 0;
  BD.hv = (BD.hv || 0) + ((.3 + .4 * MC.rate) * MC.live + K * .8 - (BD.hv || 0)) * Math.min(1, dt / .6);
  BD.hroll = (BD.hroll || 0) + BD.hv * dt;
  const HALF = IS_TV ? 26 : 32, N = 30, dx = .095, W = .62, F = w * .56, D = 3.6, mid = h * .5;
  /* the camera circles part way round the strand and rises and dips as it
     goes, slowly, on music time (19 Oct 2026: "revolve around it a little
     bit and change elevation slightly") */
  const yaw = .48 * Math.sin(MC.drift * .075) + Math.sin(MC.dir) * .12, cy = Math.cos(yaw), sy = Math.sin(yaw);
  const tilt = .12 + Math.sin(MC.drift * .053 + 1) * .24, ct = Math.cos(tilt), st = Math.sin(tilt);
  const proj = (x, y, z) => {
    const X = x * cy - z * sy, Z = x * sy + z * cy, Y = y * ct - Z * st, Z2 = y * st + Z * ct + D;
    const s = F / Math.max(.4, Z2); return [w / 2 + X * s, mid - Y * s];
  };
  const lw = Math.max(1, h / 420), rails = [[], []];
  g.globalCompositeOperation = 'lighter'; g.lineJoin = 'round';
  for (let j = HALF; j >= -HALF; j--) {
    const idx = P.top + j, x = (idx - P.fp) * dx + .25;
    const row = bdSpecRow(P.f, idx), th = idx * .16 + BD.hroll;
    const ny = Math.cos(th), nz = Math.sin(th), by = -nz, bz = ny;
    const xs = new Float32Array(N), ys = new Float32Array(N);
    for (let k = 0; k < N; k++) {
      const u = k / (N - 1), s = u * 2 - 1, env = Math.exp(-Math.pow(s / .85, 4));
      const lift = bdBand(row, u) * .38 * env * (1 + (Math.abs(idx - P.fp) < 2 ? K * .35 : 0));
      const q = proj(x, ny * s * W + by * lift, nz * s * W + bz * lift);
      xs[k] = q[0]; ys[k] = q[1];
    }
    /* the coming music is a little dimmer than the played; both fade at the ends */
    const e = Math.abs(j + P.frac) / HALF, ends = Math.max(0, 1 - Math.pow(e, 2.2));
    const playing = Math.max(0, 1 - Math.abs(idx - P.fp));
    const a = Math.min(1, (j > 0 ? .55 : .9) * ends * (.6 + .4 * MC.live) + playing * (.25 + K * .4));
    const lg = g.createLinearGradient(xs[0], ys[0], xs[N - 1] + .01, ys[N - 1]);
    for (let i = 0; i < cols.length; i++) lg.addColorStop(i / (cols.length - 1), bdRgba(bdMix(cols[i], white, .1 + playing * (.3 + K * .4)), a));
    g.beginPath(); g.moveTo(xs[0], ys[0]);
    for (let k = 1; k < N; k++) g.lineTo(xs[k], ys[k]);
    g.strokeStyle = lg; g.lineWidth = lw * (1.1 + playing * .8); g.stroke();
    rails[0].push(xs[0], ys[0]); rails[1].push(xs[N - 1], ys[N - 1]);
  }
  for (let r = 0; r < 2; r++) {
    const q = rails[r]; if (q.length < 4) continue;
    g.beginPath(); g.moveTo(q[0], q[1]);
    for (let i = 2; i < q.length; i += 2) g.lineTo(q[i], q[i + 1]);
    g.strokeStyle = bdRgba(bdMix(cols[r ? cols.length - 1 : 0], white, .35), .45); g.lineWidth = lw * 1.6; g.stroke();
  }
  g.globalCompositeOperation = 'source-over';
}

/* Currents (19 Oct 2026, after the Tame Impala sleeve the user sent: "a
   ball being dragged through the sound ripples"): a field of close parallel
   lines and a chrome ball moving through them, seen in perspective by a
   camera that slowly circles the ball and rises and falls, always looking at
   it. The lines part around the ball and stay parted in a long groove
   behind it, where its trail lies; the water streams past, a swell running
   back along the lines and swaying the groove, with glints carried along.
   Ahead and to the sides the lines are thrown into ripples, and the ripples
   are the music: a ring at distance r left the ball r / c seconds ago and
   carries that moment's spectrum (bass straight ahead, treble out to the
   sides) and that moment's beat, so a loud bar or a hit travels outward as
   a bigger wave. World units: the ball's radius is 1, it sits at the
   origin, the lines run along z (its heading), x across, y up. Only lines
   near the ball are sampled finely; the rest are straight. */
function bdCurrents(g, w, h, now) {
  const ground = bdGround(), cols = bdArtCols(), white = [255, 255, 255], K = MC.kick * BD.amp;
  g.fillStyle = bdRgba(ground, 1); g.fillRect(0, 0, w, h);
  const f = MC.feat, hz = f && f.specHz ? f.specHz : 10, tm = mcPos()[0], th = !!BD.thumb;
  const lit = BD.lit ? BD.lit[2] : [220, 200, 230];
  const ink = bdMix(lit, white, .55), shade = bdMix(ground, [0, 0, 0], .5);
  const D_ = MC.drift, live = .4 + .6 * MC.live;
  const sp = IS_TV ? .38 : .27, Rw = 6.2, c = 1.25, kk = 6.2832 / (sp * 3.4), amp = sp * 1.9;
  /* the camera circles a little and rises and falls, looking at the ball */
  const yaw = 1.85 + .7 * Math.sin(D_ * .05) + .15 * Math.sin(MC.dir), pit = .98 + .14 * Math.sin(D_ * .031 + 1);
  const cyw = Math.cos(yaw), syw = Math.sin(yaw), cpt = Math.cos(pit), spt = Math.sin(pit);
  const dist = 11, F = h * 1.1, cx = w / 2, cy = h * .5;
  let px = 0, py = 0, pd = 0;
  const proj = (x, y, z) => {
    const x1 = x * cyw - z * syw, z1 = x * syw + z * cyw, y0 = y - .5;
    const y2 = y0 * cpt - z1 * spt, z2 = y0 * spt + z1 * cpt;
    pd = dist - z2; if (pd < 2) return false;
    const s = F / pd; px = cx + x1 * s; py = cy - y2 * s; return true;
  };
  /* the water's own run past the ball, faster when the song is louder */
  BD.cfl = (BD.cfl || 0) + BD.dt * (.7 + .6 * MC.loud) * live;
  const flow = BD.cfl, kw = 6.2832 / (sp * 7), aw = sp * .55 * (.5 + .5 * MC.mid) * live;
  /* the beat, remembered for as long as a ring takes to cross the field */
  if (!th) {
    const H = BD.ckh || (BD.ckh = []);
    if (H.length && tm < H[H.length - 1][0] - .05) H.length = 0;
    H.push([tm, K]);
    while (H.length > 2 && H[1][0] < tm - Rw / c - .5) H.shift();
  }
  /* what each ring carries, by distance (and, for the spectrum, by angle) */
  const NB = 40, NU = 5, lvT = new Float32Array(NB * NU), kT = new Float32Array(NB), H = th ? null : BD.ckh;
  let hp = H ? H.length - 1 : 0;
  for (let j = 0; j < NB; j++) {
    const rr = j / (NB - 1) * Rw, tb = tm - rr / c, fi = tb * hz, i0 = Math.floor(fi), s = fi - i0;
    const r0 = bdSpecRow(f, i0), r1 = bdSpecRow(f, i0 + 1);
    for (let k = 0; k < NU; k++) { const u = k / (NU - 1); lvT[j * NU + k] = bdBand(r0, u) * (1 - s) + bdBand(r1, u) * s; }
    if (H) { while (hp > 0 && H[hp][0] > tb) hp--; kT[j] = H[hp][0] <= tb ? H[hp][1] : 0; }
    else kT[j] = j < 6 ? K : 0;
  }
  /* a point of the plain field at (along al, across lat) -> its shift across
     (dO) and its height (dY) */
  let dO = 0, dY = 0;
  const sway = al => al < 0 ? .32 * Math.sin(kw * .6 * (al + flow)) * (1 - Math.exp(al / 1.5)) : 0;
  const disp = (al, lat) => {
    /* the parting: lines near the ball pushed out to the sides, closing again
       quickly ahead and slowly behind, the groove swaying in the wake */
    const R1 = al > 0 ? 1.35 : 1.1, gA = al > 0 ? Math.exp(-(al * al) / 1.7) : Math.exp(-(al * al) / 45);
    const ex = Math.exp(-(lat * lat) / (R1 * R1));
    dO = (R1 * (lat / Math.sqrt(lat * lat + .0025)) + sway(al)) * ex * gA;
    /* the water streaming past: a swell running back along the lines,
       strongest beside the ball and in its wake */
    const rr = Math.sqrt(al * al + lat * lat), wk = al < 0 ? Math.exp(al / 9) : Math.exp(-(al * al) / 6);
    const sw = aw * (Math.exp(-(lat * lat) / 4) * wk + .45 * Math.exp(-rr / 3)) * Math.sin(kw * (al + flow) + lat * .5);
    dO += sw; dY = sw * .4;
    /* the ripples, ahead and to the sides, never behind */
    if (rr > .9 && rr < Rw) {
      const front = Math.max(0, Math.min(1, (al / rr + .35) / .8));
      if (front > 0) {
        const x = rr / Rw * (NB - 1), j = Math.floor(x), s = x - j;
        const ui = Math.min(1, Math.abs(Math.atan2(lat, al)) / 2.2) * (NU - 1), k = Math.min(NU - 2, Math.floor(ui)), t = ui - k;
        const b0 = j * NU + k, b1 = b0 + NU;
        const L = (lvT[b0] * (1 - t) + lvT[b0 + 1] * t) * (1 - s) + (lvT[b1] * (1 - t) + lvT[b1 + 1] * t) * s;
        const Kh = kT[j] * (1 - s) + kT[j + 1] * s;
        const env = Math.exp(-rr / (Rw * .38)) * (1 - Math.exp(-Math.pow(rr / 1.3, 4))) * front;
        const A = amp * (.15 + .85 * L + 1.3 * Kh) * (1 + K * .5) * env * live;
        /* rings, bent into swirls by a slow wobble across them */
        const ph = kk * (rr - c * tm) + 1.6 * Math.sin(lat / (sp * 5) + tm * .4) * Math.min(1, rr / Rw * 3);
        dO += A * Math.sin(ph); dY += A * .7 * Math.cos(ph);
      }
    }
  };
  /* the field slides slowly across under the ball as it wanders */
  const ob = 1.6 * Math.sin(D_ * .05) + .5 * Math.sin(D_ * .021 + 2), L = 18, step = sp * (IS_TV ? .6 : .45), coarse = 6;
  const lines = [];

/* ================================================================= player */
/* Shuffle keeps the queue itself intact and walks it through an order array,
   so turning shuffle off returns you to the real running order rather than to
   a queue that has been permanently jumbled. On a speaker neither is done here
   at all: the queue lives on the speaker, so it is told the play mode and does
   its own shuffling. */

  if (!P.shuffle) { P.order = null; return; }
  const idx = P.q.map((_, n) => n);
  for (let a = idx.length - 1; a > 0; a--) {
    const b = Math.floor(Math.random() * (a + 1));
    [idx[a], idx[b]] = [idx[b], idx[a]];
  }
  if (keepCurrent && P.i >= 0) {          // play on from here, don't jump
    const at = idx.indexOf(P.i);
    if (at > 0) { idx.splice(at, 1); idx.unshift(P.i); }
  }
  P.order = idx;
}

function orderPos() {
  if (!P.order) return P.i;
  const at = P.order.indexOf(P.i);
  return at < 0 ? 0 : at;
}

function stepBy(d) {
  /* returns the next queue index, or -1 when the queue is finished */
  const n = P.q.length;
  if (!n) return -1;
  if (P.order) {
    let at = orderPos() + d;
    if (at >= n) { if (P.repeat !== 'all') return -1; at = 0; }
    if (at < 0) { if (P.repeat !== 'all') return 0; at = n - 1; }
    return P.order[at];
  }
  let at = P.i + d;
  if (at >= n) { if (P.repeat !== 'all') return -1; at = 0; }
  if (at < 0) { if (P.repeat !== 'all') return 0; at = n - 1; }
  return at;

function stopPoll() { if (OUT.poll) { clearInterval(OUT.poll); OUT.poll = null; } }

/* The queue lives IN the speaker, so the UI follows it rather than driving it.

   The old poll inferred "track finished" from state==STOPPED at position 0 and
   called next(), which advanced our index AND re-pushed the whole queue. But a
   speaker also reports STOPPED/0 for a moment right after a queue is loaded --
   so clicking a song moved Now Playing on to the following one while the
   speaker played what you actually picked. GetPositionInfo reports which queue
   entry is live; that is the truth, and this just reads it. */
function startPoll() {
  stopPoll();
  OUT.poll = setInterval(pollRemote, 1500);
  pollRemote();
}

async function pollRemote() {
  if (OUT.kind !== 'sonos' || !OUT.ip) return;
  try {
    const st = await api('/api/sonos/state?ip=' + encodeURIComponent(OUT.ip) +
                         (OUT.group ? '&group=1' : ''));
    OUT.dur = st.duration || 0;
    /* a speaker reports the OLD position for a moment after a seek, so let the
       requested position stand until it has caught up */
    if (Date.now() > (OUT.seekHold || 0)) {
      /* The report is whole seconds, a poll and a half apart. The backdrops
         read the position sixty times a second (mcPos carries it forward from
         OUT.posAt), so the clock runs on between polls and is only re-anchored
         when the count turns over and the prediction is off, or has drifted
         well clear (a seek, a stall) -- the same idea as the karaoke clock. */
      const p = st.position || 0, now = performance.now();
      const pred = remotePaused ? OUT.pos : OUT.pos + (now - (OUT.posAt || now)) / 1000;
      if (p !== OUT.lastP && Math.abs(pred - (p + .15)) > .35) OUT.pos = p + .15;
      else if (Math.abs(pred - p) > 1.6) OUT.pos = p;
      else OUT.pos = pred;
      OUT.lastP = p; OUT.posAt = now;
    }
    /* don't fight the finger: ignore polled volume right after a local drag */
    if (typeof st.volume === 'number' && Date.now() > OUT.volHold) {
      OUT.muted = !!st.muted; paintVol(st.volume);

    remotePaused = (st.state === 'PAUSED_PLAYBACK' || st.state === 'STOPPED');
    if (wasPaused !== remotePaused) paintPlayState();

    const mine = ourUri(st.uri);
    if (!mine && st.meta && (st.state === 'PLAYING' || st.state === 'PAUSED_PLAYBACK'

      foreignPaint(st.meta);
      return;                       // not our queue: nothing below applies
    }
    if (mine) foreignClear();

    /* A speaker keeps reporting the OLD queue index for a beat after a new
       queue is loaded, so ignore the index until the push has settled --
       otherwise the display snaps back to the previously playing track. */
    const qi = (st.track || 0) - 1;      // Sonos counts the queue from 1
    if (Date.now() > OUT.syncHold && mine &&
        qi >= 0 && qi < P.q.length && qi !== P.i) {

      duration: OUT.dur || null }).catch(() => {});

}

/* Hold either play button to choose where the sound goes.

   Two things this has to get right that the first version did not: the click
   that follows the release must NOT also toggle playback (a hold to pick a

['#bplay', '#npplay'].forEach(sel => {

/* Display size, remembered per device.

   It is a setting rather than a guess because guessing is what failed: the
   television was served the desktop sizes since its browser did not match the
   user-agent pattern. A TV that never presses an arrow key still needs to be
   readable. */
const SCALES = [1, 1.25, 1.5, 1.75, 2];

/* Measured BEFORE any zoom is applied, so it is the true viewport width. */
const BASE_W = document.documentElement.clientWidth || 1280;
const MIN_LAYOUT_W = 940;      // just above the 880px phone breakpoint

function maxScale() {
  /* Zoom shrinks the CSS viewport, and the media queries follow it. On a
     1280-wide TV browser, 150% leaves 853px -- under the phone breakpoint --
     so the page laid itself out for a phone while the JS still thought it was
     a desktop. Cap the zoom so the layout can never cross that line. */
  return Math.max(1, BASE_W / MIN_LAYOUT_W);

function applyScale(v) {
  const capped = Math.min(v, maxScale());
  document.documentElement.style.setProperty('--uiscale', String(capped));
  try { store['jb.uiscale'] = String(v); } catch (e) { }   // remember what was asked for
  return capped;
}

  const v = parseFloat(store['jb.uiscale'] || '');
  if (v && v >= 1 && v <= 2) return v;
  return IS_TV ? 1.5 : 1;          // a television starts large, everything else at 1
}

/* Steps through the sizes this screen can actually SHOW. The cap stands in for
   every larger size (a 1280-wide TV tops out around 136%), and one step past
   the largest wraps back to 100%: a remote has no right-click, so the button
   alone must be able to come back down. Stepping by what is shown rather than
   what was last asked for is what stopped it sticking at the top -- before, the
   stored request could climb to 200% while the screen sat at its cap, and each
   step down only ate into the excess. */
function cycleScale(step) {
  step = step || 1;
  const cap = maxScale();
  const opts = SCALES.filter(x => x < cap - 0.001);
  opts.push(Math.min(cap, SCALES[SCALES.length - 1]));
  const eff = Math.min(currentScale(), cap);
  let i = 0;
  for (let k = 0; k < opts.length; k++) if (opts[k] <= eff + 0.001) i = k;
  i += step;
  if (i >= opts.length) i = 0;
  if (i < 0) i = 0;
  const got = applyScale(opts[i]);
  const atCap = i === opts.length - 1 && cap < SCALES[SCALES.length - 1];

}

function paintVol(v) {
  if (typeof v === 'number') OUT.vol = Math.max(0, Math.min(100, Math.round(v)));
  const v0 = OUT.vol == null ? 0 : OUT.vol;
  const shown = OUT.muted ? 0 : v0;
  [['#vslider', '#vnum', '#npvol'], ['#svslider', '#svnum', '#svol']].forEach(([sl, nu, wrap]) => {
    const e = $(sl); if (e) { e.value = v0; e.style.setProperty('--pct', shown + '%'); }
    const n = $(nu); if (n) n.textContent = OUT.muted ? '—' : v0;
    const w = $(wrap); if (w) w.classList.toggle('muted', OUT.muted);
  });
  const mi = OUT.muted || v0 === 0 ? I.volmute : I.vol;
  ['#vmute', '#svmute'].forEach(sel => { const b = $(sel); if (b) b.innerHTML = mi; });
}

let volT = null;
function setVol(v, immediate) {
  if (OUT.kind !== 'sonos') return;
  OUT.vol = Math.max(0, Math.min(100, Math.round(v)));
  if (OUT.muted && OUT.vol > 0) OUT.muted = false;
  OUT.volHold = Date.now() + 1500;      // let the finger win over the poll
  paintVol();
  /* dragging a slider fires continuously; a speaker does not need 60 SOAP
     calls a second, so coalesce to the latest value */
  if (volT) clearTimeout(volT);
  volT = setTimeout(() => {
    volT = null;
    fanOut(ip => post('/api/sonos/volume', { ip, level: OUT.vol, group: OUT.group }))
      .catch(() => toast('Could not set volume on ' + OUT.name));
  }, immediate ? 0 : 90);
}

function nudgeVol(delta) {
  if (OUT.kind !== 'sonos') return false;
  OUT.volHold = Date.now() + 1500;
  if (OUT.vol != null) { OUT.vol = Math.max(0, Math.min(100, OUT.vol + delta)); paintVol(); }
  fanOut(ip => post('/api/sonos/volume', { ip, delta, group: OUT.group }))
    .then(rs => { const r = rs && rs[0];
      if (r && typeof r.volume === 'number') { OUT.vol = r.volume; paintVol(); } })
    .catch(() => {});
  return true;
}

}

/* seek */
(() => {
  const seek = $('#seek');
  let drag = false, pending = 0;
  const frac = e => {
    const r = seek.querySelector('.sk').getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  const preview = f => {                     // move the bar with the finger
    OUT.seekHold = Date.now() + 1500;
    paintProgress(f * nowDur(), nowDur());
  };
  seek.addEventListener('pointerdown', e => {
    if (!canSeek()) return;
    e.preventDefault();
    drag = true; pending = frac(e);
    seek.setPointerCapture(e.pointerId);
    seek.classList.add('scrubbing');
    preview(pending);
  });
  seek.addEventListener('pointermove', e => { if (drag) { pending = frac(e); preview(pending); } });
  const finish = () => {
    if (!drag) return;
    drag = false;
    seek.classList.remove('scrubbing');
    seekTo(pending);                         // commit once, on release
  };
  seek.addEventListener('pointerup', finish);
  seek.addEventListener('pointercancel', finish);
  seek.addEventListener('lostpointercapture', finish);
})();

/* Reordering has to move the QUEUE, not just the rows, and it has to keep
   playing the same song while doing so -- P.i is an index, so anything that
   shifts the array has to shift it too. The shuffle order is rebuilt after a
   move for the same reason. */
function queueMove(from, to) {
  if (from === to || from < 0 || to < 0 || from >= P.q.length || to >= P.q.length) return;
  const cur = P.q[P.i];
  const [row] = P.q.splice(from, 1);
  P.q.splice(to, 0, row);
  P.i = P.q.indexOf(cur);
  if (P.shuffle) buildOrder(true);
  saveSession();
}

function queueRemove(i) {
  if (i < 0 || i >= P.q.length) return;
  const wasCurrent = i === P.i;
  const cur = P.q[P.i];
  P.q.splice(i, 1);
  if (!P.q.length) { P.i = -1; audio.pause(); $('#nowbar').classList.remove('show'); }
  else if (wasCurrent) { P.i = Math.min(i, P.q.length - 1); startCurrent(); }
  else P.i = P.q.indexOf(cur);
  if (P.shuffle) buildOrder(true);
  paintQueue(); saveSession(); paintNow();
}

/* add somewhere other than the end: "play next" is the common case */
function queueAdd(tracks, where, label) {
  if (!tracks || !tracks.length) return;
  if (!P.q.length) { playQueue(tracks, 0, label || 'Queue'); return; }
  const at = where === 'next' ? P.i + 1 : P.q.length;
  P.q.splice(at, 0, ...tracks);
  if (at <= P.i) P.i += tracks.length;
  if (P.shuffle) buildOrder(true);
  saveSession(); paintQueueIfOpen();
  toast((tracks.length === 1 ? '1 track' : tracks.length + ' tracks') +
        (where === 'next' ? ' playing next' : ' added to the queue'));
  if (OUT.kind === 'sonos') startCurrent();   // the speaker holds the queue, so re-push
}

function paintQueue() {
  const pv = $('#paneview'); pv.innerHTML = '';
  if (!P.q.length && FGN.on) {
    pv.innerHTML = '<div class="kindh" style="margin-top:30px">' + esc(OUT.name) +
      ' is playing from another source, so its queue is not listed here.</div>';
    return;
  }
  if (!P.q.length) {
    pv.innerHTML = '<div class="kindh" style="margin-top:30px">The queue is empty.</div>';
    return;
  }
  const bar = document.createElement('div'); bar.className = 'qbar';
  const mk = (label, fn, cls) => {
    const b = document.createElement('button'); b.className = 'qbtn ' + (cls || '');
    b.innerHTML = label; b.onclick = e => { e.stopPropagation(); fn(); };
    reg(b); bar.appendChild(b); return b;
  };
  mk(I.plus + 'Save as playlist', () =>
    openAddSheet({ track_ids: P.q.map(t => t.id) }, P.ctx || 'this queue'));
  mk('Clear', () => {
    if (!confirm('Clear the queue? Nothing is deleted from the library.')) return;
    P.q = []; P.i = -1; P.order = null;
    try { audio.pause(); } catch (e) { }
    $('#nowbar').classList.remove('show');
    paintQueue(); saveSession();
  }, 'ghost');
  pv.appendChild(bar);

  const list = document.createElement('div'); list.className = 'qlist';
  P.q.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'qrow' + (i === P.i ? ' now' : '');
    d.dataset.qi = i;
    d.innerHTML = '<button class="qgrip" title="Drag to reorder">' + I.grip + '</button>' +
      '<div class="qn">' + trackImg(t, 96) + '</div>' +
      '<div class="qi"><div class="q1">' + esc(t.title) + '</div><div class="q2">' + esc(t.artist || '') + '</div></div>' +
      '<div class="qd">' + fmtD(t.duration) + '</div>' +
      '<button class="qx" title="Remove from queue">✕</button>';
    d.querySelector('.qx').onclick = e => { e.stopPropagation(); queueRemove(i); };
    d.onclick = e => {
      if (e.target.closest('.qx') || e.target.closest('.qgrip')) return;
      P.i = i; startCurrent(); paintQueue();
    };
    wireGrip(d.querySelector('.qgrip'), d, list);
    reg(d);
    list.appendChild(d);
  });
  pv.appendChild(list);
  const cur = list.querySelector('.qrow.now'); if (cur) cur.scrollIntoView({ block: 'center' });
}

/* Pointer-based drag, not HTML5 drag-and-drop, because the latter does not
   fire on touch -- and this queue is mostly used on a phone. */
function wireGrip(grip, row, list, opts) {
  if (!grip) return;
  opts = opts || {};
  const sel = opts.sel || '.qrow';
  grip.style.touchAction = 'none';
  grip.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    grip.setPointerCapture(e.pointerId);
    row.classList.add('dragging');
    const move = ev => {
      const rows = [...list.querySelectorAll(sel)];
      const over = rows.find(r => {
        if (r === row) return false;
        const b = r.getBoundingClientRect();
        return ev.clientY >= b.top && ev.clientY <= b.bottom;
      });
      if (!over) return;
      const rb = over.getBoundingClientRect();
      const after = ev.clientY > rb.top + rb.height / 2;
      list.insertBefore(row, after ? over.nextSibling : over);
    };
    const up = () => {
      grip.removeEventListener('pointermove', move);
      grip.removeEventListener('pointerup', up);
      grip.removeEventListener('pointercancel', up);
      row.classList.remove('dragging');
      if (opts.onDrop) { opts.onDrop([...list.querySelectorAll(sel)]); return; }
      const order = [...list.querySelectorAll('.qrow')].map(r => +r.dataset.qi);
      const from = +row.dataset.qi, to = order.indexOf(from);
      queueMove(from, to);
      paintQueue();
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up);
    grip.addEventListener('pointercancel', up);
  });
}


/* ================================================================= crossfade + sleep
   Crossfade on a Sonos room is the speaker's own setting (SetCrossfadeMode),
   toggled through the server. On this device there is one <audio> element,
   so a true overlap is not possible without a second one; what is done is a
   fade: the last three seconds of a song ease down and the next eases in over
   two and a half. That removes the hard cut without touching the player's
   plumbing. Remembered in localStorage. */
const XF = { on: false, timer: 0 };
try { XF.on = store['jb.xfade'] === '1'; } catch (e) { }
function xfadePaint() {
  const b = $('#npxfade'); if (!b) return;
  b.innerHTML = I.xfade; b.classList.toggle('modeon', XF.on);
  b.title = XF.on ? 'Crossfade on' : 'Crossfade';
}
function xfadeIn() {
  clearInterval(XF.timer);
  const t0 = performance.now(), dur = 2500;
  audio.volume = 0.12;
  XF.timer = setInterval(() => {
    const u = Math.min(1, (performance.now() - t0) / dur);
    audio.volume = 0.12 + 0.88 * u;
    if (u >= 1) clearInterval(XF.timer);
  }, 60);
}
setInterval(() => {
  if (OUT.kind !== 'local' || !XF.on || audio.paused || !audio.duration || KAR.on) return;
  const left = audio.duration - audio.currentTime;
  if (left < 3 && left > 0) { clearInterval(XF.timer); audio.volume = Math.max(0.08, left / 3); }
}, 200);
function xfadeToggle() {
  XF.on = !XF.on;
  try { store['jb.xfade'] = XF.on ? '1' : '0'; } catch (e) { }
  xfadePaint();
  if (OUT.kind === 'sonos') {
    fanOut(ip => post('/api/sonos/crossfade', { ip, on: XF.on })).then(() => toast(XF.on ? 'Crossfade on in ' + OUT.name : 'Crossfade off')).catch(() => toast('The speaker did not answer'));
  } else {
    if (!XF.on) { clearInterval(XF.timer); audio.volume = 1; }
    toast(XF.on ? 'Crossfade on' : 'Crossfade off');
  }
}

/* Sleep: on a Sonos room the speaker's own timer is set, so it fires even if
   this phone goes to sleep first; on this device a timer here fades the
   volume down over ten seconds and pauses. "After this song" waits for the
   end of the current track instead. */
const SLEEP = { at: 0, endOfTrack: false, t: 0, tick: 0 };
function sleepPaint() {
  const b = $('#npsleep'); if (!b) return;
  const on = !!(SLEEP.at || SLEEP.endOfTrack);
  b.innerHTML = I.moon; b.classList.toggle('modeon', on);
  b.title = SLEEP.endOfTrack ? 'Sleeping after this song' : SLEEP.at ? 'Sleep in ' + Math.max(1, Math.round((SLEEP.at - Date.now()) / 60000)) + ' min' : 'Sleep timer';
}
function sleepClear(quiet) {
  clearTimeout(SLEEP.t); clearInterval(SLEEP.tick);
  const had = SLEEP.at || SLEEP.endOfTrack;
  SLEEP.at = 0; SLEEP.endOfTrack = false;
  if (OUT.kind === 'sonos') fanOut(ip => post('/api/sonos/sleep', { ip, seconds: 0 })).catch(() => { });
  sleepPaint();
  if (had && !quiet) toast('Sleep timer off');
}
function sleepFire() {
  SLEEP.at = 0; SLEEP.endOfTrack = false; sleepPaint();
  if (OUT.kind === 'sonos') { remoteCtl('Pause').catch(() => { }); return; }
  const v0 = audio.volume, t0 = performance.now();
  const f = setInterval(() => {
    const u = Math.min(1, (performance.now() - t0) / 10000);
    audio.volume = v0 * (1 - u);
    if (u >= 1) { clearInterval(f); try { audio.pause(); } catch (e) { } audio.volume = v0; paintPlayState(); }
  }, 100);
}
function sleepSet(minutes, endOfTrack) {
  sleepClear(true);
  if (endOfTrack) {
    SLEEP.endOfTrack = true;
    if (OUT.kind === 'sonos') {
      const left = Math.max(5, Math.round((OUT.dur || 0) - (OUT.pos || 0)));
      fanOut(ip => post('/api/sonos/sleep', { ip, seconds: left })).catch(() => { });
    }
    toast('Sleeping after this song');
  } else {
    SLEEP.at = Date.now() + minutes * 60000;
    if (OUT.kind === 'sonos') fanOut(ip => post('/api/sonos/sleep', { ip, seconds: minutes * 60 })).catch(() => { });
    else SLEEP.t = setTimeout(sleepFire, minutes * 60000);
    SLEEP.tick = setInterval(() => { if (SLEEP.at && Date.now() >= SLEEP.at) { clearInterval(SLEEP.tick); if (OUT.kind === 'sonos') { SLEEP.at = 0; } } sleepPaint(); }, 30000);
    toast('Sleeping in ' + minutes + ' min');
  }
  sleepPaint();
}
function openSleepSheet() {
  let sheet = $('#sleepsheet');
  if (!sheet) {
    sheet = document.createElement('div'); sheet.id = 'sleepsheet'; sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sheetin"><div class="sheeth"><h2>Sleep timer</h2><button class="xbtn" id="slx">✕</button></div><div id="sllist" class="outlist"></div></div>';

    r.onclick = () => { sheet.classList.remove('on'); fn(); }; reg(r); list.appendChild(r);
  };
  [15, 30, 45, 60, 90].forEach(m => row(m + ' minutes', '', () => sleepSet(m)));
  row('After this song', trackOf() ? trackOf().title : '', () => sleepSet(0, true));
  if (SLEEP.at || SLEEP.endOfTrack) row('Off', SLEEP.endOfTrack ? 'sleeping after this song' : 'sleeping in ' + Math.max(1, Math.round((SLEEP.at - Date.now()) / 60000)) + ' min', () => sleepClear());

/* ================================================================= lyrics */
/* A room playing Spotify or radio has no track id here, but LRCLIB is keyed on
   artist and title, so the words are still reachable. */
async function loadLyricsByName(pv) {
  const key = 'fgn:' + FGN.artist + '|' + FGN.title;
  if (lyrState.tid === key && pv.querySelector('.lyr')) return;
  if (!FGN.artist) {
    pv.innerHTML = '<div class="lyr"><div class="lmsg">No artist reported for this stream.</div></div>';
    return;
  }
  pv.innerHTML = '<div class="lyr"><div class="lmsg">Looking for lyrics…</div></div>';
  lyrState = { tid: key, synced: null, lines: [], active: -1, userScrolledAt: 0 };
  let d;
  try {
    d = await api('/api/lyrics/by-name?artist=' + encodeURIComponent(FGN.artist) +
                  '&title=' + encodeURIComponent(FGN.title) +
                  (OUT.dur ? '&duration=' + OUT.dur : ''));
  } catch (e) {
    pv.innerHTML = '<div class="lyr"><div class="lmsg">Lyrics lookup failed.</div></div>'; return;
  }
  if (lyrState.tid !== key) return;
  renderLyrics(d, pv);
}
let lyrState = { tid: null, synced: null, lines: [], active: -1, userScrolledAt: 0 };
async function loadLyrics() {
  const t = trackOf();
  const pv = $('#paneview');
  if (!t && FGN.on) return loadLyricsByName(pv);
  if (!t) return;
  if (lyrState.tid === t.id && pv.querySelector('.lyr')) return;
  pv.innerHTML = '<div class="lyr"><div class="lmsg">Looking for lyrics…</div></div>';
  lyrState = { tid: t.id, synced: null, lines: [], active: -1, userScrolledAt: 0 };
  let d;
  try { d = await api('/api/lyrics/' + t.id); } catch (e) { pv.innerHTML = '<div class="lyr"><div class="lmsg">Lyrics lookup failed.</div></div>'; return; }
  if (lyrState.tid !== (trackOf() || {}).id) return;
  renderLyrics(d, pv);
}

/* shared by the library path and the by-name path */
function renderLyrics(d, pv) {
  if (d.synced && d.synced.length) {
    const wrap = document.createElement('div'); wrap.className = 'lyr';
    lyrState.synced = d.synced; lyrState.lines = [];
    d.synced.forEach((L, i) => {

  if (!seg.length) return null;                 // already home
  if (seg[0] === 'artist' && seg.length > 2) return '#/artist/' + seg[1];
  const up = { album: '#/albums', collection: '#/albums', artist: '#/artists',
               genre: '#/genres', decade: '#/decades' }[seg[0]];
  return (seg.length > 1 && up) ? up : '#/';
}

/* Depth rides in history.state, so going back restores the old value rather
   than us trying to count our way there. */
let curDepth = -1;
function stampDepth() {
  const st = history.state;
  if (st && typeof st.d === 'number') { curDepth = st.d; return; }
  curDepth += 1;
  try { history.replaceState({ d: curDepth }, ''); } catch (e) { }
}

/* Back, from the remote or the arrow: close whatever is on top first -- the
   karaoke screen, a sheet, search, Now Playing -- then step back a page. The
   TV app sends its Back key here directly, so this must know every layer. */
const NAV = { back: false };
function backAction() {
  if (KAR.on) { karClose(); return; }
  const sheet = document.querySelector('.sheet.on');
  if (sheet) { sheet.classList.remove('on'); if (!tvExit()) tvFocusSection(); return; }
  if ($('#so').classList.contains('open')) { if (!closeSearch()) tvFocusSection(); return; }
  if ($('#np').classList.contains('open')) { closeNP(); return; }
  NAV.back = true;
  if (curDepth > 0) { history.back(); return; }
  const p = parentHash(location.hash);
  if (p) go(p); else NAV.back = false;
}
/* After a step back, the ring sits on the section you were in -- the Albums
   pill after leaving an album, Karaoke after leaving the karaoke screen --
   not on the first thing on the page. */
function tvFocusSection() {
  if (!TVMODE) return;
  const pill = document.querySelector('#nav .pill.on') || document.querySelector('#bnav [data-go].on');
  if (tvVisible(pill)) setTvFocus(pill); else tvFocusFirst();
}
/* A forward step: a section root (Home, Artists, Albums, Karaoke, a library)
   keeps the ring on its pill, so Down enters the content; a detail page (an
   album, an artist, a genre, a decade) lands on its Play button, else on its
   first stop in reading order. Read from the DOM, which is complete now,
   not from the observer's set, which is not. */
function tvFocusLanding(seg) {
  const detail = seg && seg.length > 1 && seg[0] !== 'lib';
  if (!detail) { tvFocusSection(); return; }
  const first = $$('#view .spmain, #view .hplay').find(tvVisible) || $$('#view .f').find(el => tvVisible(el) && !el.closest('#rail'));
  if (first) setTvFocus(first); else tvFocusSection();
}
$('#tback').innerHTML = I.back;
$('#npback').innerHTML = I.back;
$('#npback').onclick = e => { e.stopPropagation(); closeNP(); };
$('#tback').onclick = e => { e.stopPropagation(); backAction(); };
/* ===================== add to a playlist =====================
   Playlists store STABLE KEYS, not track ids, so one survives the library
   being re-scanned and keeps pointing at the right song even if the file is
   replaced by a better copy. */
/* Play next / add to queue / add to a playlist. The + used to jump straight
   to playlists, which is the least common of the three. */
async function openTrackSheet(tracks, label, payload) {
  let sheet = $('#tksheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'tksheet'; sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sheetin"><div class="sheeth">' +
      '<h2 id="tkh">Add</h2><button class="xbtn" id="tkx">✕</button></div>' +
      '<div id="tklist" class="outlist"></div></div>';
    document.body.appendChild(sheet);
    sheet.addEventListener('click', ev => { if (ev.target === sheet) sheet.classList.remove('on'); });
    $('#tkx').onclick = () => sheet.classList.remove('on');
  }
  sheet.classList.add('on');
  $('#tkh').textContent = label || 'Add';
  const list = $('#tklist'); list.innerHTML = '';
  const row = (name, sub, fn) => {
    const r = document.createElement('div');
    r.className = 'outrow'; r.tabIndex = 0;
    r.innerHTML = '<span class="outn">' + esc(name) + '</span><span class="outs">' + esc(sub || '') + '</span>';
    r.onclick = () => { sheet.classList.remove('on'); fn(); };
    reg(r); list.appendChild(r);
  };
  const got = typeof tracks === 'function' ? null : tracks;
  const load = async () => (got || await tracks());
  row('Play next', 'after the current track', async () => { if (!tvExit()) tvFocusSection(); queueAdd(await load(), 'next', label); });
  row('Add to queue', 'at the end', async () => { if (!tvExit()) tvFocusSection(); queueAdd(await load(), 'end', label); });
  row('Add to playlist', '', () => openAddSheet(payload, label));
  tvEnter(sheet);
}

async function openAddSheet(payload, what) {
  let sheet = $('#plsheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'plsheet'; sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sheetin"><div class="sheeth">' +
      '<h2>Add to playlist</h2><button class="xbtn" id="plx">✕</button></div>' +
      '<div id="pllist" class="outlist"></div>' +
      '<div class="outgo"><button class="btn sec" id="plnew" type="button">' +
      'New playlist…</button></div></div>';
    document.body.appendChild(sheet);
    sheet.addEventListener('click', ev => { if (ev.target === sheet) sheet.classList.remove('on'); });
    $('#plx').onclick = () => sheet.classList.remove('on');
    reg($('#plnew'));
  }
  sheet.classList.add('on');
  const list = $('#pllist');
  list.innerHTML = '<div class="outrow"><span class="outn">Loading…</span></div>';

  const add = async (pid, name) => {
    try {
      const r = await post('/api/pl/' + pid + '/add', payload);
      sheet.classList.remove('on');
      toast(r.added
        ? ('Added ' + r.added + (r.added === 1 ? ' track' : ' tracks') + ' to ' + name)
        : ('Already in ' + name));
    } catch (e) { toast('Could not add to ' + name); }
  };

  $('#plnew').onclick = async () => {
    const name = prompt('Name this playlist' + (what ? ' (' + what + ')' : ''));
    if (!name || !name.trim()) return;
    try {
      const pl = await post('/api/pl', { name: name.trim() });
      await add(pl.id, pl.name);
    } catch (e) { toast('Could not create that playlist'); }
  };

  let pls = [];
  try { pls = await api('/api/pl'); } catch (e) { pls = []; }
  list.innerHTML = '';
  if (!pls.length) {
    list.innerHTML = '<div class="outnote">No playlists yet — make one below.</div>';
    return;
  }
  pls.forEach(pl => {
    const r = document.createElement('div');
    r.className = 'outrow'; r.tabIndex = 0;
    r.innerHTML = '<span class="outn">' + esc(pl.name) + '</span>' +
      '<span class="outs">' + pl.n + (pl.n === 1 ? ' track' : ' tracks') + '</span>';
    r.onclick = () => { if (!tvExit()) tvFocusSection(); add(pl.id, pl.name); };
    reg(r); list.appendChild(r);
  });
  tvEnter(sheet);
}

/* ===================== output picker ===================== */
async function openOutputSheet(thenPlay, rescan) {
  let sheet = $('#outsheet');
  if (!sheet) {
    sheet = document.createElement('div');
    sheet.id = 'outsheet';
    sheet.className = 'sheet';
    sheet.innerHTML = '<div class="sheetin"><div class="sheeth">' +
      '<h2>Play in</h2><button class="xbtn" id="outrescan" title="Look for speakers again">' +
      '↻</button><button class="xbtn" id="outx">' + (I.close || '✕') + '</button></div>' +
      '<div id="outlist" class="outlist"></div>' +
      '<div class="svol" id="svol"><button class="vmute" id="svmute"></button>' +
      '<input id="svslider" type="range" min="0" max="100" step="1" value="30" ' +
      'aria-label="Speaker volume"><span class="vnum" id="svnum">30</span></div>' +
      '<div class="outnote" id="outnote"></div>' +
      '<div class="outgo"><button class="btn pri" id="outapply" type="button"></button></div>' +
      '</div>';
    document.body.appendChild(sheet);
    sheet.addEventListener('click', ev => { if (ev.target === sheet) sheet.classList.remove('on'); });
    $('#outx').onclick = () => sheet.classList.remove('on');
    $('#outrescan').onclick = async e => {
      e.stopPropagation();
      const b = $('#outrescan'); b.disabled = true; b.textContent = '⋯';
      roomsForget();
      await openOutputSheet(thenPlay, true);  // the one case that forces discovery
      b.disabled = false; b.textContent = '↻';
    };
    wireVol('#svslider', '#svmute');
    /* the remote walks the rooms, the volume and the button at the bottom */
    $('#svslider').dataset.vol = '1';
    ['#outrescan', '#svmute', '#svslider', '#outapply'].forEach(id => reg($(id)));
  }
  /* the slider only means anything when a speaker is the target */
  $('#svol').classList.toggle('on', OUT.kind === 'sonos');
  if (OUT.kind === 'sonos') paintVol();
  sheet.classList.add('on');
  const list = $('#outlist');
  list.innerHTML = '<div class="outrow"><span class="outn">Looking for speakers…</span></div>';
  /* An empty client cache is NOT a reason to make the server re-scan: that
     is the 8-second SSDP sweep, and the server has its own hour-long cache
     that answers in about 40ms. Only an explicit rescan forces discovery. */
  const d = await loadRooms(rescan === true);
  list.innerHTML = '';
  /* Sonos has no "play in these rooms" call: a group is one coordinator with
     members pointed at it. So the sheet collects a SET, and applying it
     reconciles the group in one go. */
  const sel = new Set(OUT.kind === 'sonos' && OUT.ip ? [OUT.ip] : []);
  const mk = (name, sub, active, onpick) => {
    const r = document.createElement('div');
    r.className = 'outrow' + (active ? ' active' : '');
    r.tabIndex = 0;
    r.innerHTML = '<span class="outdot"></span><span class="outn">' + name +
      '</span><span class="outs">' + (sub || '') + '</span>';
    r.onclick = () => onpick(r);
    reg(r); list.appendChild(r);
    return r;
  };
  const syncApply = () => {
    const b = $('#outapply');
    const n = sel.size;
    b.textContent = n === 0 ? 'Play on this device'
      : n === 1 ? 'Play in 1 room' : ('Play in ' + n + ' rooms');
    $('#outsheet').classList.toggle('multi', n > 1);
  };
  const localRow = mk('This device', IS_TV ? 'the TV' : (IS_PHONE ? 'this phone' : 'this browser'),
     OUT.kind === 'local', row => {
       sel.clear();
       list.querySelectorAll('.outrow').forEach(x => x.classList.remove('active'));
       row.classList.add('active');
       $('#svol').classList.remove('on');
       syncApply();
     });
  // Rooms on different Sonos systems cannot be grouped with each other (an older
  // S1 player alongside newer S2 kit), so say which system a room is on whenever
  // there is more than one -- otherwise grouping just quietly fails later.
  const systems = [...new Set((d.rooms || []).map(r => r.system))];
  const multi = systems.length > 1;
  (d.rooms || []).forEach(r => {
    let sub = r.members > 1 ? (r.group + ' · ' + r.members + ' rooms') : (r.model || '');
    if (r.stereo_pair) sub += ' · stereo pair';
    if (multi) sub += ' · system ' + (systems.indexOf(r.system) + 1);
    const ip = r.coordinator_ip || r.ip;
    if (r.unavailable) {
      const row = mk(r.name, r.unavailable, false, () => toast(r.unavailable));
      row.classList.add('off');
      return;
    }
    mk(r.name, sub, sel.has(ip), row => {
      // tapping toggles membership: one room plays alone, several play together
      if (sel.has(ip)) sel.delete(ip); else sel.add(ip);
      row.classList.toggle('active', sel.has(ip));
      if (sel.size) localRow.classList.remove('active');
      else localRow.classList.add('active');
      $('#svol').classList.toggle('on', sel.size > 0);
      syncApply();
    });
  });
  syncApply();
  tvEnter(sheet);
  if (TVMODE) { const cur = list.querySelector('.outrow.active'); if (cur) setTvFocus(cur); }
  $('#outapply').onclick = async () => {
    const ips = [...sel];
    const btn = $('#outapply');
    if (!ips.length) {
      setOutput('local');
      $('#outsheet').classList.remove('on');
      if (thenPlay) thenPlay();
      return;
    }
    const chosen = (d.rooms || []).filter(r => ips.includes(r.coordinator_ip || r.ip));
    const names = chosen.map(r => r.name);
    /* Rooms group only WITHIN a Sonos system. Across systems -- an older S1
       player beside newer S2 kit -- no grouping is possible, so each system
       gets its own copy of the queue and they play in parallel. Slight drift
       between them is expected and fine for rooms that are far apart. */
    const bySys = {};
    chosen.forEach(r => { (bySys[r.system] = bySys[r.system] || []).push(r); });
    const systems = Object.keys(bySys);
    btn.disabled = true;
    btn.textContent = systems.length > 1 ? 'Linking systems…' : 'Grouping…';
    const targets = [];
    for (const sys of systems) {
      const sIps = bySys[sys].map(r => r.coordinator_ip || r.ip);
      if (sIps.length > 1) {
        try {
          const res = await post('/api/sonos/group-set', { ips: sIps });
          roomsForget();
          if (res.errors && res.errors.length) toast('Some rooms could not be grouped');
        } catch (e) {
          btn.disabled = false; syncApply();
          toast('Could not group those rooms'); return;
        }
      }
      targets.push({ ip: sIps[0], name: bySys[sys].map(r => r.name).join(' + ') });
    }
    btn.disabled = false;
    const label = names.length > 1 ? (names[0] + ' +' + (names.length - 1))
                                   : (names[0] || 'Speaker');
    setOutput('sonos', targets[0].ip, label, ips.length > 1, targets);
    $('#outsheet').classList.remove('on');
    toast('Playing in ' + names.join(', ') +
          (systems.length > 1 ? ' · ' + systems.length + ' systems, streamed separately' : ''));
    if (thenPlay) thenPlay();
  };
  const nsys = [...new Set((d.rooms || []).map(r => r.system))].length;
  $('#outnote').textContent = !(d.rooms || []).length
    ? 'No Sonos speakers answered. They must be on the same network as this server.'
    : (nsys > 1
        ? 'Sonos fetches audio straight from this server. Rooms in one system play in sync; '
          + 'separate systems are streamed independently and may drift a little.'
        : 'Sonos fetches audio straight from this server.');
}

/* Long-press = favourite.

   This fired constantly during ordinary scrolling. The cause: when the browser
   decides a gesture is a scroll it takes the pointer over and emits POINTERCANCEL,
   not pointerup -- so the timer was never cleared and every list scroll favourited
   whatever the finger happened to land on. 550ms was also short enough that a firm
   deliberate tap could reach it. */
const HOLD_MS = 850;
let lpT = null, lpFired = false, lpXY = null, lpId = null, lpEl = null;

function lpCancel() {
  if (lpT) { clearTimeout(lpT); lpT = null; }
  lpXY = null; lpId = null; lpEl = null;
}

addEventListener('pointerdown', e => {
  lpCancel();
  if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const el = e.target.closest('[data-fav]'); if (!el) return;
  lpFired = false; lpXY = [e.clientX, e.clientY]; lpId = e.pointerId; lpEl = el;
  lpT = setTimeout(() => {
    lpT = null;
    if (!lpEl) return;
    lpFired = true;
    const [kind, id] = lpEl.dataset.fav.split(':');
    toggleFav(kind, +id, lpEl.dataset.t || '');
    if (navigator.vibrate) navigator.vibrate(30);
  }, HOLD_MS);
}, { passive: true });

addEventListener('pointermove', e => {
  if (!lpT || e.pointerId !== lpId || !lpXY) return;
  if (Math.hypot(e.clientX - lpXY[0], e.clientY - lpXY[1]) > 8) lpCancel();
}, { passive: true });

addEventListener('pointerup', lpCancel, { passive: true });
/* the two that were missing: a cancelled gesture, and any scroll at all */
addEventListener('pointercancel', lpCancel, { passive: true });
addEventListener('scroll', lpCancel, { passive: true, capture: true });
addEventListener('wheel', lpCancel, { passive: true });
addEventListener('touchmove', lpCancel, { passive: true });
addEventListener('blur', lpCancel);

addEventListener('click', e => { if (lpFired) { e.stopPropagation(); e.preventDefault(); lpFired = false; } }, true);
/* hover lights the room on desktop */
if (!IS_TV && !IS_TOUCH) {
  let hovT;
  addEventListener('pointerover', e => {
    const el = e.target.closest('[data-pal]'); if (!el) return;
    clearTimeout(hovT);
    hovT = setTimeout(() => paletteFromAlbum(+el.dataset.pal, el.dataset.t || '', el.dataset.s || '', el.dataset.none === '1'), 250);
  }, { passive: true });
}

/* ================================================================= router */
const scrollMem = {};
const focusMem = {};          // hash -> the data-fav key of the tile or row the d-pad left from
let curHash = null;
function go(h) {
  /* a chosen section lights up at once: on a television the new screen can
     take a moment to draw, and the old pill stayed lit until it had */
  const pills = $$('#nav .pill'); const pill = pills.find(p => p.dataset.go === h);
  if (pill) { pills.forEach(p => p.classList.toggle('on', p === pill)); if (TVMODE) setTvFocus(pill); }
  if (location.hash === h) route(); else location.hash = h;
}
$$('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
$('#tsearch').onclick = () => openSearch();
$('#bn-search').onclick = () => openSearch();
$('#tfavs').onclick = () => go('#/favs');
$('#tsystem').innerHTML = I.gear; $('#tsystem').title = 'Preferences';
$('#tsystem').onclick = e => { e.stopPropagation(); openPrefsSheet(); };
addEventListener('hashchange', route);
addEventListener('scroll', () => {
  $('#top').classList.toggle('solid', scrollY > 30);
  if (curHash != null) scrollMem[curHash] = scrollY;
}, { passive: true });

function parseHash() {
  const h = (location.hash || '#/').slice(1);
  const [path, qs] = h.split('?');
  return { path: path || '/', q: new URLSearchParams(qs || '') };
}
async function route() {
  /* remember which tile or row the ring was on, so Back can return to it */
  if (curHash != null && TVMODE && tvEl && tvEl.isConnected && tvEl.dataset && tvEl.dataset.fav) focusMem[curHash] = tvEl.dataset.fav;
  closeSearch(); closeNP();
  const { path, q } = parseHash();
  curHash = location.hash || '#/';
  stampDepth();
  document.body.classList.toggle('canback', !!parentHash(curHash));
  const seg = path.split('/').filter(Boolean);
  /* Each page draws into a fresh #view. They all shared one element, so a page
     still loading when another was opened kept appending to it: Home's shelves
     (which take seconds on the TV) turned up above or below the album that
     replaced it, and took d-pad stops with them (17 Oct 2026). A stale page's
     late work now lands in the detached old element, unseen. */
  const old = $('#view');
  const v = document.createElement('main'); v.id = 'view';
  old.parentNode.replaceChild(v, old);
  hideRail();
  resetFocusables();
  v.className = 'fadein';
  /* nav highlight */
  const sect = seg[0] || '';
  const pillSect = sect === 'artist' ? 'artists' : sect === 'album' ? 'albums' : sect === 'genre' ? 'genres' : sect === 'decade' ? 'decades' : sect === 'discs' ? 'karaoke' : sect;
  $$('#nav .pill').forEach(p => p.classList.toggle('on', p.dataset.go === '#/' + pillSect));
  $$('#bnav [data-go]').forEach(p => p.classList.toggle('on', p.dataset.go === '#/' + (sect === 'discs' ? 'karaoke' : sect)));
  /* a section root lights its pill and takes the ring NOW, not when the page
     has drawn: after Back the ring sat on the old section's pill while Home
     was already lit (user, 4 Sep 2026). A Back that will restore a remembered
     tile keeps its ring for that. */
  if (TVMODE && !(seg.length > 1 && seg[0] !== 'lib') && !(NAV.back && focusMem[curHash])) tvFocusSection();
  try {
    if (!seg.length) await vHome(v);
    else if (seg[0] === 'artists') await vArtists(v);
    else if (seg[0] === 'artist' && seg[2] === 'songs') await vArtistSongs(v, +seg[1]);
    else if (seg[0] === 'artist') { await vArtist(v, +seg[1]); discsForArtist(v); }
    else if (seg[0] === 'albums') await vAlbums(v, q);
    else if (seg[0] === 'album') await vAlbum(v, +seg[1], q);
    else if (seg[0] === 'collection') await vCollection(v, +seg[1]);
    else if (seg[0] === 'genres') await vGenres(v);
    else if (seg[0] === 'genre') await vGenre(v, +seg[1], q);
    else if (seg[0] === 'decades') await vDecades(v);
    else if (seg[0] === 'decade') await vDecade(v, +seg[1], q);
    else if (seg[0] === 'playlist') await vPlaylist(v, seg[1]);
    else if (seg[0] === 'pl') await (seg[1] ? vUserPlaylist(v, +seg[1]) : vPlaylists(v));
    else if (seg[0] === 'favs') await vFavs(v);
    else if (seg[0] === 'karaoke') await vKaraoke(v);
    else if (seg[0] === 'discs') await vDiscs(v);
    else if (seg[0] === 'system') await vSystem(v);
    else if (seg[0] === 'lib') await vLibrary(v, decodeURIComponent(seg[1] || ''));
    else await vHome(v);
  } catch (err) {
    console.error(err);
    v.innerHTML = '<div class="empty">Could not reach the jukebox server. ' + esc(err.message || '') + '</div>';
  }
  if (v !== $('#view')) return;             // another page was opened meanwhile: its own route() places the ring
  requestAnimationFrame(() => {
    scrollTo(0, scrollMem[curHash] || 0);
    if (TVMODE) { if (NAV.back) tvFocusBack(curHash); else tvFocusLanding(seg); }
    NAV.back = false;
  });
}
/* Back returns the ring to the tile or row you left from -- the artist you
   opened, the album you played -- once the grid has streamed it in; failing
   that, the section's pill. */
function tvFocusBack(hash) {
  const key = focusMem[hash];
  if (!key) { tvFocusSection(); return; }
  let tries = 0;
  const look = () => {
    const el = document.querySelector('#view [data-fav="' + key.replace(/"/g, '\\"') + '"]');
    if (el && el.offsetParent !== null) { setTvFocus(el); return; }
    if (++tries < 25) setTimeout(look, 80); else tvFocusSection();
  };
  look();
}

async function vCollection(v, id) {
  const c = await api('/api/collection/' + id);
  if (c.kind !== 'set') return vDiscAlbum(v, c);
  if (c.art_id || c.art_album_id) paletteFromAlbum(c.art_album_id || c.art_id, c.name, c.artist);
  const yrs = c.year_min && c.year_max && c.year_max !== c.year_min
    ? c.year_min + '–' + c.year_max : (c.year_min || '');
  const head = document.createElement('div'); head.className = 'dethead';
  head.innerHTML = '<div class="dart stack">' + artImg(c.art_album_id, 800, c.name, c.artist) + '</div>' +
    '<div class="dmeta"><div class="eyebrow">Collection</div><h1>' + esc(c.name) + '</h1>' +
    '<div class="dsub"><a data-a="artist">' + esc(c.artist) + '</a> · ' + c.n_discs +
    ' discs · ' + c.n_tracks + ' tracks · ' + fmtLong(c.duration) +
    (yrs ? ' · ' + yrs : '') + '</div>' +
    '<div class="actrow"></div></div>';
  head.querySelector('[data-a="artist"]').onclick = () => go('#/artist/' + c.artist_id);
  reg(head.querySelector('[data-a="artist"]'));
  v.appendChild(head);
  const act = head.querySelector('.actrow');
  const mk = (cls, html, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.innerHTML = html; b.onclick = fn; reg(b); act.appendChild(b); return b; };
  splitPlay(act, () => playCollection(c.id, false, c.name));
  mk('sec', I.shuf + 'Shuffle', () => playCollection(c.id, true, c.name));
  mk('sec', I.queue, () => openTrackSheet(
    async () => collTracks(await api('/api/collection/' + c.id + '/tracks')),

/* ================================================================= tile builders */
/* Appending a few thousand tiles in one loop locks up a television for
   seconds. Hand the browser a chunk per frame instead: the first screenful is
   up immediately and the rest streams in while it is being looked at. */
function fillGrid(grid, items, make, chunk) {
  chunk = chunk || 60;
  let i = 0;
  const step = () => {
    const frag = document.createDocumentFragment();
    const end = Math.min(i + chunk, items.length);
    for (; i < end; i++) frag.appendChild(make(items[i]));
    grid.appendChild(frag);
    if (i < items.length) requestAnimationFrame(step);
  };
  step();
}

function trackRow(t, i, ctx) {
  const d = document.createElement('div');
  d.className = 'tr' + (ctx && ctx.thumbs ? ' witha' : '');
  d.dataset.tid = t.id;
  const no = ctx && ctx.thumbs

  /* the mic slot is always in the grid, hidden or not, so durations line up */
  d.innerHTML = no + '<div class="ti"><div class="t1">' + esc(t.title) + '</div>' +
    (sub ? '<div class="t2">' + esc(sub) + '</div>' : '') +

    (t.stems === 'ready' ? 'Sing this — ready' : (t.stems === 'running' ? 'Preparing…' : (t.stems === 'queued' ? 'Queued for preparing' : 'Sing this'))) + '"' + (rowMic(t) ? '' : ' hidden') + '>' + I.kmic + '</button>' +
    '<button class="tradd" title="Add to playlist">' + I.plus + '</button>' +
    '<div class="du">' + fmtD(t.duration) + '</div>';
  d.dataset.fav = 'track:' + t.id; d.dataset.t = t.title;
  if (t.album_id) { d.dataset.pal = t.album_id; d.dataset.s = t.artist || ''; }
  d.querySelector('.tradd').onclick = e => {
    e.stopPropagation();
    openTrackSheet([t], t.title, { track_ids: [t.id] });
  };
  d.querySelector('.trmic').onclick = e => { e.stopPropagation(); karPressTrack(t); };
  d.onclick = e => {
    if (e.target.closest('.tradd') || e.target.closest('.trmic')) return;
    const t2 = e.target.closest('.t2');
    if (t2 && t.album_id && ctx && ctx.subLinks) { go('#/album/' + t.album_id + '?t=' + t.id); return; }
    ctx.play(i);
  };
  reg(d);
  const cur = trackOf(); if (cur && cur.id === t.id) d.classList.add('now');
  return d;
}
/* A row shows a microphone only for a song known to have time-synced lyrics.
   The list endpoints answer from the cache alone; warmMics() resolves the rest
   once the list is on screen. */
function rowMic(t) { return t.lyrics === 'yes' && KAR.avail !== false; }
function warmMics(list, tracks) {
  if (KAR.avail === false) return;
  /* a long list is capped: an artist page should not start ten minutes of
     lookups; the rest fill in as their albums are opened */
  const ids = tracks.filter(t => t.lyrics === 'unknown').map(t => t.id).slice(0, 120);
  if (!ids.length) return;
  const byId = {}; tracks.forEach(t => { byId[t.id] = t; });
  let chain = Promise.resolve();
  for (let i = 0; i < ids.length; i += 40) {
    const chunk = ids.slice(i, i + 40);
    chain = chain.then(() => {
      if (!list.isConnected) return;            // the page has moved on
      return api('/api/lyrics/warm?ids=' + chunk.join(',')).then(res => {
        Object.keys(res).forEach(id => {
          const t = byId[id]; if (!t) return;
          t.lyrics = res[id];
          if (res[id] !== 'yes' || KAR.avail === false) return;
          const b = list.querySelector('.tr[data-tid="' + id + '"] .trmic');
          if (b) b.hidden = false;
        });
      });
    });
  }
  chain.catch(() => {});
}
function hgroup(title, sub, moreHash, moreLabel) {

  if (moreHash) {

    b.onclick = () => go(moreHash); reg(b); d.appendChild(b);

}

  c.className = 'chip' + (hot ? ' hot' : ''); c.innerHTML = html;
  if (onclick) c.onclick = onclick;

/* ================================================================= alphabet rail */
let railScrub = false;
function showRail(letters, prefix) {
  const rail = $('#rail'); rail.innerHTML = ''; rail.classList.add('show');
  const list = letters.map(L => ({ letter: L.letter, n: L.n }));
  list.forEach(L => {
    const b = document.createElement('div');
    b.className = 'rl' + (L.n ? '' : ' dim');
    b.textContent = L.letter === '#' ? '#' : L.letter.toUpperCase();
    b.onclick = () => jumpLetter(prefix, L.letter);
    if (L.n) reg(b);                                 // reachable from a right-column row with Right
    rail.appendChild(b);
  });
  const pick = y => {
    const r = rail.getBoundingClientRect();
    const idx = Math.min(list.length - 1, Math.max(0, Math.floor((y - r.top) / r.height * list.length)));
    return list[idx];
  };
  rail.onpointerdown = e => {
    railScrub = true; rail.setPointerCapture(e.pointerId);
    const L = pick(e.clientY); if (L && L.n) { bigL(L.letter); jumpLetter(prefix, L.letter, true); }
    e.preventDefault();
  };
  rail.onpointermove = e => {
    if (!railScrub) return;
    const L = pick(e.clientY); if (L && L.n) { bigL(L.letter); jumpLetter(prefix, L.letter, true); }
  };
  rail.onpointerup = () => { railScrub = false; setTimeout(() => $('#bigL').classList.remove('on'), 350); };
}
function hideRail() { $('#rail').classList.remove('show'); }
function bigL(l) { const b = $('#bigL'); b.textContent = l === '#' ? '#' : l.toUpperCase(); b.classList.add('on'); }
function jumpLetter(prefix, letter, instant) {
  const el = document.getElementById(prefix + '-' + (letter === '#' ? 'num' : letter));
  if (!el) return;
  const y = el.getBoundingClientRect().top + scrollY - 64;
  scrollTo({ top: y, behavior: instant || REDUCED ? 'auto' : 'smooth' });
}

      '<div class="hart" data-pal="' + heroT.album_id + '" data-t="' + esc(heroT.album || heroT.title) + '" data-s="' + esc(heroT.artist) + '">' +
      artImg(heroT.album_id, 800, heroT.album || heroT.title, heroT.artist) + '</div>' +
      '<div class="hinfo"><div class="hkick">' + esc(kick) + '</div>' +
      '<h1>' + esc(heroT.title) + '</h1>' +
      '<div class="hsub"><a data-a="art">' + esc(heroT.artist) + '</a> — <a data-a="alb">' + esc(heroT.album) + '</a></div>' +
      '<button class="hplay">' + I.play + (trackOf() && !audio.paused ? 'Open player' : 'Play') + '</button>' +
      '<div class="hstats">' + nf(ax.tracks) + ' tracks · ' + nf(ax.axes[0].count) + ' artists · ' + nf(ax.axes[1].count) + ' albums · ' + nf(Math.round(ax.hours)) + ' hours</div>' +
      '</div>';
    hero.querySelector('.hart').onclick = () => go('#/album/' + heroT.album_id);
    hero.querySelector('[data-a="alb"]').onclick = () => go('#/album/' + heroT.album_id);
    hero.querySelector('[data-a="art"]').onclick = () => goArtistByName(heroT.artist);
    hero.querySelector('.hplay').onclick = () => {
      if (trackOf()) openNP();
      else playAlbum(heroT.album_id, heroT.id).then(openNP);
    };
    reg(hero.querySelector('.hart')); reg(hero.querySelector('.hplay'));
    if (!trackOf()) paletteFromAlbum(heroT.album_id, heroT.album, heroT.artist);
  } else {
    hero.innerHTML = '<div class="hinfo"><div class="hkick">The library</div>' +
      '<h1>' + nf(ax.tracks) + ' tracks, ready.</h1>' +
      '<div class="hstats">' + nf(ax.axes[0].count) + ' artists · ' + nf(ax.axes[1].count) + ' albums · ' + nf(Math.round(ax.hours)) + ' hours</div></div>';
  }
  v.appendChild(hero);

  /* -------- recently played (dedup by album) */
  if (recent.length) {
    v.appendChild(hgroup('Recently played', null, '#/playlist/recent'));
    const strip = document.createElement('div'); strip.className = 'strip';
    const seen = new Set();
    for (const r of recent) {
      if (seen.has(r.album_id)) continue; seen.add(r.album_id);
      const d = document.createElement('div'); d.className = 'tile';
      d.innerHTML = '<div class="cov">' + artImg(r.album_id, 300, r.album, r.artist) + '</div>' +
        '<div class="tt">' + esc(r.album) + '</div><div class="ts">' + esc(r.artist) + (r.room ? ' · ' + esc(r.room) : '') + '</div>';
      d.dataset.pal = r.album_id; d.dataset.t = r.album; d.dataset.s = r.artist;
      d.dataset.fav = 'album:' + r.album_id;
      d.onclick = () => go('#/album/' + r.album_id + '?t=' + r.id);
      reg(d); strip.appendChild(d);
      if (seen.size >= 25) break;
    }
    v.appendChild(strip);
  }

  /* -------- recently added: by the newest file each album holds */
  let added = [];
  try { added = await api('/api/recent-added?limit=25'); } catch (e) { added = []; }
  if (added.length) {
    v.appendChild(hgroup('Recently added', 'the newest records in the library'));
    const strip = document.createElement('div'); strip.className = 'strip';
    for (const a of added) {
      const when = a.added ? new Date(a.added * 1000).toLocaleDateString([], { month: 'short', year: 'numeric' }) : '';
      if (a.kind === 'collection' || a.kind === 'discalbum') {
        /* a multi-disc album or a box set: its own tile, dated like the others */
        const d = a.kind === 'collection' ? collectionTile(a) : discAlbumTile(a);
        const ts = d.querySelector('.ts');
        if (ts) ts.textContent = (a.artist || '') + (when ? ' · ' + when : '');
        strip.appendChild(d); continue;
      }
      const d = document.createElement('div'); d.className = 'tile';
      d.innerHTML = '<div class="cov">' + artImg(a.id, 300, a.title, a.artist) + '</div>' +
        '<div class="tt">' + esc(a.title) + '</div><div class="ts">' + esc(a.artist) + (when ? ' · ' + esc(when) : '') + '</div>';
      d.dataset.pal = a.id; d.dataset.t = a.title; d.dataset.s = a.artist;
      d.dataset.fav = 'album:' + a.id;
      d.onclick = () => go('#/album/' + a.id);
      reg(d); strip.appendChild(d);
    }
    v.appendChild(strip);
  }

  /* -------- sub-libraries: every scanned folder that is not the main one */
  let pools = [];
  try { pools = await api('/api/pools'); } catch (e) { pools = []; }
  if (pools.length) {
    v.appendChild(hgroup('Libraries', 'kept apart from the main collection'));
    const strip = document.createElement('div'); strip.className = 'strip';
    for (const p of pools) {
      const d = document.createElement('div'); d.className = 'pcard tile';
      d.innerHTML = '<div class="fan"><div class="fc"></div><div class="fc"></div><div class="fc"></div></div>' +
        '<div class="tt">' + esc(p.pool) + '</div><div class="ts">' + nf(p.n_albums) + (p.n_albums === 1 ? ' album' : ' albums') + ' · ' + nf(p.n_tracks) + ' songs</div>';
      const fcs = d.querySelectorAll('.fc');
      (p.art || []).slice(0, 3).forEach((id, i) => { fcs[i].innerHTML = artImg(id, 300, p.pool, ''); });
      d.onclick = () => go('#/lib/' + encodeURIComponent(p.pool));
      reg(d); strip.appendChild(d);
    }
    v.appendChild(strip);
  }

  /* -------- smart playlists as record fans */
  const pls = playlists.filter(p => p.n > 0);
  if (pls.length) {
    v.appendChild(hgroup('Mixes', 'built from real listening'));
    const strip = document.createElement('div'); strip.className = 'strip';
    for (const p of pls) {
      const d = document.createElement('div'); d.className = 'pcard tile';
      d.innerHTML = '<div class="fan"><div class="fc"></div><div class="fc"></div><div class="fc"></div></div>' +
        '<div class="tt">' + esc(p.name) + '</div><div class="ts">' + nf(p.n) + ' tracks · ' + esc(p.blurb) + '</div>';
      d.onclick = () => go('#/playlist/' + p.key);
      reg(d); strip.appendChild(d);
      api('/api/playlist/' + p.key + '?limit=24').then(ts => {
        const ids = [...new Set(ts.map(t => t.album_id))].slice(0, 3);
        const fcs = d.querySelectorAll('.fc');
        ids.forEach((id, i) => {
          const t = ts.find(x => x.album_id === id);
          fcs[i].innerHTML = artImg(id, 300, t.album, t.artist);
        });
        if (ids[0]) { d.dataset.pal = ids[0]; }
      }).catch(() => { });
    }
    v.appendChild(strip);
  }

  /* -------- genre shelves */
  v.appendChild(hgroup('Shelves', genres.length + ' genres', '#/genres'));
  const gs = document.createElement('div'); gs.className = 'strip';
  for (const g of genres.slice(0, 12)) gs.appendChild(genreCard(g));
  v.appendChild(gs);

  /* -------- decades */
  v.appendChild(hgroup('Eras', null, '#/decades'));
  const ds = document.createElement('div'); ds.className = 'strip';
  for (const dd of decades) ds.appendChild(decadeCard(dd));
  v.appendChild(ds);
}
function genreCard(g) {

  d.innerHTML = '<div class="quad">' + (quad || '<img src="' + sleeve('g' + g.id, g.shelf, '').url + '" style="grid-column:span 2;grid-row:span 2" alt="">') + '</div>' +
    '<div class="tt">' + esc(g.shelf) + '</div><div class="ts">' + nf(g.n_albums) + ' albums · ' + nf(g.n_tracks) + ' tracks</div>';

function decadeCard(dd) {
