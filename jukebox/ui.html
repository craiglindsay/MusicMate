<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MusicMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================ tokens */
:root{
  --bg:#0b0a0e; --panel:rgba(20,18,26,.62); --panel2:rgba(28,25,38,.7);
  --ink:#efe9df; --ink2:#b7af9f; --ink3:#7d7668;
  --acc:#e8a04c; --acc-soft:rgba(232,160,76,.16);
  --g0:#0b0a0e; --g1:#1c2733; --g2:#e8a04c;
  --rail-w:26px; --top-h:58px; --bar-h:72px; --bnav-h:0px;
  --r:14px; --shadow:0 18px 50px -12px rgba(0,0,0,.65);
  --ease:cubic-bezier(.22,1.2,.36,1);
}
/* A 10-foot UI is not a styling problem, it is a distance problem: the same
   layout has to read from three metres. Rather than a second set of sizes,
   the whole page is zoomed -- layout, art and hit targets together -- so
   nothing goes out of proportion. Media queries still see the real viewport,
   so a zoomed 1920 TV keeps the desktop layout instead of collapsing to the
   phone one. */
/* zoom belongs on the ROOT, not on body: a fixed, inset:0 overlay -- the
   now-playing panel, search, every sheet -- resolves against the initial
   containing block, so zooming body alone would leave them covering a fraction
   of the screen. */
html{zoom:var(--uiscale,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 'Sora',system-ui,sans-serif;
  min-height:100vh; overflow-x:hidden;
  overscroll-behavior-y:none;
}
::selection{background:var(--acc-soft)}
a{color:inherit}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:.2px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
img{display:block}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2c2836;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================ backdrop */
#gl,#glfall{position:fixed;inset:0;z-index:-2;pointer-events:none}
#glfall{
  opacity:0;transition:opacity 1s;
  background:
    radial-gradient(120vmax 90vmax at 18% 8%, var(--g2) 0%, transparent 42%),
    radial-gradient(100vmax 80vmax at 85% 90%, var(--g1) 0%, transparent 52%),
    var(--g0);
  filter:saturate(.85) brightness(.55);
}
body.nogl #glfall{opacity:1;animation:drift 36s ease-in-out infinite alternate}
@keyframes drift{
  0%{background-position:0 0, 0 0;filter:saturate(.85) brightness(.5) hue-rotate(0deg)}
  100%{background-position:6vw -4vh, -5vw 5vh;filter:saturate(1) brightness(.62) hue-rotate(14deg)}
}
#veil{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg, rgba(11,10,14,.42) 0%, rgba(11,10,14,.12) 30%, rgba(11,10,14,.55) 78%, rgba(11,10,14,.85) 100%)}

/* ============================================================ chrome */
#top{
  position:fixed;top:0;left:0;right:0;z-index:40;height:var(--top-h);
  display:flex;align-items:center;gap:14px;padding:0 18px;
  background:linear-gradient(180deg, rgba(11,10,14,.88), rgba(11,10,14,0));
  transition:background .3s;
}
#top.solid{background:rgba(13,12,17,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#brand{font-family:'Fraunces',serif;font-style:italic;font-weight:700;font-size:21px;
  letter-spacing:.5px;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:9px}
#brand .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);transition:background .6s,box-shadow .6s}
#nav{display:flex;gap:4px;margin:0 auto}
.pill{padding:7px 15px;border-radius:999px;color:var(--ink2);font-size:13.5px;font-weight:500;
  transition:color .2s, background .2s;position:relative}
.pill:hover{color:var(--ink)}
.pill.on{color:var(--ink);background:rgba(255,255,255,.08)}
.pill.on::after{content:'';position:absolute;left:50%;bottom:1px;width:14px;height:2px;border-radius:2px;
  background:var(--acc);transform:translateX(-50%)}
#topbtns{display:flex;gap:6px;align-items:center}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);transition:.2s}
.iconbtn:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.iconbtn svg{width:19px;height:19px}

#bnav{display:none}
body.phone #bnav{
  display:flex;position:fixed;left:0;right:0;bottom:0;z-index:41;height:56px;
  padding-bottom:env(safe-area-inset-bottom);
  background:rgba(13,12,17,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,.06);
}
body.phone{--bnav-h:calc(56px + env(safe-area-inset-bottom))}
body.phone #nav{display:none}
#bnav button{flex:1 1 0;min-width:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;
  color:var(--ink3);font-size:9.5px;letter-spacing:.4px;white-space:nowrap}
#bnav button.on{color:var(--acc)}
#bnav svg{width:21px;height:21px}

/* ============================================================ view */
#view{position:relative;z-index:1;padding:calc(var(--top-h) + 8px) 22px calc(var(--bar-h) + var(--bnav-h) + 34px);
  max-width:1560px;margin:0 auto;min-height:100vh}
body.phone #view{padding-left:14px;padding-right:calc(var(--rail-w) + 8px)}
.fadein{animation:vin .34s var(--ease)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.eyebrow{font-size:11px;letter-spacing:2.4px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:0 0 6px}
.hgroup{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:26px 2px 14px}
.hgroup h2{font-size:26px}
.hgroup .sub{color:var(--ink3);font-size:13px}
.hgroup .more{margin-left:auto;color:var(--ink2);font-size:13px;border-radius:999px;padding:5px 12px}
.hgroup .more:hover{color:var(--ink);background:rgba(255,255,255,.08)}

/* chips: the traversal graph */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);
  font-size:12.5px;color:var(--ink2);transition:.18s;white-space:nowrap}
.chip:hover{color:var(--ink);background:rgba(255,255,255,.13);transform:translateY(-1px)}
.chip.hot{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.chip b{font-weight:600;color:inherit}

/* ============================================================ tiles + grids */
.grid{display:grid;gap:18px 14px;grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
body.phone .grid{grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px}
body.tv .grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:26px 20px}
.tile{position:relative;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 240px}
.cov{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#17141d;
  box-shadow:0 10px 26px -10px rgba(0,0,0,.7);
  transition:transform .3s var(--ease), box-shadow .3s}
.cov img{width:100%;height:100%;object-fit:cover}
.cov::after{content:'';position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
.tile:hover .cov{transform:translateY(-5px) scale(1.025);box-shadow:var(--shadow)}
.tile .tt{margin:9px 2px 0;font-size:13px;font-weight:500;line-height:1.3;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .ts{margin:2px 2px 0;font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .play{position:absolute;right:8px;bottom:8px;width:38px;height:38px;border-radius:50%;
  background:rgba(12,11,16,.75);backdrop-filter:blur(6px);display:grid;place-items:center;
  opacity:0;transform:translateY(6px);transition:.22s var(--ease);color:var(--ink)}
.tile:hover .play{opacity:1;transform:none}
.tile .play:hover{background:var(--acc);color:#141018}
.tile .play svg{width:16px;height:16px;margin-left:2px}
body.phone .tile .play, body.tv .tile .play{display:none}
.round .cov{border-radius:50%}
.round .tt{text-align:center}
.round .ts{text-align:center}

/* horizontal strips */
.strip{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px;scroll-snap-type:x proximity;
  margin:0 -22px;padding-left:22px;padding-right:22px;scroll-padding:0 22px}
body.phone .strip{margin:0 -14px;padding-left:14px;padding-right:14px;scroll-padding:0 14px}
.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:0 0 auto;width:158px;min-width:0;scroll-snap-align:start;content-visibility:visible}
body.phone .strip .tile{width:122px}
body.tv .strip .tile{width:196px}
.strip .pcard{width:196px}

/* letter sections */
.lsec{scroll-margin-top:calc(var(--top-h) + 6px)}
.lhead{display:flex;align-items:center;gap:14px;margin:30px 2px 14px}
.lhead .L{font-family:'Fraunces',serif;font-size:34px;font-weight:600;font-style:italic;color:var(--acc);line-height:1}
.lhead .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.14),transparent)}
.lhead .n{font-size:11.5px;color:var(--ink3)}

/* ============================================================ alphabet rail */
#rail{position:fixed;right:4px;top:50%;transform:translateY(-50%);z-index:35;
  display:none;flex-direction:column;align-items:center;padding:8px 4px;border-radius:14px;
  background:rgba(15,14,20,.55);backdrop-filter:blur(8px);
  touch-action:none;user-select:none}
#rail.show{display:flex}
#rail .rl{font-size:10px;font-weight:600;color:var(--ink2);padding:1px 6px;line-height:1.35;
  cursor:pointer;border-radius:6px}
#rail .rl.dim{color:#453f37;pointer-events:none}
#rail .rl:hover{color:var(--acc)}
body.tv #rail .rl{font-size:13px;line-height:1.5}
#bigL{position:fixed;right:64px;top:50%;transform:translateY(-50%) scale(.8);z-index:36;
  width:92px;height:92px;border-radius:24px;display:grid;place-items:center;
  background:rgba(18,16,24,.9);backdrop-filter:blur(10px);box-shadow:var(--shadow);
  font-family:'Fraunces',serif;font-style:italic;font-size:52px;color:var(--acc);
  opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
#bigL.on{opacity:1;transform:translateY(-50%) scale(1)}

/* ============================================================ hero */
#hero{display:flex;gap:34px;align-items:center;padding:26px 4px 8px;min-height:34vh}
#hero .hart{flex:0 0 clamp(180px,26vw,320px);border-radius:16px;overflow:hidden;aspect-ratio:1;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.08);cursor:pointer;
  transition:transform .4s var(--ease)}
#hero .hart:hover{transform:scale(1.02) rotate(-.5deg)}
#hero .hart img{width:100%;height:100%;object-fit:cover}
#hero .hinfo{min-width:0}
#hero .hkick{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--acc);font-weight:600}
#hero h1{font-size:clamp(26px,4.4vw,52px);font-weight:640;line-height:1.06;margin:8px 0 4px;
  font-variation-settings:'opsz' 90;text-wrap:balance}
#hero .hsub{color:var(--ink2);font-size:15px}
#hero .hsub a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25);cursor:pointer}
#hero .hsub a:hover{color:var(--acc);border-color:var(--acc)}
#hero .hstats{margin-top:14px;color:var(--ink3);font-size:12.5px;letter-spacing:.3px}
#hero .hplay{margin-top:18px;display:inline-flex;align-items:center;gap:10px;padding:11px 22px;
  border-radius:999px;background:var(--acc);color:#161018;font-weight:600;font-size:14px;
  box-shadow:0 8px 30px -8px var(--acc);transition:.2s var(--ease)}
#hero .hplay:hover{transform:translateY(-2px);filter:brightness(1.08)}
#hero .hplay svg{width:15px;height:15px}
body.phone #hero{flex-direction:column;align-items:flex-start;gap:18px;min-height:0;padding-top:12px}
body.phone #hero .hart{flex-basis:auto;width:58vw;align-self:center}

/* genre + decade + playlist cards */
.gcard{cursor:pointer}
.gcard .quad{display:grid;grid-template-columns:1fr 1fr;gap:2px;border-radius:12px;overflow:hidden;
  aspect-ratio:1;background:#151220;box-shadow:0 10px 26px -10px rgba(0,0,0,.7);
  transition:transform .3s var(--ease), box-shadow .3s}
.gcard:hover .quad{transform:translateY(-5px);box-shadow:var(--shadow)}
.gcard .quad img{width:100%;height:100%;object-fit:cover;aspect-ratio:1}
.dcard{flex:0 0 172px;border-radius:14px;padding:20px 18px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(150deg, var(--panel2), rgba(14,12,20,.72));
  border:1px solid rgba(255,255,255,.07);transition:.25s var(--ease)}
.dcard:hover{transform:translateY(-4px);border-color:rgba(255,255,255,.16)}
.dcard .dy{font-family:'Fraunces',serif;font-size:36px;font-weight:640;font-style:italic;line-height:1;color:var(--ink)}
.dcard .dn{margin-top:8px;font-size:11.5px;color:var(--ink3)}
.dcard::after{content:'';position:absolute;right:-24px;bottom:-30px;width:110px;height:110px;border-radius:50%;
  background:radial-gradient(circle, var(--acc-soft), transparent 70%)}
.dcard.dim{opacity:.45;cursor:default}
.dcard.dim:hover{transform:none}
.pcard{flex:0 0 196px;cursor:pointer}
.pcard .fan{position:relative;aspect-ratio:1;margin-bottom:10px}
.pcard .fan .fc{position:absolute;inset:6% 6%;border-radius:10px;overflow:hidden;
  box-shadow:0 14px 30px -12px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.09);
  transition:transform .35s var(--ease);background:#17141d}
.pcard .fan .fc img{width:100%;height:100%;object-fit:cover}
.pcard .fan .fc:nth-child(1){transform:rotate(-7deg) translate(-7%,2%)}
.pcard .fan .fc:nth-child(2){transform:rotate(4deg) translate(6%,-2%)}
.pcard .fan .fc:nth-child(3){transform:rotate(-1deg)}
.pcard:hover .fan .fc:nth-child(1){transform:rotate(-11deg) translate(-11%,1%)}
.pcard:hover .fan .fc:nth-child(2){transform:rotate(8deg) translate(10%,-3%)}
.pcard:hover .fan .fc:nth-child(3){transform:rotate(0) translateY(-4%)}

/* ============================================================ detail pages */
.dethead{display:flex;gap:30px;align-items:flex-end;padding:14px 2px 6px;flex-wrap:wrap}
.dethead .dart{flex:0 0 clamp(160px,22vw,270px);aspect-ratio:1;border-radius:14px;overflow:hidden;
  box-shadow:0 26px 70px -18px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.09)}
.dethead .dart img{width:100%;height:100%;object-fit:cover}
.dethead .dmeta{min-width:260px;flex:1}
.dethead h1{font-size:clamp(24px,3.6vw,44px);font-weight:640;line-height:1.08;margin:6px 0 6px;text-wrap:balance}
.dethead .dsub{color:var(--ink2);font-size:14px}
.dethead .dsub a{cursor:pointer;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
.dethead .dsub a:hover{color:var(--acc);border-color:var(--acc)}
.actrow{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:999px;
  font-weight:600;font-size:13.5px;transition:.2s var(--ease)}
.btn svg{width:14px;height:14px}
.btn.pri{background:var(--acc);color:#161018;box-shadow:0 8px 26px -10px var(--acc)}
.btn.pri:hover{transform:translateY(-2px);filter:brightness(1.08)}
.btn.sec{background:rgba(255,255,255,.09);color:var(--ink)}
.btn.sec:hover{background:rgba(255,255,255,.16)}
.btn.hearted{color:#ff7b93}
body.phone .dethead{gap:16px}
body.phone .dethead .dart{flex-basis:38vw;min-width:130px}

/* track rows */
.trlist{margin-top:18px}
.tr{display:grid;grid-template-columns:34px 1fr auto auto auto;gap:0 12px;align-items:center;
  padding:6px 12px;border-radius:10px;cursor:pointer;transition:background .15s}
.tr:hover{background:rgba(255,255,255,.06)}
.tr .no{color:var(--ink3);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
/* title and artist share one line: a track list should be a list, not a
   stack of two-line cards (asked for, 1 Sep 2026) */
.tr .ti{min-width:0;display:flex;align-items:baseline;gap:9px}
.tr .ti .t1{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.tr .ti .t2{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;flex:0 1 auto;max-width:45%}
.tr .ti .t2:hover{color:var(--acc)}
.tr .du{color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums}
.tr.now .t1{color:var(--acc)}
.tr.now .no{color:var(--acc)}
.tr.flash{animation:flash 2s}
@keyframes flash{0%,60%{background:var(--acc-soft)}100%{background:transparent}}
/* rows with a thumbnail (playlists, search, history) keep two lines: their
   second line is an album, which needs the room */
.tr.witha{grid-template-columns:44px 1fr auto auto auto;padding:8px 12px}
.tr.witha .ti,body.phone .tr .ti{display:block}
.tr.witha .ti .t2,body.phone .tr .ti .t2{max-width:none}
/* the microphone on a row: only drawn when the song can be sung, so it is a
   signal, not furniture, and stays visible without hover */
.tr .trmic{background:none;border:0;padding:5px;cursor:pointer;color:var(--acc);opacity:.72;
  display:flex;align-items:center;line-height:0;transition:opacity .15s}
.tr .trmic svg{width:15px;height:15px}
.tr .trmic:hover,.tr .trmic:focus{opacity:1}
.tr .trmic[hidden]{display:none}
/* already split: the same dot the Now Playing mic wears */
.tr .trmic{position:relative}
.tr .trmic.ready::after{content:'';position:absolute;top:1px;right:0;width:7px;height:7px;
  border-radius:50%;background:var(--acc);border:2px solid #14121a}
/* queued or running: dimmed, like the Now Playing mic while it waits */
.tr .trmic.busy{opacity:.45}
/* on a wide screen an album is two columns rather than a tall single one;
   a disc heading spans both and restarts the flow below it */
@media (min-width:1200px){
  body:not(.phone) .trlist.cols{column-count:2;column-gap:36px}
  body:not(.phone) .trlist.cols .tr{break-inside:avoid;page-break-inside:avoid}
  body:not(.phone) .trlist.cols>.eyebrow{column-span:all}
}
.tr .thumb{width:40px;height:40px;border-radius:7px;overflow:hidden;background:#17141d}
.tr .thumb img{width:100%;height:100%;object-fit:cover}

/* sort pills */
.sortrow{display:flex;gap:8px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.sortrow .sp{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--ink3);background:rgba(255,255,255,.05)}
.sortrow .sp.on{color:var(--ink);background:rgba(255,255,255,.13)}

/* ============================================================ now bar */
#nowbar{position:fixed;left:12px;right:12px;bottom:calc(var(--bnav-h) + 10px);z-index:45;height:var(--bar-h);
  display:none;align-items:center;gap:14px;padding:0 16px 0 10px;border-radius:18px;
  background:rgba(17,15,23,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:var(--shadow), inset 0 0 0 1px rgba(255,255,255,.07);cursor:pointer;
  transition:transform .35s var(--ease)}
#nowbar.show{display:flex}
#nowbar .bart{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:#17141d}
#nowbar .bart img{width:100%;height:100%;object-fit:cover}
#nowbar .bmeta{min-width:0;flex:1}
#nowbar .bt1{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowbar .bt2{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nowbar .bctl{display:flex;gap:4px;align-items:center}
#nowbar .bctl .iconbtn:hover{color:var(--acc)}
#nowbar #bplay{width:44px;height:44px;background:rgba(255,255,255,.1);border-radius:50%}
#nowbar #bplay:hover{background:var(--acc);color:#161018}
#nowbar #bprog{position:absolute;left:14px;right:14px;top:0;height:2.5px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
#nowbar #bprog i{display:block;height:100%;width:0;background:var(--acc);transition:width .5s linear}
body.phone #nowbar .bctl .skipb{display:none}
@media(min-width:900px){ #nowbar{left:50%;right:auto;transform:translateX(-50%);width:min(720px,92vw)} }

/* ============================================================ now playing view */
#np{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;
  background:rgba(11,10,14,.55);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
#np.open{display:flex;animation:npin .4s var(--ease)}
@keyframes npin{from{opacity:0;transform:translateY(6vh)}to{opacity:1;transform:none}}
#np .nphead{display:flex;align-items:center;padding:16px 20px 0;gap:10px}
/* The panel covers the whole app (z-index 60 over the header's 40), so the
   only way out was a chevron in the far top-right -- the corner a thumb
   reaches last. Back now sits top-left, where it does everywhere else. */
#np .nphead #npback{flex:none;margin-left:-6px}
#np .nphead .npdown{margin-left:auto}
#np .npbody{flex:1;display:flex;gap:5vw;align-items:center;justify-content:center;
  padding:12px clamp(16px,5vw,70px) 30px;min-height:0}
#np .npleft{flex:0 1 480px;min-width:0;display:flex;flex-direction:column;align-items:center}
#np .npart{width:min(42vh,100%);aspect-ratio:1;border-radius:18px;overflow:hidden;
  box-shadow:0 40px 100px -20px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1);
  transition:transform .5s var(--ease)}
#np .npart.paused{transform:scale(.94)}
#np .npart img{width:100%;height:100%;object-fit:cover}
#np .npmeta{width:100%;max-width:440px;text-align:left;margin-top:22px}
#np .npt1{font-family:'Fraunces',serif;font-size:clamp(20px,2.6vw,30px);font-weight:640;line-height:1.15;text-wrap:balance}
#np .npt2{color:var(--ink2);font-size:14px;margin-top:5px}
#np .npt2 a{cursor:pointer;text-decoration:none}
#np .npt2 a:hover{color:var(--acc)}
/* touch-action:none, or a drag on a phone scrolls the page instead of seeking */
#np .seek{width:100%;max-width:440px;margin-top:20px;cursor:pointer;padding:12px 0;
  touch-action:none;-webkit-user-select:none;user-select:none}
#np .seek.scrubbing .sk u,#np .seek:hover .sk u{opacity:1}
#np .seek.scrubbing .sk{height:6px}
#np .seek .sk{height:4px;border-radius:3px;background:rgba(255,255,255,.14);overflow:visible;position:relative}
#np .seek .sk i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--acc)}
#np .seek .sk u{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);
  transform:translate(-50%,-50%);box-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}
#np .seek:hover .sk u,#np .seek.foc .sk u{opacity:1}
#np .times{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums;margin-top:6px;width:100%;max-width:440px}
#np .npctl{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:16px}
#np .npctl .iconbtn{width:48px;height:48px}
#np .npctl .iconbtn svg{width:24px;height:24px}
#np .npctl #npplay{width:66px;height:66px;background:var(--ink);color:#161018;border-radius:50%}
#np .npctl #npplay svg{width:28px;height:28px}
#np .npctl #npplay:hover{background:var(--acc)}
#np .npctl .hearted{color:#ff7b93}
#np .npright{flex:0 1 480px;align-self:stretch;min-width:0;display:none;flex-direction:column;min-height:0;padding:4vh 0}
#np.pane .npright{display:flex}
#np .panetabs{display:flex;gap:8px;margin-bottom:14px;align-items:center}
#np .panetabs .pfull{display:none}
#np .paneview{flex:1;overflow-y:auto;min-height:0;padding-right:8px;
  mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent);
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 7%,#000 93%,transparent)}
.lyr{padding:16vh 4px}
.lyr .ln{font-family:'Fraunces',serif;font-size:clamp(17px,1.9vw,24px);font-weight:560;line-height:1.4;
  padding:7px 0;color:rgba(255,255,255,.32);transition:color .35s, transform .35s;transform-origin:left;cursor:pointer}
.lyr .ln.on{color:var(--ink);transform:scale(1.04)}
.lyr .ln.past{color:rgba(255,255,255,.5)}
.lyr.plain{white-space:pre-wrap;font-family:'Fraunces',serif;font-size:17px;line-height:1.7;color:var(--ink2);padding:20px 4px}
.lyr .lmsg{color:var(--ink3);font-size:14px;font-family:'Sora',sans-serif}
.lyr .lmsg a{color:var(--acc)}
.qrow{display:flex;gap:12px;align-items:center;padding:8px 10px;border-radius:10px;cursor:pointer}
.qrow:hover{background:rgba(255,255,255,.06)}
.qrow.now{background:var(--acc-soft)}
.qrow .qn{width:36px;height:36px;border-radius:7px;overflow:hidden;flex:0 0 auto;background:#17141d}
.qrow .qn img{width:100%;height:100%;object-fit:cover}
.qrow .qi{min-width:0;flex:1}
.qrow .q1{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .q2{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .qd{font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
@media(max-width:880px){
  #np .npbody{flex-direction:column;gap:0;overflow-y:auto;justify-content:flex-start}
  #np .npleft{flex:0 0 auto;width:100%}
  #np.pane .npart{display:none}
  #np.pane .npmeta{margin-top:4px}
  /* Tapping the artwork hid the artwork -- which was also the only way back,
     so the lyrics view was a one-way door. The toggle lives on the tab row
     instead, which never disappears. */
  #np .panetabs .pfull{margin-left:auto;display:flex;align-items:center;padding:6px 9px}
  #np .panetabs .pfull svg{width:15px;height:15px;transition:transform .25s var(--ease)}
  #np.pane .panetabs .pfull svg{transform:rotate(180deg)}
  /* smaller cover so the tabs and the first lines of lyrics clear the fold */
  #np .npart{width:min(42vw,235px)}
  /* The lower half sat empty because the panes only showed in .pane mode,
     which a phone never entered unless you happened to tap the artwork.
     Lyrics and Up next now sit under the controls where they are visible. */
  #np .npright{flex:1 1 auto;width:100%;padding:2vh 0;display:flex}
  .lyr{padding:4vh 4px}
}

/* ============================================================ search */
#so{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;
  background:rgba(11,10,14,.6);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px)}
#so.open{display:flex;animation:npin .3s var(--ease)}
#so .sotop{display:flex;gap:12px;align-items:center;max-width:820px;width:100%;margin:0 auto;
  padding:26px 22px 8px}
#so input{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);outline:none;
  color:var(--ink);font:400 17px 'Sora',sans-serif;border-radius:14px;padding:13px 18px;transition:.2s}
#so input:focus{border-color:var(--acc);background:rgba(255,255,255,.11)}
#so input::placeholder{color:var(--ink3)}
#so .sores{flex:1;overflow-y:auto;padding:10px 22px 40vh}
#so .sowrap{max-width:820px;margin:0 auto}
#so .kindh{font-size:11px;letter-spacing:2.2px;text-transform:uppercase;color:var(--ink3);font-weight:600;margin:22px 4px 8px}
.srow{display:flex;gap:14px;align-items:center;padding:8px 10px;border-radius:12px;cursor:pointer}
.srow:hover{background:rgba(255,255,255,.07)}
.srow .sart{width:46px;height:46px;border-radius:9px;overflow:hidden;flex:0 0 auto;background:#17141d}
.srow .sart.rnd{border-radius:50%}
.srow .sart img{width:100%;height:100%;object-fit:cover}
.srow .si{min-width:0;flex:1}
.srow .s1{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .s2{font-size:12px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sgo{color:var(--ink3);flex:0 0 auto}
.srow .sgo svg{width:16px;height:16px}
#kb{display:none;margin:8px auto 0;padding:0 22px;flex-direction:column;align-items:center;gap:7px}
body.tv #kb.on{display:flex}
#kb .kbrow{display:flex;gap:7px;justify-content:center}
#kb .kk{width:52px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:9px;background:rgba(255,255,255,.08);
  font-size:17px;font-weight:500;cursor:pointer;line-height:1}
#kb .kk:hover{background:rgba(255,255,255,.16)}
#kb .kk.wide{width:111px}
#kb .kk.sp{width:229px}
#kb .kk.mode{width:111px;font-size:12px;letter-spacing:.08em;color:var(--ink2)}

/* ============================================================ misc */
#toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + var(--bnav-h) + 26px);transform:translate(-50%,20px);
  z-index:90;background:rgba(24,21,32,.94);backdrop-filter:blur(10px);color:var(--ink);
  padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:.3s var(--ease);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast svg{width:15px;height:15px;color:var(--acc)}
.skel{border-radius:10px;aspect-ratio:1;background:linear-gradient(110deg,#17141d 40%,#1e1a28 50%,#17141d 60%);
  background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{color:var(--ink3);font-size:14px;padding:30px 4px}
.heart-ind{position:absolute;top:8px;left:8px;z-index:2;color:#ff7b93;filter:drop-shadow(0 2px 6px rgba(0,0,0,.7))}
.heart-ind svg{width:16px;height:16px}

/* ============================================================ tv mode */
body.tv{font-size:17px}
body.tv #view{padding-left:48px;padding-right:70px;max-width:none}
body.tv .pill{font-size:16px;padding:9px 20px}
body.tv #top{height:72px;--top-h:72px}
body.tv{--top-h:72px}
.foc{outline:none;position:relative;z-index:3}
body.tv .foc{box-shadow:0 0 0 3.5px var(--acc), 0 10px 40px -6px rgba(0,0,0,.8) !important;
  border-radius:12px;transform:scale(1.05);transition:transform .18s var(--ease), box-shadow .18s}
body.tv .tile.foc{box-shadow:none !important;transform:none;
  /* the tile's content-visibility containment clips paint to its own box, which
     cut the focus ring and the 6% swell on all four sides (3 Sep 2026) */
  content-visibility:visible;contain:none;overflow:visible;z-index:4}
body.tv .grid,body.tv .strip{padding-top:8px;padding-bottom:8px}
body.tv .tile.foc .cov, body.tv .gcard.foc .quad{box-shadow:0 0 0 4px var(--acc), var(--shadow);transform:scale(1.06)}
/* the fanned cards (Mixes, Libraries) get the same box as a plain cover */
body.tv .pcard.foc .fan{box-shadow:0 0 0 4px var(--acc), var(--shadow);border-radius:12px;transform:scale(1.04)}
body.tv .tile.foc .tt{color:var(--acc)}
body.tv .tr.foc{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 2.5px var(--acc);transform:none}
body.tv .rl.foc{color:var(--acc) !important;box-shadow:0 0 0 2px var(--acc)}
body.tv .tr.focrow{background:rgba(255,255,255,.06)}
body.tv .tr .trmic.foc,body.tv .tr .tradd.foc{opacity:1 !important;color:var(--acc);box-shadow:0 0 0 2.5px var(--acc) !important;border-radius:50%;background:rgba(255,255,255,.08)}
body.tv .karq.foc{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}
body.tv ::-webkit-scrollbar{display:none}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
  html{scroll-behavior:auto}
}
/* ---- output picker ----------------------------------------------------
   Built as a bottom sheet on a phone (thumb reach) and a centred card on a
   wide screen. This block was the whole bug: the markup and handlers were
   right, but the classes it used were never styled, so the sheet opened
   perfectly and painted nothing. */
.sheet{position:fixed;inset:0;z-index:95;display:none;
  background:rgba(8,7,10,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.sheet.on{display:flex;align-items:flex-end;justify-content:center;animation:npin .26s var(--ease)}
.sheet .sheetin{width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,rgba(38,34,44,.97),rgba(20,18,25,.99));
  border:1px solid rgba(255,255,255,.13);border-bottom:0;
  border-radius:22px 22px 0 0;box-shadow:0 -22px 60px rgba(0,0,0,.6);
  padding:6px 0 max(18px,env(safe-area-inset-bottom));animation:sheetup .3s var(--ease)}
@keyframes sheetup{from{transform:translateY(18vh)}to{transform:none}}
.sheet .sheetin::before{content:'';width:38px;height:4px;border-radius:4px;margin:8px auto 4px;
  background:rgba(255,255,255,.22)}
.sheet .sheeth{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 6px}
.sheet .sheeth h2{font:600 19px 'Sora',sans-serif;color:var(--ink);margin:0;letter-spacing:.01em}
.sheet .xbtn{background:rgba(255,255,255,.08);border:0;color:var(--ink2);width:34px;height:34px;
  border-radius:50%;font-size:15px;line-height:1;cursor:pointer;transition:.18s}
.sheet .xbtn:hover,.sheet .xbtn:focus-visible{background:rgba(255,255,255,.16);color:var(--ink);outline:none}
.sheet .outlist{overflow-y:auto;padding:6px 12px 4px;-webkit-overflow-scrolling:touch}
.outrow{display:flex;align-items:center;gap:13px;padding:15px 14px;border-radius:14px;cursor:pointer;
  transition:background .16s;min-height:56px}
.outrow:hover,.outrow:focus-visible{background:rgba(255,255,255,.07);outline:none}
.outrow:active{background:rgba(255,255,255,.12)}
.outdot{flex:none;width:11px;height:11px;border-radius:50%;
  border:2px solid rgba(255,255,255,.3);transition:.2s}
.outrow.active .outdot{border-color:var(--acc);background:var(--acc);
  box-shadow:0 0 0 4px var(--acc-soft)}
.outn{font:500 16px 'Sora',sans-serif;color:var(--ink)}
.outrow.active .outn{color:var(--acc)}
.outs{margin-left:auto;font:400 12.5px 'Sora',sans-serif;color:var(--ink3);
  text-align:right;max-width:48%;line-height:1.35}
.outnote{padding:12px 24px 4px;font:400 12.5px 'Sora',sans-serif;color:var(--ink3);line-height:1.5}
@media (min-width:881px){
  .sheet.on{align-items:center}
  .sheet .sheetin{border-radius:20px;border-bottom:1px solid rgba(255,255,255,.13);
    padding-bottom:16px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .sheet .sheetin::before{display:none}
  .sheet .sheeth{padding-top:18px}
}
/* the now-bar chip that names where sound is going, and its top-bar twin */
.outbtn{display:flex;align-items:center;gap:8px;flex:none;max-width:35vw;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  color:var(--ink2);border-radius:999px;padding:7px 13px 7px 11px;cursor:pointer;
  font:500 12.5px 'Sora',sans-serif;transition:.18s;white-space:nowrap}
.outbtn #outname{overflow:hidden;text-overflow:ellipsis}
.outbtn:hover,.outbtn:focus-visible{background:rgba(255,255,255,.13);color:var(--ink);outline:none}
.outbtn .outdot{width:8px;height:8px;border:2px solid rgba(255,255,255,.32)}
/* routed to a speaker: the chip and the top-bar icon both light up */
body.remote .outbtn{background:var(--acc-soft);border-color:rgba(232,160,76,.45);color:var(--acc)}
body.remote .outbtn .outdot{border-color:var(--acc);background:var(--acc);
  box-shadow:0 0 0 3px var(--acc-soft);animation:outpulse 2.4s ease-in-out infinite}
@keyframes outpulse{0%,100%{box-shadow:0 0 0 3px var(--acc-soft)}50%{box-shadow:0 0 0 6px rgba(232,160,76,.07)}}
#toutput.routed{color:var(--acc);background:var(--acc-soft)}
#toutput.routed::after{content:'';position:absolute;top:7px;right:7px;width:6px;height:6px;
  border-radius:50%;background:var(--acc);box-shadow:0 0 6px var(--acc)}
#toutput{position:relative}
@media (max-width:560px){
  /* the label is the whole affordance -- keep it, just let it truncate */
  .outbtn{padding:6px 10px 6px 9px;max-width:31vw;font-size:11.5px;gap:6px}
}
@media (prefers-reduced-motion:reduce){
  body.remote .outbtn .outdot{animation:none}
  .sheet.on,.sheet .sheetin{animation:none}
}
/* volume, shown only when a speaker is the target -- the phone's own
   hardware keys move the local stream, which is not where the sound is */
.npvol{display:none;align-items:center;gap:12px;justify-content:center;
  margin:18px auto 0;max-width:330px;width:100%}
body.remote .npvol{display:flex}
.npvol .vmute{width:38px;height:38px;flex:none}
.npvol .vmute svg{width:19px;height:19px}
.npvol .vnum{font:500 12.5px 'Sora',sans-serif;color:var(--ink3);min-width:26px;
  text-align:right;font-variant-numeric:tabular-nums}
.vrange{-webkit-appearance:none;appearance:none;flex:1;height:26px;background:transparent;
  cursor:pointer;outline:none}
.vrange::-webkit-slider-runnable-track{height:5px;border-radius:3px;
  background:linear-gradient(90deg,var(--acc) var(--pct,30%),rgba(255,255,255,.16) var(--pct,30%))}
.vrange::-moz-range-track{height:5px;border-radius:3px;background:rgba(255,255,255,.16)}
.vrange::-moz-range-progress{height:5px;border-radius:3px;background:var(--acc)}
.vrange::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
  background:var(--ink);margin-top:-5.5px;box-shadow:0 2px 6px rgba(0,0,0,.5);transition:transform .15s}
.vrange::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);
  border:0;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.vrange:active::-webkit-slider-thumb{transform:scale(1.25)}
.vrange:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--acc-soft)}
.npvol.muted .vrange::-webkit-slider-runnable-track{background:rgba(255,255,255,.16)}
.npvol.muted .vnum,.npvol.muted .vmute{color:var(--acc)}
/* the same control inside the output sheet, under the room list */
.sheet .outgo{padding:10px 22px 2px;display:flex}
.sheet .outgo .btn{flex:1;justify-content:center}
#outsheet .svol{display:none;align-items:center;gap:12px;padding:6px 26px 2px}
#outsheet .svol.on{display:flex}
#outsheet .svol .vnum{font:500 12.5px 'Sora',sans-serif;color:var(--ink3);min-width:26px;
  text-align:right;font-variant-numeric:tabular-nums}
#outsheet .svol .vmute{width:34px;height:34px;flex:none;background:rgba(255,255,255,.08);
  border:0;border-radius:50%;color:var(--ink2);cursor:pointer}
#outsheet .svol .vmute svg{width:17px;height:17px}
/* ---- box sets -------------------------------------------------------
   A set reads as one object with discs behind it: two offset plates peeking
   out from under the cover, and a count so the depth is a fact, not a hint. */
.tile.coll .cov{overflow:visible}
.tile.coll .cov::before,.tile.coll .cov::after{content:'';position:absolute;
  inset:0;border-radius:inherit;background:linear-gradient(160deg,#2a2530,#191620);
  border:1px solid rgba(255,255,255,.09);z-index:-1}
.tile.coll .cov::before{transform:translate(5px,-5px) scale(.985)}
.tile.coll .cov::after{transform:translate(10px,-10px) scale(.97);opacity:.72}
.tile.coll .cov img{position:relative;z-index:1}
.tile.coll .ndisc{position:absolute;left:8px;bottom:8px;z-index:2;
  background:rgba(10,9,13,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  color:var(--ink);font:600 10.5px 'Sora',sans-serif;letter-spacing:.4px;
  padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14)}
.tile.coll .tt{font-weight:600}
/* the set's own page gets the same stacked treatment on its big cover */
.dethead .dart.stack{position:relative}
.dethead .dart.stack::before,.dethead .dart.stack::after{content:'';position:absolute;
  inset:0;border-radius:14px;background:linear-gradient(160deg,#2a2530,#191620);
  border:1px solid rgba(255,255,255,.09);z-index:-1}
.dethead .dart.stack::before{transform:translate(8px,-8px) scale(.985)}
.dethead .dart.stack::after{transform:translate(16px,-16px) scale(.97);opacity:.72}
.dethead .dart.stack img{position:relative;z-index:1}
/* Back: shown only when there is somewhere above the current screen.
   A phone has no nav pills (they are hidden under 620px) and a sideloaded
   webview may have no system back at all, so the app has to offer its own. */
#tback{display:none;flex:none;margin-left:-4px}
body.canback #tback{display:flex}
body.phone #brand{font-size:19px}
body.phone.canback #brand .dot{display:none}
@media (max-width:400px){
  body.canback #brand{font-size:0}          /* keep the dot, drop the wordmark */
  body.canback #brand .dot{display:block;width:10px;height:10px}
}
/* ---- artist biography ---- */
.bio{max-width:820px;margin:2px auto 26px;padding:0 22px}
.bio .biotx{position:relative;max-height:7.4em;overflow:hidden;
  transition:max-height .35s var(--ease)}
.bio.open .biotx{max-height:200em}
.bio .biotx::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3em;
  background:linear-gradient(180deg,transparent,var(--bg,#0b0a0e));pointer-events:none;
  opacity:1;transition:opacity .25s}
.bio.open .biotx::after{opacity:0}
.bio p{margin:0 0 .8em;color:var(--ink2);font-size:14.5px;line-height:1.72;
  max-width:66ch;text-wrap:pretty}
.bio p:first-child{color:var(--ink)}

/* the + on a track row: present but quiet until you want it */

/* shuffle / repeat: lit when on, with a 1 badge for repeat-one */

#np .npctl #npshuf svg,#np .npctl #nprep svg{width:19px;height:19px}
.iconbtn.modeon{color:var(--acc)}
.iconbtn.modeon::after{content:'';position:absolute;left:50%;bottom:5px;width:4px;height:4px;
  border-radius:50%;background:var(--acc);transform:translateX(-50%)}
#nprep .one{position:absolute;top:4px;right:5px;font:700 9px 'Sora',sans-serif;

.npextra{display:flex;gap:14px;align-items:center;justify-content:center;margin-top:10px}

.shelfh{font-family:'Fraunces',serif;font-size:22px;font-weight:600;

@media(max-width:880px){ .shelfrow{padding:2px 18px 12px} .shelfrow .tile{flex-basis:112px;width:112px} }
/* queue rows: a grab handle on the left, a remove on the right */
.qbar{display:flex;gap:10px;padding:2px 6px 12px;flex-wrap:wrap}
.qbtn{background:rgba(255,255,255,.09);border:0;color:var(--ink);cursor:pointer;
  border-radius:999px;padding:8px 14px;font:600 12.5px 'Sora',sans-serif;
  display:inline-flex;align-items:center;gap:7px;transition:.15s}
.qbtn svg{width:15px;height:15px}
.qbtn:hover{background:rgba(255,255,255,.16)}
.qbtn.ghost{background:none;color:var(--ink3)}
.qbtn.ghost:hover{color:var(--ink);background:rgba(255,255,255,.08)}
.qlist{display:flex;flex-direction:column}
.qrow{position:relative}
.qrow .qgrip{background:none;border:0;padding:4px 2px;cursor:grab;color:var(--ink3);
  opacity:.55;flex:none;display:flex;align-items:center;line-height:0;touch-action:none}
.qrow .qgrip svg{width:16px;height:16px}
.qrow .qgrip:active{cursor:grabbing}
.qrow .qx{background:none;border:0;color:var(--ink3);cursor:pointer;padding:4px 6px;
  font-size:13px;opacity:0;transition:opacity .15s,color .15s;flex:none}
.qrow:hover .qx{opacity:1}
.qrow .qx:hover{color:var(--acc)}
@media (hover:none){ .qrow .qx{opacity:.55} }
.qrow.dragging{background:rgba(255,255,255,.10);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:.95}

/* ==================================================== old-browser fallbacks
   The television runs Chrome 74 (2019). A declaration that browser cannot
   parse is discarded ENTIRELY, which is the whole of what went wrong there:

     .dethead .dart{flex:0 0 clamp(160px,22vw,270px)}  ->  no flex at all,
        so the cover fell back to the image's natural width and filled the
        screen, and

     .sheet{position:fixed;inset:0}  ->  a fixed overlay with no offsets,
        so the output picker opened with no geometry and painted nothing.

   Each block restates the same intent in syntax that browser understands.
   They are guarded by @supports, so a current browser never enters them and
   nothing about the phone or desktop rendering changes. Confirmed against
   that TV via /diag rather than guessed: no inset, no clamp/min/max, no
   aspect-ratio, no backdrop-filter -- but zoom, flex gap and the whole of
   the app's JavaScript are fine. */

@supports not (inset: 0px) {
  :root{--fb-inset:1}
  #gl,#glfall,#veil,#np,#so,.sheet{top:0;right:0;bottom:0;left:0}
  .cov::after,
  .tile.coll .cov::before,.tile.coll .cov::after,
  .dethead .dart.stack::before,.dethead .dart.stack::after{top:0;right:0;bottom:0;left:0}
  .pcard .fan .fc{top:6%;right:6%;bottom:6%;left:6%}
}

@supports not (width: clamp(1px,2px,3px)) {
  :root{--fb-clamp:1}
  #hero .hart{flex:0 0 26vw;min-width:180px;max-width:320px}
  #hero h1{font-size:40px}
  .dethead .dart{flex:0 0 22vw;min-width:160px;max-width:270px}
  .dethead h1{font-size:34px}
  #np .npbody{padding:12px 5vw 30px}
  #np .npt1{font-size:26px}
  .lyr .ln{font-size:20px}
}

@supports not (width: min(1px,2px)) {
  :root{--fb-min:1}
  #np .npart{width:100%;max-width:42vh}
  @media(min-width:900px){ #nowbar{width:92vw;max-width:720px} }
  @media(max-width:880px){ #np .npart{width:42vw;max-width:235px} }
}

@supports not (width: max(1px,2px)) {
  :root{--fb-max:1}
  .sheet .sheetin{padding:6px 0 18px}
}

/* No aspect-ratio, so a square box with only a percentage-sized image in it
   collapsed and the image drew at its intrinsic height -- every cover in
   every grid. The padding-bottom trick gives the same square from the width,
   with the image taken out of flow to fill it. */
@supports not (aspect-ratio: 1 / 1) {
  :root{--fb-ar:1}
  /* Percentage padding resolves against the CONTAINING BLOCK's width, not the
     element's own width. For a tile in a grid cell those are the same, so the
     trick is right there. For a flex item with a capped basis they are not:
     the hero cover measured 320 wide inside an 834-wide #hero and so took 834
     of height, and the round artist photo became a tall oval for the same
     reason. Those boxes get an explicit square in one unit instead, which has
     no containing block to get wrong. Measured on the device, not assumed. */
  .cov,.skel,.pcard .fan,.gcard .quad{position:relative;height:0;padding-bottom:100%}
  #hero .hart{position:relative;flex:0 0 320px;width:320px;height:320px;min-width:0;max-width:none}
  .dethead .dart{position:relative;flex:0 0 270px;width:270px;height:270px;min-width:0;max-width:none}
  #np .npart{position:relative;width:42vh;height:42vh;max-width:none}
  @media(max-width:880px){
    #hero .hart{flex:0 0 180px;width:180px;height:180px}
    .dethead .dart{flex:0 0 160px;width:160px;height:160px}
    #np .npart{width:42vw;height:42vw}
  }
  .cov img,#hero .hart img,.dethead .dart img,#np .npart img{
    position:absolute;top:0;left:0;width:100%;height:100%}
  /* the quadrant card is a grid, which a zero-height content box would
     flatten, so its images are placed by hand instead */
  .gcard .quad{display:block}
  .gcard .quad img{position:absolute;width:50%;height:50%;aspect-ratio:auto}
  .gcard .quad img:nth-child(1){top:0;left:0}
  .gcard .quad img:nth-child(2){top:0;right:0}
  .gcard .quad img:nth-child(3){bottom:0;left:0}
  .gcard .quad img:nth-child(4){bottom:0;right:0}
  .gcard .quad img:only-child{top:0;left:0;width:100%;height:100%}
}

/* Without backdrop-filter the scrim is only a 55% wash, and the sheet under
   it stays legible only because the blur was doing the separating. */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  :root{--fb-bf:1}
  /* These surfaces were never meant to be see-through: the blur was doing the
     separating, and a 55% wash without it just shows the page underneath --
     which is why Now Playing appeared to have the album cover twice. */
  #np{background:rgba(11,10,14,.97)}
  #so{background:rgba(11,10,14,.97)}
  .sheet{background:rgba(8,7,10,.86)}
  #nowbar{background:rgba(17,15,23,.98)}
  #rail{background:rgba(15,14,20,.93)}
  #bigL{background:rgba(18,16,24,.98)}
  #toast{background:rgba(24,21,32,.99)}
  .tile .play{background:rgba(12,11,16,.94)}
  .tile.coll .ndisc{background:rgba(10,9,13,.94)}
}

/* ================================================================= karaoke
   The lyrics are the function; everything else is subordinate to reading
   them. Lines are PERSISTENT elements that slide between slots -- rebuilding
   them makes the queue pop, and a singer tracking a moving line loses it.
   All motion is transform and opacity so nothing reflows mid-phrase. */
#kar{position:fixed;top:0;right:0;bottom:0;left:0;z-index:80;display:none;
  flex-direction:column;background:#0b0a0e}
#kar.open{display:flex}
#karbd{position:absolute;top:0;right:0;bottom:0;left:0;overflow:hidden;pointer-events:none}
#karbd .kblob{position:absolute;border-radius:50%;will-change:transform,opacity}
#kb1{top:-30%;left:-16%;width:80vw;height:80vw;
  background:radial-gradient(circle at 50% 50%, rgba(232,160,76,.30), transparent 62%)}
#kb2{bottom:-38%;right:-14%;width:78vw;height:78vw;
  background:radial-gradient(circle at 50% 50%, rgba(60,110,150,.34), transparent 62%)}
#kb3{top:14%;right:8%;width:44vw;height:44vw;
  background:radial-gradient(circle at 50% 50%, rgba(190,90,70,.24), transparent 64%)}
#karvig{position:absolute;top:0;right:0;bottom:0;left:0;
  background:radial-gradient(120vmax 88vmax at 50% 44%, transparent 26%, rgba(8,7,10,.9) 100%)}
#karemb{position:absolute;top:0;left:0;pointer-events:none}

#karhead{position:relative;z-index:2;display:flex;align-items:center;gap:16px;
  padding:2.4vh 3vw 0;flex:none}
#karhead .kart{width:9vh;height:9vh;min-width:56px;min-height:56px;border-radius:12px;
  overflow:hidden;flex:none;position:relative;
  box-shadow:0 18px 44px -14px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1)}
#karhead .kart img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0}
#karhead .kt{min-width:0}
#karhead .kt b{display:block;font-family:'Fraunces',serif;font-size:2.5vh;font-weight:640;
  line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#karhead .kt span{display:block;color:var(--ink2);font-size:1.7vh;margin-top:.3vh;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#karhead .kspacer{flex:1}

#karlyr{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-height:0;overflow:hidden;text-align:center}
/* both wrappers are pinned to full width: the lines are absolutely positioned,
   so they contribute no intrinsic width and a centring flex parent would
   otherwise collapse the column to the width of its smallest child */
#karsing{position:relative;width:100%;flex:1;min-height:0}
#karlines{position:relative;width:100%;height:100%}
#karlines .kln{position:absolute;left:0;right:0;top:50%;padding:0 5vw;
  font-family:'Fraunces',serif;line-height:1.24;color:#5a5447;
  transform-origin:50% 50%;will-change:transform,opacity;
  transition:transform .4s var(--ease), opacity .4s var(--ease), color .4s var(--ease)}
#karlines .kln kw{display:inline-block;margin:0 .16em;color:inherit;text-align:center}
#karlines .kln.past{color:#4a453d}
#karlines .kln.next{color:var(--ink3)}
#karlines .kln.cur{color:#6d6659}
/* The swell is a TRANSFORM, never a weight change. Transforms do not affect
   layout, so a word can grow with the voice without any risk of the line
   re-wrapping underneath a singer mid-phrase. */
#karlines .kln.cur kw{color:#6d6659;transform-origin:50% 72%;
  transition:color .16s linear, transform .16s var(--ease)}
#karlines .kln.cur kw.lit{color:var(--acc)}
#karlines .kln.cur kw.on{text-shadow:0 0 18px rgba(232,160,76,.55)}
/* a held note extends a ribbon UNDER the line, never across the glyphs */
#karlines .krib{position:absolute;height:.5vh;min-height:3px;border-radius:999px;z-index:3;
  pointer-events:none;background:linear-gradient(90deg, var(--acc), rgba(232,160,76,0));
  transform-origin:0 50%;box-shadow:0 0 18px rgba(232,160,76,.5)}

/* the instrumental countdown is an OVERLAY, never a screen swap: replacing the
   lyrics and putting them back costs the singer their place every interlude */
#karchip{position:absolute;top:1.4vh;right:2vw;z-index:4;display:none;align-items:center;gap:10px;
  border:1px solid rgba(232,160,76,.4);background:rgba(20,17,26,.82);
  padding:8px 16px;border-radius:999px}
#karchip.on{display:flex}
#karchip .lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);font-weight:600}
#karchip .cd{font-family:'Fraunces',serif;font-size:22px;font-weight:640;line-height:1;
  color:var(--ink);font-variant-numeric:tabular-nums;min-width:2ch;text-align:center}

#karfoot{position:relative;z-index:2;flex:none;padding:0 3vw 2.4vh;display:flex;
  flex-direction:column;gap:12px}
#karmapwrap{position:relative;height:4.4vh;min-height:26px;cursor:pointer;touch-action:none}
#karmap{display:block;width:100%;height:100%}
#karhead2{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);
  box-shadow:0 0 10px rgba(232,160,76,.9)}
#kartime{display:flex;justify-content:space-between;color:var(--ink3);font-size:12.5px;
  font-variant-numeric:tabular-nums}
#karctl{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#karplay{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#20170c;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:transform .15s var(--ease)}
#karplay:hover{transform:scale(1.06)}
#karplay svg{width:22px;height:22px}
#karseg{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:999px;padding:4px;gap:3px}
#karseg button{appearance:none;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-family:'Sora',sans-serif;font-size:13.5px;font-weight:500;padding:9px 18px;
  border-radius:999px;transition:.2s var(--ease)}
#karseg button.sel{background:var(--acc);color:#20170c;font-weight:640}
/* the backing track has its own switch: music off with the voice on is the
   isolated vocal, which is how you learn a part */
#karmus{display:flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);
  border-radius:999px;padding:4px;gap:3px}
#karmus button{appearance:none;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-family:'Sora',sans-serif;font-size:13.5px;font-weight:500;padding:9px 18px;
  border-radius:999px;transition:.2s var(--ease)}
#karmus button.sel{background:var(--acc);color:#20170c;font-weight:640}
/* lyric timing: two nudges and a readout, for the LRC that is a beat off */
#karsync{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.13);border-radius:999px;padding:4px}
#karsync button{appearance:none;border:0;background:transparent;color:var(--ink2);cursor:pointer;
  font-family:'Sora',sans-serif;font-size:15px;font-weight:600;width:34px;height:34px;
  border-radius:999px;transition:.2s var(--ease)}
#karsync button:hover,#karsync button:focus{background:rgba(255,255,255,.12);color:var(--ink)}
#karsync span{font-size:12.5px;color:var(--ink3);min-width:118px;text-align:center;
  font-variant-numeric:tabular-nums}
#karsync span.set{color:var(--acc)}

/* the preparing state, shown in place rather than as a separate screen */
#karprep{position:relative;z-index:2;flex:1;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:0 6vw;text-align:center;gap:18px}
#karprep.on{display:flex}
#karprep h3{font-family:'Fraunces',serif;font-size:3.2vh;font-weight:640;margin:0}
#karprep p{color:var(--ink2);font-size:15px;line-height:1.6;margin:0;max-width:56ch}
#karprep .pbarwrap{width:min(560px,80vw);height:8px;border-radius:999px;
  background:rgba(255,255,255,.1);overflow:hidden}
#karprep .pbarwrap i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--acc),#f0c489);transition:width .6s linear}
#karprep .pmeta{color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}

/* the entry point on Now Playing. Same shape as the transport buttons so it
   reads as a control, tinted so it is not mistaken for one more of them. */
#npmic{position:relative;color:var(--acc);border-color:rgba(232,160,76,.5);
  background:var(--acc-soft)}
#npmic.ready::after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;
  border-radius:50%;background:var(--acc);border:2px solid #14121a}
#npmic.busy{opacity:.6}
#npmic[hidden]{display:none}

@media(max-width:880px){
  #karhead{padding:2vh 4vw 0}
  #karlines .kln{padding:0 6vw}
  #karfoot{padding:0 4vw 2vh}
  #karctl{gap:10px}
  #karseg button,#karmus button{padding:9px 13px;font-size:12.5px}
}

.outrow.off{opacity:.55;cursor:default}
.outrow.off .outs{color:var(--acc)}
.trx{appearance:none;border:0;background:rgba(255,255,255,.08);color:var(--ink2);width:30px;height:30px;border-radius:50%;
  cursor:pointer;font-size:13px;flex:none;margin-left:6px}

.chip.on{background:var(--acc);color:#20170c;border-color:var(--acc)}

/* ---- backdrops: the 2D canvas the non-shader styles draw on, and the preferences sheet ---- */
#bd2d{position:fixed;left:0;top:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:none}
body.bd2d #bd2d{display:block}
body.bdstill #glfall{animation:none}
.bdgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 0 2px}
.bdopt{appearance:none;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);border-radius:12px;padding:6px;color:var(--ink);font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.bdopt canvas{width:100%;height:54px;border-radius:8px;display:block;background:#111}
.bdopt .bn{font-size:13px;font-weight:600}
.bdopt .bc{font-size:11px;color:var(--ink3)}
.bdopt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bdopt.foc,.bdopt:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid rgba(255,255,255,.06)}
.prefrow .pl{color:var(--ink2);font-size:13.5px}
.pseg{display:inline-flex;border:1px solid rgba(255,255,255,.12);border-radius:999px;overflow:hidden;background:rgba(255,255,255,.05);flex:none}
.pseg button{appearance:none;border:0;background:transparent;color:var(--ink2);font:inherit;font-size:12.5px;padding:7px 12px;cursor:pointer}
.pseg button.on{background:var(--acc);color:#20170c;font-weight:600}
.pseg button.foc{outline:2px solid var(--acc);outline-offset:-2px}
.prefnote{color:var(--ink3);font-size:12px;padding:6px 4px 0;line-height:1.45}
.prefnote.warn{color:var(--acc)}
.preflink{display:block;text-align:center;color:var(--ink2);font-size:13px;padding:12px 0 2px;cursor:pointer;background:none;border:0;width:100%;font:inherit}
.preflink:hover{color:var(--ink)}

.karq{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);outline:none;color:var(--ink);font:inherit;font-size:14px;padding:9px 14px;border-radius:999px;min-width:230px}
.karq:focus{border-color:var(--acc);background:rgba(255,255,255,.11)}
.karq::placeholder{color:var(--ink3)}

.nbtime{flex:none;color:var(--ink3);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap;margin:0 6px}
body.phone .nbtime{display:none}
/* the top nav must never run off the screen: tighten before it can */
@media (max-width:1180px){ .pill{padding:6px 11px;font-size:13px} #nav{gap:2px} #brand{font-size:19px} }
@media (max-width:1040px){ .pill{padding:6px 8px;font-size:12.5px} }

/* ---- karaoke page: one block per artist, songs as compact lines beside the picture ---- */
.kargroup{display:grid;grid-template-columns:132px minmax(0,1fr);gap:8px 18px;align-items:start;padding:12px 4px;border-top:1px solid rgba(255,255,255,.06)}
.kargroup:first-child{border-top:0}
#karseg[hidden],#karmus[hidden]{display:none}
#sovoice[hidden]{display:none}
#sovoice.listening{color:var(--acc);box-shadow:0 0 0 2.5px var(--acc);border-radius:50%}
.karsrc{display:flex;gap:8px;flex-wrap:wrap}
.karsrc .btn.sel{background:var(--acc);color:#20170c;font-weight:640}
.karsrc .btn small{opacity:.7;font-weight:500;margin-left:6px}
.karmore{padding:6px 12px 18px}
.karmore .btn{min-height:44px}
.karart{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.karart .kimg{width:88px;height:88px;border-radius:50%;overflow:hidden;background:#1a1720;box-shadow:0 10px 26px -12px rgba(0,0,0,.8)}
.karart .kimg img{width:100%;height:100%;object-fit:cover;display:block}
.karart .kname{font-weight:600;font-size:13.5px;line-height:1.25;max-width:132px}
.karart .kn{color:var(--ink3);font-size:11.5px}
.karsongs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 14px;align-content:start}
.krow{display:flex;align-items:baseline;gap:8px;padding:7px 10px;border-radius:9px;cursor:pointer;min-width:0;transition:background .15s}
.krow:hover{background:rgba(255,255,255,.06)}
.krow .kt{font-weight:500;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.krow .ka{color:var(--ink3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto;min-width:0}
.krow .kd{color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums;flex:none;margin-left:auto}
.krow.cand .kt{color:var(--ink2)}
/* the karaoke filter hides rows and artist blocks with the hidden attribute; their
   own display rules above would otherwise win over the browser's default and
   leave everything visible (8 Sep 2026) */
.krow[hidden],.kargroup[hidden]{display:none}
@media (max-width:1100px){.karsongs{grid-template-columns:repeat(2,minmax(0,1fr))}}
body.phone .kargroup{grid-template-columns:72px minmax(0,1fr)}
body.phone .karart .kimg{width:56px;height:56px}
body.phone .karsongs{grid-template-columns:1fr}
body.phone .karart .kname{font-size:12px;max-width:72px}

body.tv .karart.foc{box-shadow:none !important}
body.tv .karart.foc .kimg{box-shadow:0 0 0 3.5px var(--acc)}
body.tv .karart.foc .kname{color:var(--acc)}
</style>
</head>

/* ================================================================= player */
/* Shuffle keeps the queue itself intact and walks it through an order array,
   so turning shuffle off returns you to the real running order rather than to
   a queue that has been permanently jumbled. On a speaker neither is done here
   at all: the queue lives on the speaker, so it is told the play mode and does
   its own shuffling. */

function buildOrder(keepCurrent) {
  if (!P.shuffle) { P.order = null; return; }
  const idx = P.q.map((_, n) => n);
  for (let a = idx.length - 1; a > 0; a--) {
    const b = Math.floor(Math.random() * (a + 1));
    [idx[a], idx[b]] = [idx[b], idx[a]];
  }
  if (keepCurrent && P.i >= 0) {          // play on from here, don't jump
    const at = idx.indexOf(P.i);
    if (at > 0) { idx.splice(at, 1); idx.unshift(P.i); }
  }
  P.order = idx;
}

function orderPos() {
  if (!P.order) return P.i;
  const at = P.order.indexOf(P.i);
  return at < 0 ? 0 : at;
}

function stepBy(d) {
  /* returns the next queue index, or -1 when the queue is finished */
  const n = P.q.length;
  if (!n) return -1;
  if (P.order) {
    let at = orderPos() + d;
    if (at >= n) { if (P.repeat !== 'all') return -1; at = 0; }
    if (at < 0) { if (P.repeat !== 'all') return 0; at = n - 1; }
    return P.order[at];
  }
  let at = P.i + d;
  if (at >= n) { if (P.repeat !== 'all') return -1; at = 0; }
  if (at < 0) { if (P.repeat !== 'all') return 0; at = n - 1; }
  return at;
}

function hasNow() { return !!trackOf() || FGN.on; }

/* The queue lives IN the speaker, so the UI follows it rather than driving it.

   The old poll inferred "track finished" from state==STOPPED at position 0 and
   called next(), which advanced our index AND re-pushed the whole queue. But a
   speaker also reports STOPPED/0 for a moment right after a queue is loaded --
   so clicking a song moved Now Playing on to the following one while the
   speaker played what you actually picked. GetPositionInfo reports which queue
   entry is live; that is the truth, and this just reads it. */
function startPoll() {
  stopPoll();
  OUT.poll = setInterval(pollRemote, 1500);
  pollRemote();
}

async function pollRemote() {
  if (OUT.kind !== 'sonos' || !OUT.ip) return;
  try {
    const st = await api('/api/sonos/state?ip=' + encodeURIComponent(OUT.ip) +
                         (OUT.group ? '&group=1' : ''));
    OUT.dur = st.duration || 0;
    /* a speaker reports the OLD position for a moment after a seek, so let the
       requested position stand until it has caught up */
    if (Date.now() > (OUT.seekHold || 0)) OUT.pos = st.position || 0;
    /* don't fight the finger: ignore polled volume right after a local drag */
    if (typeof st.volume === 'number' && Date.now() > OUT.volHold) {
      OUT.muted = !!st.muted; paintVol(st.volume);
    }
    const wasPaused = remotePaused;
    remotePaused = (st.state === 'PAUSED_PLAYBACK' || st.state === 'STOPPED');
    if (wasPaused !== remotePaused) paintPlayState();

    const mine = ourUri(st.uri);
    if (!mine && st.meta && (st.state === 'PLAYING' || st.state === 'PAUSED_PLAYBACK'
                             || st.state === 'TRANSITIONING')) {
      foreignPaint(st.meta);
      return;                       // not our queue: nothing below applies
    }
    if (mine) foreignClear();

    /* A speaker keeps reporting the OLD queue index for a beat after a new
       queue is loaded, so ignore the index until the push has settled --
       otherwise the display snaps back to the previously playing track. */
    const qi = (st.track || 0) - 1;      // Sonos counts the queue from 1
    if (Date.now() > OUT.syncHold && mine &&
        qi >= 0 && qi < P.q.length && qi !== P.i) {

      duration: OUT.dur || null }).catch(() => {});

}

/* the speaker moved to another track on its own -- catch the display up,
   WITHOUT re-pushing the queue, which is what caused the drift */
function adoptRemoteTrack() {
  const t = trackOf(); if (!t) return;

  paletteForTrack(t);
  post('/api/play/start', { track_id: t.id, room: OUT.name })
    .then(r => { P.playId = r.play_id; }).catch(() => {});

async function startCurrent() {

    try { audio.pause(); } catch (e) {}

      OUT.syncHold = Date.now() + 6000;   // covers the enqueue, before it starts
      const ids = P.q.map(x => x.id);
      /* start every system with the same queue at the same track; they run as
         independent streams, so expect a little drift between houses */
      await fanOut(ip => post('/api/sonos/play', { ip, track_ids: ids, start: P.i }));
      if (OUT.handoff) {
        const at = OUT.handoff; OUT.handoff = 0;
        /* pick up where the previous output had got to */

        OUT.pos = at;

    } catch (e) { OUT.syncHold = 0; toast('Could not reach ' + OUT.name); return; }

      .then(r => { P.playId = r.play_id; }).catch(() => {});

  }

    .then(r => { P.playId = r.play_id; if (!t.duration && r.duration) t.duration = r.duration; })
    .catch(() => { });

  if (auto && P.repeat === 'one') { audio.currentTime = 0; audio.play().catch(() => {}); return; }

/* the picker was only reachable once music was already playing, which is exactly
   backwards -- you choose the room before you press play. It now lives in the top
   bar, on the now-bar, on a long-press of either play button, and on the O key. */
/* Hold either play button to choose where the sound goes.

   Two things this has to get right that the first version did not: the click
   that follows the release must NOT also toggle playback (a hold to pick a
   speaker would otherwise pause the music), and a long press on a phone pops
   the browser's own text-selection menu unless it is suppressed while held. */
['#bplay', '#npplay'].forEach(sel => {
  const b = $(sel); if (!b) return;
  let t = null, fired = false;
  const clear = () => { if (t) { clearTimeout(t); t = null; } };
  b.style.touchAction = 'manipulation';
  b.addEventListener('pointerdown', e => {
    if (!e.isPrimary || (e.pointerType === 'mouse' && e.button !== 0)) return;

  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    b.addEventListener(ev, clear));

});

/* ===================== idle -> now playing =====================
   After a spell of no input while something is playing, the browsing chrome gives
   way to the full now-playing view. A jukebox left alone should look like a
   jukebox, not like a file browser someone walked away from.

   Three minutes, not thirty seconds. On a television people READ between

   to the back arrow (1 Sep 2026). Someone who has not touched the remote for
   three minutes has walked away. */
const IDLE_MS = 180000;
let idleT = null;
function idleMs() {
  /* a preference: 1, 3 or 10 minutes, or never */
  let m = 3; try { if (store['jb.idle'] != null && store['jb.idle'] !== '') m = +store['jb.idle']; } catch (e) { }
  return m > 0 ? m * 60000 : 0;

/* Position comes from the <audio> element locally, and from the speaker when a

function nowDur() {
  const t = trackOf();

}
/* seeking someone else's stream is not ours to do */
function canSeek() { return !FGN.on && OUT.kind !== 'sonos'; }
function paintProgress(pos, dur) {

  $('#bprog i').style.width = pc + '%';

/* Display size, remembered per device.

   It is a setting rather than a guess because guessing is what failed: the
   television was served the desktop sizes since its browser did not match the
   user-agent pattern. A TV that never presses an arrow key still needs to be
   readable. */
const SCALES = [1, 1.25, 1.5, 1.75, 2];

/* Measured BEFORE any zoom is applied, so it is the true viewport width. */
const BASE_W = document.documentElement.clientWidth || 1280;
const MIN_LAYOUT_W = 940;      // just above the 880px phone breakpoint

function maxScale() {
  /* Zoom shrinks the CSS viewport, and the media queries follow it. On a
     1280-wide TV browser, 150% leaves 853px -- under the phone breakpoint --
     so the page laid itself out for a phone while the JS still thought it was
     a desktop. Cap the zoom so the layout can never cross that line. */
  return Math.max(1, BASE_W / MIN_LAYOUT_W);
}

function applyScale(v) {
  const capped = Math.min(v, maxScale());
  document.documentElement.style.setProperty('--uiscale', String(capped));
  try { store['jb.uiscale'] = String(v); } catch (e) { }   // remember what was asked for
  return capped;
}

function currentScale() {
  const v = parseFloat(store['jb.uiscale'] || '');
  if (v && v >= 1 && v <= 2) return v;
  return IS_TV ? 1.5 : 1;          // a television starts large, everything else at 1
}

/* Steps through the sizes this screen can actually SHOW. The cap stands in for
   every larger size (a 1280-wide TV tops out around 136%), and one step past
   the largest wraps back to 100%: a remote has no right-click, so the button
   alone must be able to come back down. Stepping by what is shown rather than
   what was last asked for is what stopped it sticking at the top -- before, the
   stored request could climb to 200% while the screen sat at its cap, and each
   step down only ate into the excess. */
function cycleScale(step) {
  step = step || 1;
  const cap = maxScale();
  const opts = SCALES.filter(x => x < cap - 0.001);
  opts.push(Math.min(cap, SCALES[SCALES.length - 1]));
  const eff = Math.min(currentScale(), cap);
  let i = 0;
  for (let k = 0; k < opts.length; k++) if (opts[k] <= eff + 0.001) i = k;
  i += step;
  if (i >= opts.length) i = 0;
  if (i < 0) i = 0;
  const got = applyScale(opts[i]);
  const atCap = i === opts.length - 1 && cap < SCALES[SCALES.length - 1];
  toast('Display size ' + Math.round(got * 100) + '%' + (atCap ? ' (as large as this screen allows)' : ''));
}

function paintVol(v) {
  if (typeof v === 'number') OUT.vol = Math.max(0, Math.min(100, Math.round(v)));
  const v0 = OUT.vol == null ? 0 : OUT.vol;
  const shown = OUT.muted ? 0 : v0;
  [['#vslider', '#vnum', '#npvol'], ['#svslider', '#svnum', '#svol']].forEach(([sl, nu, wrap]) => {
    const e = $(sl); if (e) { e.value = v0; e.style.setProperty('--pct', shown + '%'); }
    const n = $(nu); if (n) n.textContent = OUT.muted ? '—' : v0;
    const w = $(wrap); if (w) w.classList.toggle('muted', OUT.muted);
  });
  const mi = OUT.muted || v0 === 0 ? I.volmute : I.vol;
  ['#vmute', '#svmute'].forEach(sel => { const b = $(sel); if (b) b.innerHTML = mi; });
}

let volT = null;
function setVol(v, immediate) {
  if (OUT.kind !== 'sonos') return;
  OUT.vol = Math.max(0, Math.min(100, Math.round(v)));
  if (OUT.muted && OUT.vol > 0) OUT.muted = false;
  OUT.volHold = Date.now() + 1500;      // let the finger win over the poll
  paintVol();
  /* dragging a slider fires continuously; a speaker does not need 60 SOAP
     calls a second, so coalesce to the latest value */
  if (volT) clearTimeout(volT);
  volT = setTimeout(() => {
    volT = null;
    fanOut(ip => post('/api/sonos/volume', { ip, level: OUT.vol, group: OUT.group }))
      .catch(() => toast('Could not set volume on ' + OUT.name));
  }, immediate ? 0 : 90);
}

function nudgeVol(delta) {
  if (OUT.kind !== 'sonos') return false;
  OUT.volHold = Date.now() + 1500;
  if (OUT.vol != null) { OUT.vol = Math.max(0, Math.min(100, OUT.vol + delta)); paintVol(); }
  fanOut(ip => post('/api/sonos/volume', { ip, delta, group: OUT.group }))
    .then(rs => { const r = rs && rs[0];
      if (r && typeof r.volume === 'number') { OUT.vol = r.volume; paintVol(); } })
    .catch(() => {});
  return true;
}

function toggleMute() {
  if (OUT.kind !== 'sonos') return;
  OUT.muted = !OUT.muted;
  OUT.volHold = Date.now() + 1500;

}

}

/* seek */
(() => {
  const seek = $('#seek');
  let drag = false, pending = 0;
  const frac = e => {
    const r = seek.querySelector('.sk').getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };
  const preview = f => {                     // move the bar with the finger
    OUT.seekHold = Date.now() + 1500;
    paintProgress(f * nowDur(), nowDur());
  };
  seek.addEventListener('pointerdown', e => {
    if (!canSeek()) return;
    e.preventDefault();
    drag = true; pending = frac(e);
    seek.setPointerCapture(e.pointerId);
    seek.classList.add('scrubbing');
    preview(pending);
  });
  seek.addEventListener('pointermove', e => { if (drag) { pending = frac(e); preview(pending); } });
  const finish = () => {
    if (!drag) return;
    drag = false;
    seek.classList.remove('scrubbing');
    seekTo(pending);                         // commit once, on release
  };
  seek.addEventListener('pointerup', finish);
  seek.addEventListener('pointercancel', finish);
  seek.addEventListener('lostpointercapture', finish);
})();
