function karGroups(raw, onPick, perFrame, artistsGetter) {
  const host = document.createElement('div'); host.className = 'kargroups';
  const tracks = raw.map(x => ({ id: x.id, title: x.title, duration: x.duration,
    album_id: x.album_id, album: x.album, artist: x.artist, artist_id: x.artist_id,
    lyrics: x.stems === 'ready' ? 'yes' : x.lyrics, stems: x.stems, album_artist: x.album_artist,
    has_art: x.has_art, is_compilation: x.is_compilation, pool: x.pool, disc: x.disc }));
  const whoOf = t => (t.album_artist && !/^various/i.test(t.album_artist)) ? t.album_artist : (t.artist || t.album_artist || '');
  const groups = [], byWho = {};
  tracks.forEach(t => {
    const who = whoOf(t);
    if (!byWho[who]) { byWho[who] = { who: who, items: [] }; groups.push(byWho[who]); }
    byWho[who].items.push(t);
  });
  groups.sort((a, b) => a.who.toLowerCase().replace(/^the\s+/, '').localeCompare(b.who.toLowerCase().replace(/^the\s+/, '')));
  const byName = {};
  ((artistsGetter && artistsGetter()) || []).forEach(a => { if (a && a.name && !byName[a.name]) byName[a.name] = a; });
  const build = g => {
    const blk = document.createElement('div'); blk.className = 'kargroup'; blk.dataset.artist = g.who;
    const ar = byName[g.who];
    const first = g.items[0];
    let img;
    if (ar && ar.has_photo) img = '<img ' + lazySrc(photoSrc(ar)) + ' alt="">';
    else if (ar && ar.art_album_id) img = artImg(ar.art_album_id, 96, g.who, '');
    else img = trackImg(first, 96);
    blk.innerHTML = '<div class="karart"><div class="kimg">' + img + '</div><div class="kname">' + esc(g.who) + '</div>' +
      '<div class="kn">' + g.items.length + (g.items.length === 1 ? ' song' : ' songs') + '</div></div><div class="karsongs"></div>';
    const songs = blk.querySelector('.karsongs');
    g.items.forEach(t => {
      const r = document.createElement('div'); r.className = 'krow' + (t.stems !== 'ready' ? ' cand' : '');
      r.dataset.tid = t.id; r.dataset.pal = t.album_id; r.dataset.t = t.title; r.dataset.s = t.artist || ''; r.dataset.fav = 'track:' + t.id;
      r.innerHTML = '<span class="kt">' + esc(t.title) + '</span><span class="ka">' + esc(t.album || '') + '</span><span class="kd">' + fmtD(t.duration) + '</span>';
      r.onclick = () => onPick(t, tracks);
      reg(r); songs.appendChild(r);
    });
    const kimg = blk.querySelector('.karart');
    const aid = ar ? ar.id : first.artist_id;
    if (aid) { kimg.dataset.fav = 'artist:' + aid; kimg.dataset.t = g.who; }   // Back lands here again; hold Enter favourites the artist
    kimg.onclick = () => { if (ar) go('#/artist/' + ar.id); else if (first.artist_id) go('#/artist/' + first.artist_id); };
    reg(kimg);          // a stop in its own column: Left from the first song, Up/Down artist to artist
    host.appendChild(blk);
  };
  if (!perFrame) { groups.forEach(build); return host; }
  let gi = 0;
  const step = () => {
    if (!host.isConnected && gi > 0) return;          // the page moved on
    const end = Math.min(groups.length, gi + perFrame);
    for (; gi < end; gi++) build(groups[gi]);
    if (gi < groups.length) requestAnimationFrame(step);
    else if (host.onbuilt) host.onbuilt();
  };
  step();
  return host;
}

function groupsRail(list, prefix) {
  if (!list || !list.isConnected) { hideRail(); return; }
  const counts = {}, seen = {};
  [].slice.call(list.querySelectorAll('.kargroup')).forEach(h => {
    const name = (h.dataset.artist || '').trim().toLowerCase().replace(/^the\s+/, '');
    let L = name.charAt(0); if (!(L >= 'a' && L <= 'z')) L = '#';
    counts[L] = (counts[L] || 0) + 1;
    if (!seen[L]) { seen[L] = true; h.id = prefix + '-' + (L === '#' ? 'num' : L); }
  });
  const letters = ['#'].concat('abcdefghijklmnopqrstuvwxyz'.split('')).map(l => ({ letter: l, n: counts[l] || 0 }));
  showRail(letters, prefix);
}

async function vKaraoke(v) {
  const lib = await api('/api/karaoke/library');
  const head = document.createElement('div'); head.className = 'dethead';
  const n = lib.ready.length;
  head.innerHTML = '<div class="dmeta"><div class="eyebrow">Sing</div><h1>Karaoke</h1>' +
    '<div class="dsub">' + (n ? n + (n === 1 ? ' song ready' : ' songs ready') : 'Nothing prepared yet') +
    (lib.store && lib.store.bytes ? ' · ' + (lib.store.bytes / 1048576).toFixed(0) + ' MB' : '') +
    '</div><div class="actrow"></div></div>';
  v.appendChild(head);
  const srcToggle = karSourceToggle('split', 0);
  head.querySelector('.actrow').appendChild(srcToggle);
  api('/api/cdg/summary').then(d => {
    const b = srcToggle.querySelectorAll('button')[1];
    if (d && d.ready && b) b.innerHTML = I.disc + 'Karaoke discs <small>' + d.ready + '</small>';
    else if (b) { b.hidden = true; }
  }).catch(() => { });
  /* find a song among the ones already split: filters the lists below as you
     type; headings hide with their rows. Not on the television, which has no
     keyboard here -- its search button covers the whole library, mics included. */
  let karFilter = () => { };
  if (!IS_TV) {
    const q = document.createElement('input'); q.type = 'search'; q.className = 'karq';
    q.placeholder = 'Find a song or artist'; q.autocomplete = 'off'; q.spellcheck = false;
    head.querySelector('.actrow').appendChild(q);
    karFilter = () => {
      const needle = q.value.trim().toLowerCase();
      [readyList, candList].forEach(list => {
        if (!list || !list.isConnected) return;
        [].slice.call(list.querySelectorAll('.kargroup')).forEach(blk => {
          const artist = (blk.dataset.artist || '').toLowerCase();
          let any = false;
          [].slice.call(blk.querySelectorAll('.krow')).forEach(r => {
            /* the artist counts for every one of their songs */
            const hit = !needle || (r.textContent || '').toLowerCase().indexOf(needle) >= 0 || artist.indexOf(needle) >= 0;
            r.hidden = !hit; if (hit) any = true;
          });
          blk.hidden = !any;
        });
      });
    };
    q.addEventListener('input', debounce(karFilter, 120));
    reg(q);                                          // a d-pad stop; Enter puts the caret in it
    if (!TVMODE) setTimeout(() => q.focus(), 80);
  }
  if (!lib.available) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Vocal separation is not installed on the server, so nothing can be prepared here.';
    v.appendChild(e);
  }
  const mk = (raw, label, opener) => {
    const list = document.createElement('div'); list.className = 'trlist cols';
    list.style.marginTop = '4px';
    const tracks = raw.map(x => ({ id: x.id, title: x.title, duration: x.duration,
      album_id: x.album_id, album: x.album, artist: x.artist, artist_id: x.artist_id,
      /* a split song always gets its mic here, whatever the lyric cache says */
      lyrics: x.stems === 'ready' ? 'yes' : x.lyrics, stems: x.stems, album_artist: x.album_artist }));
    const ctx = { play: i => (opener ? karPressTrack(tracks[i]) : playQueue(tracks, i, label)),
                  thumbs: true, sub: t => t.album || '', subLinks: true };
    let last = null;
    tracks.forEach((t, i) => {
      const who = t.album_artist || t.artist || '';
      if (who !== last) {
        last = who;
        const h = document.createElement('div'); h.className = 'eyebrow';
        h.style.margin = '14px 12px 4px';
        h.textContent = who;
        list.appendChild(h);
      }
      const row = trackRow(t, i, ctx);
      if (raw[i].pct != null) {
        const d = row.querySelector('.du');
        if (d) d.textContent = raw[i].stems === 'queued' ? (/align/.test(raw[i].msg || '') ? 'to align' : 'queued')
                             : raw[i].stems === 'error' ? 'failed'
                             : (/align/.test(raw[i].msg || '') ? 'aligning' : (raw[i].pct || 0) + '%');
        if (raw[i].stems === 'queued' || raw[i].stems === 'error') {
          /* a waiting job can be withdrawn; a running one is left to finish.
             The row's + (add to playlist) becomes the ✕, as on a playlist: the
             row is a fixed grid and an extra element would wrap onto its own line */
          const x = row.querySelector('.tradd') || document.createElement('button');
          x.title = 'Remove from the queue'; x.innerHTML = '✕';
          x.onclick = async e => {
            e.stopPropagation();
            try { await fetch('/api/karaoke/prepare/' + t.id, { method: 'DELETE' }); } catch (err) { }
            karWatchDrop(t.id);
            const h = row.previousElementSibling, nx = row.nextElementSibling;
            row.parentNode.removeChild(row);
            if (h && h.classList.contains('eyebrow') && (!nx || nx.classList.contains('eyebrow'))) h.parentNode.removeChild(h);
            toast('Removed from the queue');
          };
          if (!x.parentNode) row.appendChild(x);
        }
      }
      list.appendChild(row);
    });
    return list;
  };
  /* Ready and could-be-next: one block per artist -- picture and name on the
     left, the songs as single lines beside it in three columns, no per-song
     art. A hundred songs by twenty artists is a screen, not a scroll. The
     performer groups a compilation's songs; a band's album stays under the band. */
  let artistsAll = [];
  loadArtistsAll().then(a => { artistsAll = a || []; }).catch(() => { });
  /* perFrame: hand the artist blocks to the page a few per frame instead of
     all at once -- the could-be-next list is ~1,500 artists and ~8,500 rows,
     which built in one go froze the television for seconds */
  const mkGroups = (raw, opener, perFrame) => karGroups(raw,
    (t, tracks) => opener ? karPressTrack(t) : playQueue(tracks, tracks.indexOf(t), 'Karaoke'), perFrame, () => artistsAll);
  let readyList = null, candList = null;
  const readyCount = k => {
    const ds = head.querySelector('.dsub'); if (!ds) return;
    ds.textContent = (k ? k + (k === 1 ? ' song ready' : ' songs ready') : 'Nothing prepared yet') +
      (lib.store && lib.store.bytes ? ' · ' + (lib.store.bytes / 1048576).toFixed(0) + ' MB' : '');
  };
  /* redraw only the Ready list, from a fresh library reply */
  const readyRedraw = (q, after) => {
    if (!q.ready || !q.ready.length) return;
    const nl = mkGroups(q.ready, true);
    if (readyList && readyList.isConnected) readyList.parentNode.replaceChild(nl, readyList);
    else {
      const hg = hgroup('Ready to sing', 'tap a song to open it');
      after.parentNode.insertBefore(hg, after.nextSibling);
      hg.parentNode.insertBefore(nl, hg.nextSibling);
    }
    readyList = nl;
    readyCount(q.ready.length);
    karFilter(); karRail();
  };
  /* the A-Z rail, as on the Artists page: letters come from the artist headings
     of the Ready list, and the first heading under each letter is the anchor */
  const karRail = () => groupsRail(readyList, 'kr');
  /* word alignment is a background refinement of songs already singable, so
     it is one summary line, not a row per song; splits are the rows */
  const isAlign = x => /align/.test(x.msg || '');
  const alignLine = document.createElement('div'); alignLine.className = 'sub'; alignLine.style.cssText = 'margin:2px 12px 10px;color:var(--ink3);font-size:13.5px';
  const paintAlign = list => {
    const al = (list || []).filter(isAlign);
    if (!al.length) { alignLine.hidden = true; return; }
    const run = al.find(x => x.stems === 'running');
    alignLine.hidden = false;
    alignLine.textContent = 'Word timing: ' + (run ? 'aligning “' + (run.title || '') + '”' : 'waiting') +
      (al.length - (run ? 1 : 0) > 0 ? ' · ' + nf(al.length - (run ? 1 : 0)) + ' more to align' : '');
  };
  const splits = lib.inflight.filter(x => !isAlign(x));
  if (lib.inflight.length) {
    v.appendChild(hgroup('Preparing', 'one at a time; each takes a few minutes'));
    paintAlign(lib.inflight); v.appendChild(alignLine);
    const pl = mk(splits, 'Preparing', false);
    v.appendChild(pl);
    /* Keep the percentages honest while the page is open. A song that finishes
       leaves this list at once and Ready is redrawn beneath it. The old tick
       only touched rows still in flight, so with a long queue every finished
       song sat here frozen at its last percentage -- which read as a dozen
       jobs running at once, or abandoned (2 Sep 2026). */
    const tick = setInterval(async () => {
      if (!pl.isConnected && !alignLine.isConnected) { clearInterval(tick); return; }
      let q; try { q = await api('/api/karaoke/library'); } catch (e) { return; }
      const seen = {};
      let live = 0;
      paintAlign(q.inflight);
      (q.inflight || []).forEach(x => {
        seen[x.id] = true;
        if (isAlign(x)) { if (x.stems === 'running' || x.stems === 'queued') live++; return; }
        const d = pl.querySelector('.tr[data-tid="' + x.id + '"] .du'); if (!d) return;
        if (x.stems === 'running') { live++; d.textContent = /align/.test(x.msg || '') ? 'aligning' : (x.pct || 0) + '%'; }
        else if (x.stems === 'queued') { live++; d.textContent = /align/.test(x.msg || '') ? 'to align' : 'queued'; }
        else d.textContent = 'failed';
      });
      let gone = 0;
      [].slice.call(pl.querySelectorAll('.tr')).forEach(r => {
        if (seen[r.dataset.tid]) return;
        const h = r.previousElementSibling, nx = r.nextElementSibling;
        r.parentNode.removeChild(r); gone++;
        if (h && h.classList.contains('eyebrow') && (!nx || nx.classList.contains('eyebrow'))) h.parentNode.removeChild(h);
      });
      if (gone) readyRedraw(q, pl);
      /* nothing left in flight: stop ticking. Never re-render the page from
         here -- rows already move to Ready in place, and a lingering failed
         job made this loop blank and redraw the page every four seconds (3 Sep 2026). */
      if (!live) { clearInterval(tick); }
    }, 4000);
  }
  if (n) {
    v.appendChild(hgroup('Ready to sing', 'by artist; tap a song to open it'));
    readyList = mkGroups(lib.ready, true);
    v.appendChild(readyList);
    karRail();
    const act = head.querySelector('.actrow');
    const sb = document.createElement('button'); sb.className = 'btn sec'; sb.innerHTML = I.shuf + 'Sing them all';
    sb.title = 'Every prepared song in a shuffled run, one karaoke screen after another';
    const tr = lib.ready.map(x => ({ id: x.id, title: x.title, duration: x.duration, album_id: x.album_id,
      album: x.album, artist: x.artist, artist_id: x.artist_id, has_art: x.has_art, is_compilation: x.is_compilation, pool: x.pool }));
    sb.onclick = () => karParty(tr);
    reg(sb); act.appendChild(sb);
  }
  /* Could be next: thousands of songs, fetched and built only when asked.
     The page used to arrive with all of them and the television sat on a
     blank screen while it drew rows nobody had scrolled to (10 Sep 2026). */
  const candN = lib.candidates_n || (lib.candidates || []).length;
  if (candN) {
    const hg = hgroup('Could be next', candN + ' with time-synced lyrics, not yet split');
    v.appendChild(hg);
    const wrap = document.createElement('div'); wrap.className = 'karmore';
    const sb = document.createElement('button'); sb.className = 'btn sec';
    sb.innerHTML = I.kmic + 'Show the ' + candN + ' songs';
    sb.title = 'List them by artist; pick one to have it split';
    wrap.appendChild(sb); v.appendChild(wrap);
    reg(sb);
    sb.onclick = async () => {
      if (sb.disabled) return;
      sb.disabled = true; sb.textContent = 'Loading…';
      let full;
      try { full = await api('/api/karaoke/library?candidates=1'); }
      catch (e) { sb.disabled = false; sb.innerHTML = I.kmic + 'Show the ' + candN + ' songs'; toast('Could not load the list'); return; }
      if (!wrap.isConnected) return;
      candList = mkGroups(full.candidates || [], true, 12);
      wrap.parentNode.replaceChild(candList, wrap);
      /* the ring was on the button; put it on the first song of the list */
      if (TVMODE) {
        const first = candList.querySelector('.krow');
        if (first) setTvFocus(first); else tvFocusSection();
      }
      candList.onbuilt = () => { karFilter(); };
    };
  }
  if (!n && !lib.inflight.length && !candN) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Open any song with a microphone on its row and press it; the split is kept here.';
    v.appendChild(e);
  }
}

async function playArtist(ar, shuffled) {
  /* stitch the artist's albums into one queue, oldest first */
  const albs = ar.albums.slice(0, 25);
  const details = await Promise.all(albs.map(a => api('/api/album/' + a.id).catch(() => null)));
  let tracks = [];
  for (const al of details) {
    if (!al) continue;
    tracks = tracks.concat(al.tracks.map(t => ({ id: t.id, title: t.title, duration: t.duration, album_id: al.id, album: al.title, artist: t.track_artist || al.artist, artist_id: al.artist_id })));
  }
  if (shuffled) tracks.sort(() => Math.random() - .5);
  playQueue(tracks, 0, ar.name);
  toast('Playing ' + ar.name + ' — ' + tracks.length + ' tracks', I.play);
}

/* -------- one album */
async function vAlbum(v, id, q) {
  const [a] = await Promise.all([api('/api/album/' + id), loadGenres()]);
  paletteFromAlbum(a.id, a.title, a.artist, a.art_kind === null);
  const head = document.createElement('div'); head.className = 'dethead';
  /* inside a set the tag title is usually the set's (often wrong) name repeated
     on every disc, so the derived disc label is the more truthful heading */
  const bareDisc = /^disc\s*\d+$/i.test(a.disc_label || '');
  /* "Disc 1" is a fine label in a list and a terrible page heading, so a disc
     of a multi-disc album is titled by the album and numbered in the eyebrow */
  const shown = (a.collection && a.disc_label && !bareDisc)
    ? a.disc_label : (bareDisc ? a.collection.name : a.title);
  const eyebrow = a.collection
    ? esc(a.collection.name) + (a.disc_no ? ' · Disc ' + a.disc_no : '')
    : 'Album';
  head.innerHTML = '<div class="dart">' + artImg(a.id, 800, shown, a.artist, a.art_kind === null) + '</div>' +
    '<div class="dmeta"><div class="eyebrow">' + eyebrow + '</div><h1>' + esc(shown) + '</h1>' +
    '<div class="dsub"><a data-a="artist">' + esc(a.artist) + '</a> · ' + a.n_tracks + ' tracks · ' + fmtLong(a.duration) + '</div>' +
    '<div class="actrow"></div><div class="chips"></div></div>';
  head.querySelector('[data-a="artist"]').onclick = () => go('#/artist/' + a.artist_id);
  reg(head.querySelector('[data-a="artist"]'));
  v.appendChild(head);
  const act = head.querySelector('.actrow');
  const mk = (cls, html, fn) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.innerHTML = html; b.onclick = fn; reg(b); act.appendChild(b); return b; };
  const tracks = a.tracks.map(t => ({ id: t.id, title: t.title, track: t.track, duration: t.duration, album_id: a.id, album: a.title, artist: t.track_artist || a.artist, artist_id: a.artist_id, lyrics: t.lyrics, stems: t.stems,
    has_art: t.has_art, is_compilation: a.is_compilation, pool: a.pool }));
  splitPlay(act, () => playQueue(tracks, 0, a.title));
  mk('sec', I.shuf + 'Shuffle', () => { playQueue(tracks.slice().sort(() => Math.random() - .5), 0, a.title); });
  mk('sec', I.queue, () => openTrackSheet(tracks, a.title, { album_id: a.id }));
  const hb = mk('sec', I.heart, async () => { const on = await toggleFav('album', a.id, a.title); if (on != null) { hb.innerHTML = on ? I.heartF : I.heart; hb.classList.toggle('hearted', on); } });
  api('/api/favourite/check?kind=album&id=' + a.id).then(s => { if (s.favourite) { hb.innerHTML = I.heartF; hb.classList.add('hearted'); } }).catch(() => { });
  const rf = mk('sec', I.disc + 'Refetch cover', async () => {
    /* the wrong sleeve on a record: ask MusicBrainz and the Cover Art Archive
       for this artist and title, then show the new one straight away */
    rf.disabled = true; rf.innerHTML = I.disc + 'Looking…';
    try {
      const r = await fetch('/api/admin/refetch-art/' + a.id, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const j = await r.json();
      if (!r.ok) { toast(j.detail || 'No cover found'); rf.disabled = false; rf.innerHTML = I.disc + 'Refetch cover'; return; }
      ARTBUST[a.id] = Date.now();
      toast('Cover replaced' + (j.width ? ' (' + j.width + ' px)' : ''));
      route();
    } catch (e) { toast('Could not refetch the cover'); rf.disabled = false; rf.innerHTML = I.disc + 'Refetch cover'; }
  });

  const chips = head.querySelector('.chips');
  chips.appendChild(chip(I.mic + ' ' + esc(a.artist), () => go('#/artist/' + a.artist_id)));
  if (a.collection) chips.appendChild(chip(esc(a.collection.name) + ' · ' +
    a.collection.n_discs + ' discs', () => go('#/collection/' + a.collection.id)));
  if (a.genre_id) { const gn = genreName(a.genre_id); if (gn) chips.appendChild(chip(esc(gn) + (a.subgenre && a.subgenre !== gn ? ' · ' + esc(a.subgenre) : ''), () => go('#/genre/' + a.genre_id))); }
  if (a.year) chips.appendChild(chip(String(a.year), () => go('#/decade/' + (a.decade || Math.floor(a.year / 10) * 10) + '?year=' + a.year)));

  const list = document.createElement('div'); list.className = 'trlist cols';
  const multiArtist = tracks.some(t => t.artist !== a.artist);
  const ctx = { play: i => playQueue(tracks, i, a.title), sub: multiArtist ? (t => t.artist) : null };
  let lastDisc = null;
  a.tracks.forEach((t, i) => {
    if (a.disc_count > 1 && t.disc !== lastDisc) {
      lastDisc = t.disc;
      const dh = document.createElement('div'); dh.className = 'eyebrow'; dh.style.margin = '18px 12px 6px';
      /* These files carry no disc tag; the grouping was worked out from the
         track numbering, so say so rather than implying it came off the sleeve. */
      dh.textContent = 'Disc ' + (t.disc || 1) +
        (a.disc_inferred && t.disc === 1 ? '  ·  grouping inferred' : '');
      list.appendChild(dh);
    }
    list.appendChild(trackRow(tracks[i], i, ctx));
  });
  v.appendChild(list);
  warmMics(list, tracks);

  const focusT = +q.get('t');
  if (focusT) requestAnimationFrame(() => {
    const row = list.querySelector('.tr[data-tid="' + focusT + '"]');
    if (row) { row.scrollIntoView({ block: 'center' }); row.classList.add('flash'); }
  });
}

/* -------- favourites */
async function vFavs(v) {
  /* Starred things are a library of their own: the same songs seen as songs,
     as the albums they come from, or as their artists, plus whatever was
     starred whole. Each view can remove; adding happens where the music is
     (the heart, a long press, hold OK), so "Add" here just opens search. */
  const [tracks, favAl, favAr, allAl, allAr] = await Promise.all([
    api('/api/playlist/favourites?limit=1000').catch(() => []),
    api('/api/favourites?kind=album').catch(() => []),
    api('/api/favourites?kind=artist').catch(() => []),
    loadAlbumsAll().catch(() => []), loadArtistsAll().catch(() => [])
  ]);
  const stAl = favAl.map(f => allAl.find(a => a.title === f.label && a.artist === f.detail)).filter(Boolean);
  const stAr = favAr.map(f => allAr.find(a => a.name === f.label)).filter(Boolean);
  const albumsOf = {}, artistsOf = {};
  tracks.forEach(t => {
    const a = albumsOf[t.album_id] || (albumsOf[t.album_id] = { id: t.album_id, title: t.album, artist: t.artist, n: 0 }); a.n++;
    const r = artistsOf[t.artist] || (artistsOf[t.artist] = { name: t.artist, n: 0 }); r.n++;
  });
  const derivedAl = Object.keys(albumsOf).map(k => albumsOf[k]).filter(a => !stAl.some(x => x.id === a.id));
  const derivedAr = Object.keys(artistsOf).map(k => artistsOf[k]).filter(a => !stAr.some(x => x.name === a.name));
  const nAl = stAl.length + derivedAl.length, nAr = stAr.length + derivedAr.length;

  const head = document.createElement('div'); head.className = 'dethead';
  head.innerHTML = '<div class="dmeta"><div class="eyebrow">Yours</div><h1>Favourites</h1>' +
    '<div class="dsub">' + nf(tracks.length) + (tracks.length === 1 ? ' song' : ' songs') + ' · ' + nAl + (nAl === 1 ? ' album' : ' albums') + ' · ' + nAr + (nAr === 1 ? ' artist' : ' artists') +
    '</div><div class="actrow"></div><div class="chips"></div></div>';
  v.appendChild(head);
  const act = head.querySelector('.actrow');
  const qtr = tracks.map(t => ({ id: t.id, title: t.title, duration: t.duration, album_id: t.album_id, album: t.album, artist: t.artist }));
  if (qtr.length) {
    splitPlay(act, () => playQueue(qtr, 0, 'Favourites'));
    const sb = document.createElement('button'); sb.className = 'btn sec'; sb.innerHTML = I.shuf + 'Shuffle';
    sb.onclick = () => playQueue(qtr.slice().sort(() => Math.random() - .5), 0, 'Favourites'); reg(sb); act.appendChild(sb);
  }
  const ab = document.createElement('button'); ab.className = 'btn sec'; ab.innerHTML = I.plus + 'Add songs…';
  ab.title = 'Find something, then use the heart or a long press to star it';
  ab.onclick = () => openSearch(); reg(ab); act.appendChild(ab);

  const chips = head.querySelector('.chips');
  let view = 'songs'; try { view = store['jb.favview'] || 'songs'; } catch (e) { }
  const body = document.createElement('div'); v.appendChild(body);
  const views = [['songs', 'Songs', tracks.length], ['albums', 'Albums', nAl], ['artists', 'Artists', nAr]];
  const cs = {};
  views.forEach(([k, label, n]) => {
    cs[k] = chip(esc(label) + ' <span class="cn">' + n + '</span>', () => { view = k; try { store['jb.favview'] = k; } catch (e) { } render(); });
    chips.appendChild(cs[k]);
  });

  const empty = msg => { const e = document.createElement('div'); e.className = 'empty'; e.textContent = msg; return e; };
  const unstar = async (kind, id, label, el) => {
    try { await post('/api/favourite', { kind, id, on: false }); } catch (e) { toast('Could not update favourite'); return; }
    toast('Removed from favourites — ' + label, I.heart);
    if (el && el.parentNode) el.parentNode.removeChild(el);
  };
  const xbtn = (title, fn) => {
    const b = document.createElement('button'); b.className = 'trx'; b.title = title; b.textContent = '✕';
    b.onclick = e => { e.stopPropagation(); fn(); }; return b;
  };
  function render() {
    Object.keys(cs).forEach(k => cs[k].classList.toggle('on', k === view));
    body.innerHTML = '';
    if (view === 'songs') {
      if (!qtr.length) { body.appendChild(empty('No starred songs yet. Long-press a track, or hold OK on the remote.')); return; }
      const list = document.createElement('div'); list.className = 'trlist';
      const ctx = { thumbs: true, subLinks: true, play: i => playQueue(qtr, i, 'Favourites'), sub: t => t.artist + ' — ' + t.album };
      qtr.forEach((t, i) => {
        const row = trackRow(t, i, ctx);
        const b = row.querySelector('.tradd');
        if (b) { b.innerHTML = '✕'; b.title = 'Remove from favourites'; b.onclick = e => { e.stopPropagation(); unstar('track', t.id, t.title, row); }; }
        list.appendChild(row);
      });
      body.appendChild(list);
      return;
    }
    if (view === 'albums') {
      if (!nAl) { body.appendChild(empty('No albums yet. Star an album with its heart, or star some songs.')); return; }
      if (stAl.length) {
        body.appendChild(hgroup('Starred albums', String(stAl.length)));
        const g = document.createElement('div'); g.className = 'grid';
        stAl.forEach(a => {
          const tile = albumTile(a); const wrap = document.createElement('div'); wrap.style.position = 'relative';
          const x = xbtn('Remove from favourites', () => unstar('album', a.id, a.title, wrap));
          x.style.cssText = 'position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.55)';
          wrap.appendChild(tile); wrap.appendChild(x); g.appendChild(wrap);
        });
        body.appendChild(g);
      }
      if (derivedAl.length) {
        body.appendChild(hgroup('From your starred songs', derivedAl.length + (derivedAl.length === 1 ? ' album' : ' albums')));
        const g = document.createElement('div'); g.className = 'grid';
        derivedAl.sort((a, b) => b.n - a.n).forEach(a => {
          const d = document.createElement('div'); d.className = 'tile';
          d.innerHTML = '<div class="cov">' + artImg(a.id, 300, a.title, a.artist) + '</div>' +
            '<div class="tt">' + esc(a.title) + '</div><div class="ts">' + esc(a.artist) + ' · ' + a.n + (a.n === 1 ? ' starred song' : ' starred songs') + '</div>';
          d.dataset.pal = a.id; d.dataset.t = a.title; d.dataset.s = a.artist; d.dataset.fav = 'album:' + a.id;
          d.onclick = () => go('#/album/' + a.id); reg(d); g.appendChild(d);
        });
        body.appendChild(g);
      }
      return;
    }
    if (!nAr) { body.appendChild(empty('No artists yet. Star an artist from their page, or star some songs.')); return; }
    if (stAr.length) {
      body.appendChild(hgroup('Starred artists', String(stAr.length)));
      const g = document.createElement('div'); g.className = 'grid';
      stAr.forEach(a => {
        const tile = artistTile(a); const wrap = document.createElement('div'); wrap.style.position = 'relative';
        const x = xbtn('Remove from favourites', () => unstar('artist', a.id, a.name, wrap));
        x.style.cssText = 'position:absolute;top:8px;right:8px;z-index:2;background:rgba(0,0,0,.55)';
        wrap.appendChild(tile); wrap.appendChild(x); g.appendChild(wrap);
      });
      body.appendChild(g);
    }
    if (derivedAr.length) {
      body.appendChild(hgroup('From your starred songs', derivedAr.length + (derivedAr.length === 1 ? ' artist' : ' artists')));
      const g = document.createElement('div'); g.className = 'grid';
      derivedAr.sort((a, b) => b.n - a.n).forEach(a => {
        const m = allAr.find(x => x.name === a.name);
        if (!m) return;
        const tile = artistTile(m);
        const ts = tile.querySelector('.ts'); if (ts) ts.textContent = a.n + (a.n === 1 ? ' starred song' : ' starred songs');
        g.appendChild(tile);
      });
      body.appendChild(g);
    }
  }
  render();
}

/* ================================================================= search */
const soEl = $('#so'), sqEl = $('#sq'), soresEl = $('#sores');
/* ---- speaking instead of typing -------------------------------------
   A WebView has no speech recognition: the Web Speech API is a Chrome feature
   and this is Chrome's engine without Chrome around it, so `webkitSpeechRecognition`
   is not there. The television app (tvapp/MainActivity.java) opens Android's own
   "speak now" dialog and hands the words back through mmVoiceResult, so voice
   search exists exactly where the app is installed and nowhere else. The remote's
   own microphone key reaches the app only on televisions that pass it through
   rather than giving it to their assistant, which is why the button below is
   here: it always works. */
const TVVOICE = (function () {
  if (/[?&]voice=1/.test(location.search)) return true;   // ?voice=1: draw it without a television
  try { return !!(window.MusicMateTV && window.MusicMateTV.hasVoice()); } catch (e) { return false; }
})();
window.mmVoiceResult = function (text) {
  const q = (text || '').trim();
  const b = $('#sovoice'); if (b) b.classList.remove('listening');
  if (!q) return;
  openSearch(q);
};
function voiceSearch() {
  if (!TVVOICE) return;
  const b = $('#sovoice'); if (b) b.classList.add('listening');
  try { window.MusicMateTV.startVoice(); }
  catch (e) { if (b) b.classList.remove('listening'); toast('Voice search is not available'); }
}
(function () {
  const b = $('#sovoice'); if (!b) return;
  b.innerHTML = I.kmic;                     // the real microphone; I.mic is a person
  b.hidden = !TVVOICE;
  b.onclick = e => { e.stopPropagation(); voiceSearch(); };
  if (TVVOICE) regChrome(b);
})();

function openSearch(prefill) {
  soEl.classList.add('open');
  if (IS_TV) { buildKb(); $('#kb').classList.add('on'); sqEl.readOnly = true; }
  if (prefill != null) { sqEl.value = prefill; doSearch(prefill); }
  else if (!sqEl.value) soresEl.innerHTML = '<div class="kindh" style="margin-top:30px">Type to search the whole library</div>';
  if (!IS_TV) setTimeout(() => sqEl.focus(), 60);
  tvEnter(soEl);
  if (TVMODE) {
    /* the ring starts on the microphone where there is one -- the whole point
       of it is to skip the keyboard -- and on the first key where there is not */
    const mic = $('#sovoice');

/* The on-screen keyboard for a remote. QWERTY is what every hand expects

function kbSetMode(m) { try { store['jb.kb'] = m; } catch (e) { } buildKb(true); }
function buildKb(force) {

    chars.split('').forEach(ch => row.appendChild(key(ch, '', () => type(ch.toLowerCase()))));

  last.appendChild(key(mode === 'qwerty' ? 'ABC' : 'QWERTY', 'mode', () => kbSetMode(mode === 'qwerty' ? 'abc' : 'qwerty'), 'Switch the key layout'));
  last.appendChild(key('␣', 'sp', () => type(' '), 'Space'));
  last.appendChild(key('⌫', 'wide', () => { sqEl.value = sqEl.value.slice(0, -1); doSearch(sqEl.value); }, 'Delete'));
  last.appendChild(key('Clear', 'wide', () => { sqEl.value = ''; doSearch(''); }, 'Start again'));

/* the first letter, not the first digit: Q or A depending on the layout */
function kbFirstKey() { const rows = $$('#kb .kbrow'); return (rows[1] || rows[0] || $('#kb')).querySelector('.kk'); }

  const byPool = {}; const poolOrder = [];
  for (const r of res) {
    const k = (!r.pool || r.pool === 'VariousArtists') ? '' : r.pool;
    if (!byPool[k]) { byPool[k] = { artist: [], album: [], track: [], disc: [] }; poolOrder.push(k); }

  poolOrder.sort((a, b) => (a === '' ? -1 : b === '' ? 1 : a.localeCompare(b)));

function searchRow(r) {

/* A track search hit carries only the track id and its album TITLE, so find the

/* ============================================ surviving a page reload
   Everything about the player lived in memory, so a refresh forgot the queue
   and the now-bar vanished while a speaker carried on playing. Two halves fix
   it: remember the queue locally, and -- because the speaker is the real
   authority -- ask it what it is doing and believe that over what we stored.
   Reading the speaker's queue also picks up playback started from the Sonos
   app, which nothing stored locally could ever know about. */
const SKEY = 'jb.session';

function saveSession() {
  try {
    store[SKEY] = JSON.stringify({
      out: { kind: OUT.kind, ip: OUT.ip, name: OUT.name, group: OUT.group,
             targets: OUT.targets },
      ids: P.q.map(t => t.id), i: P.i, ctx: P.ctx,
      build: ARTGEN,
      pos: OUT.kind === 'local' ? Math.floor(audio.currentTime || 0) : OUT.pos,
      at: Date.now()
    });
  } catch (e) { /* private mode, or storage full -- not worth breaking over */ }
}
setInterval(() => { if (trackOf()) saveSession(); }, 5000);
addEventListener('pagehide', saveSession);

async function hydrate(ids) {
  if (!ids || !ids.length) return [];
  try { return await api('/api/tracks?ids=' + ids.join(',')); }
  catch (e) { return []; }
}

async function restoreSession() {
  let sv = null;
  try { sv = JSON.parse(store[SKEY] || 'null'); } catch (e) { sv = null; }
  /* a queue saved against an older build holds ids that now mean other
     recordings -- drop it rather than restore someone else's songs */
  if (sv && sv.build && ARTGEN && sv.build !== ARTGEN) sv = { out: sv.out };
  const o = sv && sv.out;

  if (o && o.kind === 'sonos' && o.ip) {
    /* trust the speaker, not the tab */
    let stt = null, q = null;
    try {
      [stt, q] = await Promise.all([
        api('/api/sonos/state?ip=' + encodeURIComponent(o.ip) + (o.group ? '&group=1' : '')),
        api('/api/sonos/queue?ip=' + encodeURIComponent(o.ip))
      ]);
    } catch (e) { stt = null; }
    if (stt) {
      OUT.kind = 'sonos'; OUT.ip = o.ip; OUT.name = o.name || 'Speaker';
      OUT.group = !!o.group;
      OUT.targets = (o.targets && o.targets.length) ? o.targets : [{ ip: o.ip, name: o.name }];
      OUT.pos = stt.position || 0; OUT.dur = stt.duration || 0;
      OUT.muted = !!stt.muted;
      const lbl = $('#outname'); if (lbl) lbl.textContent = OUT.name;
      const tb = $('#toutput');
      if (tb) { tb.classList.add('routed'); tb.title = 'Playing on ' + OUT.name; }
      document.body.classList.add('remote');
      paintVol(stt.volume);

      const ids = (q && q.ids || []).filter(x => x != null);
      /* a queue full of things we did not serve (radio, Spotify) is not ours
         to represent -- fall back to what this browser last queued */
      const useSpeaker = ids.length && q.ours >= Math.max(1, Math.floor(q.n * 0.5));
      const list = await hydrate(useSpeaker ? ids : (sv.ids || []));
      if (list.length) {
        P.q = list; P.ctx = sv.ctx || '';
        const qi = (stt.track || 0) - 1;
        P.i = (useSpeaker && qi >= 0 && qi < list.length) ? qi
            : Math.min(Math.max(0, sv.i || 0), list.length - 1);
        /* If the room has been handed to Spotify or radio since we last
           looked, the sound coming out of it is not ours -- show the queue
           cued and paused rather than pretending we are driving it. */
        const live = useSpeaker && ourUri(stt.uri) &&
                     (stt.state === 'PLAYING' || stt.state === 'TRANSITIONING');
        remotePaused = !live;
        paintNow(); paintPlayState(); refreshHeart();
        const t = trackOf();
        if (t && t.album_id) paletteFromAlbum(t.album_id, t.album || t.title, t.artist);
        if (live) {
          post('/api/play/start', { track_id: t.id, room: OUT.name })
            .then(r => { P.playId = r.play_id; }).catch(() => {});
        }
        OUT.syncHold = 0;
      }
      /* always poll: even with no queue of ours, the room may be playing
         something worth showing (and worth being able to pause) */
      OUT.syncHold = 0;
      startPoll();
      return;
    }
    /* speaker unreachable: fall through and restore locally instead */
  }

        () => { try { audio.currentTime = sv.pos; } catch (e) {} }, { once: true });
    }
    paintNow(); paintPlayState(); refreshHeart();
    paletteForTrack(t);
  }

/* ?diag=1 -- report what the stylesheet actually RESOLVED to on this device.

           (store['jb.uiscale'] || 'unset') + '   body: ' + document.body.className);
    ['--fb-inset', '--fb-clamp', '--fb-min', '--fb-max', '--fb-ar', '--fb-bf'].forEach(function (v) {

     '#np .npart', '#np', '#nowbar', '#bnav', '#bn-kar', '#bn-search', '#top', '#nav', '#topbtns'].forEach(function (sel) {

             ' padB=' + st.paddingBottom + ' basis=' + st.flexBasis +
             ' maxW=' + st.maxWidth + ' objFit=' + st.objectFit);
    });
    var x = new XMLHttpRequest();
    x.open('POST', '/api/diag', true);
    x.setRequestHeader('Content-Type', 'application/json');
    x.send(JSON.stringify({ lines: L }));

}

/* ================================================================== karaoke
   Two stems play together: the backing track always, the voice on a gain the
   singer controls. Both go through one AudioContext so the toggle is a ramp
   rather than a reload, and the backing track is the clock everything else
   reads -- lyrics, envelope and visuals all follow it, so nothing can drift
   away from the audio.

   Every visual here moves on the vocal envelope measured from the separated
   file, or on the lyric timeline. Nothing moves decoratively: the room can
   hear the song, and motion that only pretends to follow it is obvious within
   seconds and discredits the parts that are real. */
const KAR = {
  on: false, tid: null, track: null, avail: null, lyr: null, gen: 0, disc: null,
  offset: 0, offTimer: 0, music: true,
  ctx: null, aB: null, aV: null, gB: null, gV: null,
  env: null, hz: 20, lines: [], dur: 0, climax: null,
  els: [], idx: -1, waiting: false, measured: false,
  vmode: 0, raf: 0, motes: [], smooth: 0, poll: 0, ribs: []
};

function karEnvAt(t) {
  if (!KAR.env || !KAR.env.rms) return 0;
  const i = Math.floor(t * KAR.hz);
  return (i >= 0 && i < KAR.env.rms.length) ? KAR.env.rms[i] / 255 : 0;
}

/* ---- the microphone on Now Playing ------------------------------------ */
async function karMicUpdate() {
  const b = $('#npmic'); if (!b) return;
  const t = trackOf();
  if (!t) { b.hidden = true; return; }
  b.hidden = false;
  b.classList.remove('ready', 'busy');
  b.title = 'Sing this';
  try {
    const st = await api('/api/karaoke/status/' + t.id);
    if (!st || !st.available) { b.hidden = true; return; }
    if (st.state === 'ready') { b.classList.add('ready'); b.title = 'Sing along from here'; }
    else if (st.state === 'running' || st.state === 'queued') {
      b.classList.add('busy'); b.title = 'Preparing…';
    }
  } catch (e) { /* leave it in its neutral state */ }
}

async function karPressTrack(t, at) {
  if (!t) return;
  let st;
  try { st = await api('/api/karaoke/status/' + t.id); }
  catch (e) { toast('Could not reach the server'); return; }
  if (!st.available) { toast('Vocal separation is not installed on the server'); return; }
  if (st.lyrics === 'no') { toast('No time-synced lyrics for this song'); return; }
  if (st.state === 'ready') { karOpen(t.id, st, t, at); return; }
  /* Not ready: queue the split and say so, without leaving this screen. The
     progress view took the user away from what they were browsing for a job
     that runs for minutes; a toast and a busy microphone tell the same story
     and keep the d-pad focus where it was. The Karaoke page still shows the
     percentage for anyone who wants to watch. */
  karQueueSplit(t);
}
async function karQueueSplit(t) {
  let st = null, q = null;
  try {
    const r = await fetch('/api/karaoke/prepare/' + t.id, { method: 'POST' });
    if (!r.ok) throw new Error('server said ' + r.status);
    st = await r.json();
    q = await api('/api/karaoke/queue');
  } catch (e) { toast('Could not queue the split: ' + e); return; }
  const jobs = (q && q.jobs || []).filter(j => j.state === 'queued' || j.state === 'running');
  const n = jobs.length;
  const already = st && st.state === 'running';
  toast((already ? 'Already splitting' : 'Splitting queued') + ' · ' + (t.title || '') +
        ' · ' + n + (n === 1 ? ' song in the queue' : ' songs in the queue'), I.kmic);
  $$('.tr[data-tid="' + t.id + '"] .trmic').forEach(b => { b.classList.add('busy'); b.title = 'Preparing…'; });
  const np = trackOf();
  if (np && np.id === t.id) karMicUpdate();
  karWatchAdd(t);
}
/* The mic on Now Playing joins the song where it is: karaoke opens at the
   current position instead of starting the song over. A row's mic starts
   from the top, as before. */
function karPress() {
  const t = trackOf(); if (!t) return;
  const pos = nowPos();
  karPressTrack(t, pos > 3 ? pos : 0);
}

/* ---- sing them all: a shuffled run through every prepared song, each one
   opening in the karaoke screen as the last one ends -- what a room actually
   wants from a "play everything" button on this page. Leaving the screen with
   Back ends the run; the automatic hop between songs does not. */
function karParty(tracks) {
  if (!tracks || !tracks.length) return;
  KAR.party = { list: tracks.slice().sort(() => Math.random() - .5), i: 0 };
  toast('Singing all ' + tracks.length + ' — Back leaves the run', I.kmic);
  karPartyOpen();
}
async function karPartyOpen() {
  const pty = KAR.party; if (!pty) return;
  while (pty.i < pty.list.length) {
    const t = pty.list[pty.i];
    let st = null;
    try { st = await api('/api/karaoke/status/' + t.id); } catch (e) { st = null; }
    if (st && st.state === 'ready' && st.lyrics !== 'no') { karOpen(t.id, st, t); return; }
    pty.i++;
  }
  KAR.party = null; toast('That was everyone');
}
function karEnded() {
  const pty = KAR.party;
  if (!pty) { karPaintPlay(); return; }
  pty.i++;
  const nxt = pty.list[pty.i];
  if (!nxt) { KAR.party = null; toast('That was the last one'); karPaintPlay(); return; }
  toast('Up next: ' + nxt.title + (nxt.artist ? ' — ' + nxt.artist : ''), I.kmic);
  setTimeout(() => {
    if (!KAR.party) return;
    KAR.partyHop = true; karClose(); KAR.partyHop = false;
    karPartyOpen();
  }, 2800);
}

/* ---- "your song is ready": the splits this browser asked for are watched
   until they finish, across reloads (the list lives in localStorage), and each
   one announces itself once with a toast. Polled every 20 s -- a split takes
   minutes, so that is plenty. */
function karWatchList() { try { return JSON.parse(store['jb.karwatch'] || '[]'); } catch (e) { return []; } }
function karWatchSave(l) { try { store['jb.karwatch'] = JSON.stringify(l.slice(-60)); } catch (e) { } }
function karWatchAdd(t) {
  const l = karWatchList();
  if (!l.some(x => x.id === t.id)) { l.push({ id: t.id, title: t.title || '', artist: t.artist || '', at: Date.now() }); karWatchSave(l); }
}
function karWatchDrop(id) { karWatchSave(karWatchList().filter(x => x.id !== id)); }
async function karWatchTick() {
  const l = karWatchList(); if (!l.length) return;
  for (let i = 0; i < l.length; i++) {
    const w = l[i];
    let st; try { st = await api('/api/karaoke/status/' + w.id); } catch (e) { continue; }
    if (st.state === 'ready') {
      toast('“' + w.title + '” is ready to sing', I.kmic);
      $$('.tr[data-tid="' + w.id + '"] .trmic').forEach(b => { b.classList.remove('busy'); b.classList.add('ready'); b.title = 'Sing this — ready'; });
      karWatchDrop(w.id);
    } else if (st.state === 'error' || st.state === 'cancelled' || (st.state === 'none' && Date.now() - w.at > 3600e3)) {
      if (st.state === 'error') toast('Could not split “' + w.title + '”');
      karWatchDrop(w.id);
    }
  }
}
setInterval(karWatchTick, 20000);

/* ---- opening --------------------------------------------------------- */
/* `track` is the row's own object when a list started this; the song playing
   is only the default */
/* The song being sung IS what is playing: it takes the player's current slot
   (queue of one, paused underneath the stems) so the now bar, Now Playing and
   the play history all agree with the room. Nothing starts the ordinary
   stream; the karaoke screen owns the sound while it is open. */
function karAdopt(t) {
  if (!t || !t.id) return;
  const cur = trackOf();
  if (cur && cur.id === t.id) return;
  try { audio.pause(); } catch (e) { }
  P.q = [t]; P.i = 0; P.ctx = 'Karaoke';
  buildOrder(true);
  P.playId = null;
  paintNow(); refreshHeart(); paintPlayState(); saveSession();
  post('/api/play/start', { track_id: t.id, room: OUT.kind === 'sonos' ? OUT.name : ROOM })
    .then(r => { P.playId = r.play_id; }).catch(() => { });
}
async function karOpen(tid, st, track, at) {

/* A disc song: no stems, no preparation -- one backing track and text already

function karPrepShow(on) {
