/* ---- turning lyric lines and an envelope into a performance ----------- */
function karBuild(synced, env) {
  const lines = [];
  for (let i = 0; i < synced.length; i++) {
    const txt = (synced[i].line || '').trim();
    if (!txt) continue;
    const t = synced[i].t;
    const nxt = synced[i + 1] ? synced[i + 1].t : (KAR.dur || t + 4);
    const w = txt.split(/\s+/);
    /* A line does not last until the next one starts: the space between is
       often an instrumental. Where the line ends is read from the recorded
       voice, so a "do-do-do-do-do" that runs on for six seconds keeps its
       line on screen for six seconds. The text estimate is only the fallback. */
    lines.push({ t: t, e: karLineEnd(t, nxt, txt, env), w: w, txt: txt, starts: null, rib: null, i: i, nxt: nxt });
  }
  /* Forced alignment, when the song has it: the real start and end of every
     word, from the vocal stem and the exact text (align.py). A line is taken
     only when the aligner was confident and the word count matches; the rest
     keep the envelope estimate below. Times arrive in audio time and the
     lyric clock runs offset behind it, so they are moved onto the lyric clock. */
  const W = KAR.words && KAR.words.lines ? KAR.words.lines : null;
  if (W) {
    const byI = {}; W.forEach(x => { byI[x.i] = x; });
    /* A line the aligner was sure of is placed where the singing actually is.
       This used to take the EARLIER of the LRC's time and the aligner's, which
       kept every early LRC line early: measured over 325 prepared songs, a
       fifth of lines appeared more than half a second before they were sung
       and some whole files sat two seconds out (Lyin' Eyes). The aligner heard
       the voice; the LRC is a stranger's guess. LEAD is the beat of reading
       time a singer needs before the first syllable. */
    const LEAD = 0.25;
    lines.forEach(L => {
      const x = byI[L.i];
      /* version 2's "fair" lines (sane, but the three blocks did not agree)
         beat spreading the words by letters: words over half a second out
         18.6% -> 15.9% against the disc references, 325 songs, 24 Sep 2026 */
      if (!x || !(x.ok != null ? (x.ok || x.fair) : x.c >= 0.4) || !x.words || x.words.length !== L.w.length) return;
      /* the same line, not just the same position: a file aligned before the
         lyrics were parsed differently has its lines numbered differently */
      if (x.text != null && x.text.split(/\s+/).join(' ') !== L.w.join(' ')) return;
      const st = x.words.map(w => w.s - KAR.offset);
      const lastE = x.words[x.words.length - 1].e - KAR.offset;
      if (!(st[0] > L.t - 2.5 && st[0] < L.t + 6)) return;       // an implausible placement is not trusted
      L.starts = st; L.aligned = true;
      L.lrcT = L.t;
      L.t = st[0] - LEAD;
      L.sungE = lastE;
    });
    /* The lines the aligner was not sure of -- about one in nine -- sit among
       the ones it was, and their LRC times carry the same error. That error is
       mostly one constant per file (Lyin' Eyes runs two seconds early from
       first line to last), so the middle drift of every confident line in the
       song is the honest estimate for the rest. Tried and rejected: carrying
       the drift of the nearest confident line each side. It reads better in
       principle and measured worse, because it chases the noise in individual
       lines; against held-out confident lines the median halves the typical
       error (0.44 s -> 0.24 s) and the neighbour version spoils the worst
       cases. Still an estimate, but one taken off measurements of this song. */
    const drift = [];
    lines.forEach(L => { if (L.aligned) drift.push(L.t - L.lrcT); });
    /* Version 2 of the aligner (23 Sep 2026) measures each line's own drift
       -- the median over its nine neighbours, which follows a file made for
       another master and a mid-song jump -- so a doubted line takes that,
       and the song's median only where a line has none. Both carry the
       reading lead, as an aligned line's start does. */
    const v2 = (KAR.words.version || 1) >= 2;
    if (drift.length >= 4 || v2) {
      drift.sort((a, b) => a - b);
      const dSong = drift.length ? Math.max(-2.5, Math.min(2.5, drift[drift.length >> 1])) : 0;
      lines.forEach(L => {
        if (L.aligned) return;
        const x = byI[L.i];
        const d = v2 && x && typeof x.d === 'number' ? Math.max(-6, Math.min(6, x.d - LEAD)) : dSong;
        L.lrcT = L.t;
        L.t = L.t + d;
        L.drifted = true;
        L.w0 = LEAD;            // the line shows a reading beat early; its words are sung LEAD later
      });
    }
    /* Every line may have moved, so a line's neighbour -- which is what says
       when it must be off the screen -- is read again from where the lines
       ended up, not from where the LRC put them. */
    lines.sort((a, b) => a.t - b.t);
    lines.forEach((L, i) => {
      L.nxt = i + 1 < lines.length ? lines[i + 1].t : (KAR.dur || L.t + 4);
      if (L.aligned) L.e = Math.max(L.t + 0.8, Math.min(L.nxt - 0.05, L.sungE + 0.25));
      else if (L.drifted) L.e = karLineEnd(L.t, L.nxt, L.txt, env);
    });
  }
  /* Snap word starts to real vocal attacks where the count lines up. Dividing
     a line proportionally is always a little wrong, and a singer feels every
     error; the onsets come from the actual voice. */
  const on = (env && env.onsets) || [];
  lines.forEach(L => {
    if (L.aligned) return;                                          // real timings already in place
    const inRange = on.filter(o => o >= L.t - 0.2 && o < L.e);
    if (inRange.length >= L.w.length && inRange.length <= L.w.length * 2.2) {
      L.starts = inRange.slice(0, L.w.length);
    }
    /* a held note gets a ribbon: find a sustain inside this line and mark the
       word it lands on */
    ((env && env.sustains) || []).forEach(s => {
      if (s[0] >= L.t && s[0] < L.e && (s[1] - s[0]) >= 0.6) {
        const p = (s[0] - L.t) / Math.max(.01, L.e - L.t);
        L.rib = { k: Math.min(L.w.length - 1, Math.floor(p * L.w.length)),
                  t0: s[0], span: s[1] - s[0] };
      }
    });
  });
  return lines;
}

/* Where a line stops being sung: the first sustained silence in the vocal
   stem after the voice has been going, or the next line, whichever is first.
   Scans audio time, so the current lyric offset is applied. */
function karLineEnd(t, nxt, txt, env) {
  const chars = txt.replace(/\s+/g, '').length;
  const est = Math.max(1.2, Math.min(nxt - t, chars * 0.075));
  const rms = env && env.rms, hz = (env && env.hz) || 20;
  if (!rms || !rms.length) return t + est;
  const floor = 28;                                   // the analyser's own voice floor
  const a0 = t + KAR.offset, a1 = nxt - 0.05 + KAR.offset;
  let i = Math.max(0, Math.floor(a0 * hz));
  const end = Math.min(rms.length, Math.floor(a1 * hz));
  let last = -1, quiet = 0, sung = 0;
  for (; i < end; i++) {
    if (rms[i] > floor) { last = i; quiet = 0; sung++; }
    else if (last >= 0 && ++quiet > hz * 0.7 && sung > hz * 0.6) break;
  }
  if (last < 0) return t + est;
  const e = (last + 1) / hz - KAR.offset;             // back to lyric time
  return Math.max(t + Math.min(est, 1.2), Math.min(nxt - 0.05, e));
}

function karWordAt(L, k) {
  if (L.starts) return L.starts[k];
  let total = 0, acc = 0;
  for (let i = 0; i < L.w.length; i++) total += L.w[i].length + 1;
  for (let i = 0; i < k; i++) acc += (L.w[i].length + 1) / total;
  /* a line moved by the drift appears LEAD before it is sung, like an aligned
     one, so its words start filling LEAD after the line appears -- they used
     to fill from the moment it appeared, a quarter second early (measured
     against the voice starts in 324 stems, 23 Sep 2026) */
  const t0 = L.t + Math.min(L.w0 || 0, Math.max(0, (L.e - L.t) * 0.3));
  return t0 + acc * (L.e - t0);
}

/* ---- the persistent line queue --------------------------------------- */
function karBuildEls() {
  const host = $('#karlines');
  host.innerHTML = '';
  KAR.els = [];
  const size = window.innerWidth < 880 ? 4.4 : 6.2;
  KAR.lines.forEach(L => {
    const d = document.createElement('div');
    d.className = 'kln';
    d.style.fontSize = size + 'vh';
    /* invisible until the first layout places it; otherwise every line sits
       piled at the centre for a frame or two while heights are measured */
    d.style.opacity = '0';
    d.innerHTML = L.w.map(w => '<kw>' + esc(w) + '</kw>').join('');
    host.appendChild(d);
    KAR.els.push(d);
  });
  KAR.measured = false;
  karMeasure();
  /* Heights measured before Fraunces has loaded are measured in the fallback
     face, which changes how many rows a line takes. Measure again once the
     real font is in, and once more shortly after for anything slower. */
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { KAR.measured = false; });
  }
  setTimeout(function () { KAR.measured = false; }, 500);
}

function karMeasure() {
  if (!KAR.els.length || !$('#karlines').offsetHeight) return false;
  KAR.els.forEach(e => { e.style.marginTop = ''; });
  KAR.els.forEach(e => { e.__h = e.offsetHeight; e.style.marginTop = (-e.__h / 2) + 'px'; });
  KAR.measured = KAR.els.every(e => e.__h > 0);
  return KAR.measured;
}

function karSc(d) { return d === 0 ? 1 : d === -1 ? .42 : d === 1 ? .55 : d === 2 ? .46 : .4; }
function karOp(d) { return d === 0 ? 1 : d === -1 ? .42 : d === 1 ? .6 : d === 2 ? .34 : 0; }

function karPlace(el, y, sc, op) {
  el.style.transform = 'translateY(' + y.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ')';
  el.style.opacity = op;
}

function karLayout(idx) {
  const E = KAR.els; if (!E.length) return;
  const gap = window.innerHeight * 0.03;
  E.forEach((e, i) => {
    const d = i - idx;
    e.className = 'kln' + (d === 0 ? ' cur' : (d < 0 ? ' past' : ' next'));
  });
  karPlace(E[idx], 0, 1, KAR.waiting ? .6 : 1);
  let y = 0;
  for (let i = idx + 1; i < E.length; i++) {
    const d = i - idx;
    y += (E[i - 1].__h * karSc(d - 1)) / 2 + (E[i].__h * karSc(d)) / 2 + gap;
    karPlace(E[i], y, karSc(d), karOp(d));
  }
  y = 0;
  for (let i = idx - 1; i >= 0; i--) {
    const d = i - idx;
    y -= (E[i + 1].__h * karSc(d + 1)) / 2 + (E[i].__h * karSc(d)) / 2 + gap;
    karPlace(E[i], y, karSc(d), karOp(d));
  }
  KAR.ribs.forEach(r => { if (r.el.parentNode) r.el.parentNode.removeChild(r.el); });
  KAR.ribs = [];
}

/* ---- embers: how a line dies ----------------------------------------- */
function karShed(x, y, energy) {
  const n = Math.round(8 * (.4 + energy));
  for (let i = 0; i < n; i++) {
    KAR.motes.push({ x: x + (Math.random() - .5) * 340, y: y + (Math.random() - .5) * 40,
      vy: -(.25 + Math.random() * .75), vx: (Math.random() - .5) * .35,
      r: .8 + Math.random() * 1.9, life: 1 });
  }
}

function karDrawMotes(ctx, cv) {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = KAR.motes.length - 1; i >= 0; i--) {
    const m = KAR.motes[i];
    m.x += m.vx; m.y += m.vy; m.life -= .0075;
    if (m.life <= 0) { KAR.motes.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.fillStyle = 'rgba(232,160,76,' + (m.life * .62).toFixed(3) + ')';
    ctx.arc(m.x, m.y, m.r, 0, 6.284);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- the song map: the shape of the song, so the room can see it ------ */
function karDrawMap() {
  const c = $('#karmap'); if (!c) return;
  c.width = c.clientWidth; c.height = c.clientHeight;
  if (!c.width || !KAR.env) return;
  const g = c.getContext('2d'), r = KAR.env.rms, n = r.length, h = c.height;
  g.clearRect(0, 0, c.width, h);
  if (KAR.climax) {
    g.fillStyle = 'rgba(232,160,76,.10)';
    g.fillRect(KAR.climax[0] / KAR.dur * c.width, 0,
      (KAR.climax[1] - KAR.climax[0]) / KAR.dur * c.width, h);
  }
  g.beginPath(); g.moveTo(0, h);
  const step = Math.max(1, Math.floor(n / c.width));
  for (let i = 0; i < n; i += step) {
    let sm = 0, cnt = 0;
    for (let k = Math.max(0, i - 8); k < Math.min(n, i + 8); k++) { sm += r[k]; cnt++; }
    g.lineTo(i / n * c.width, h - (sm / cnt / 255) * (h - 3));
  }
  g.lineTo(c.width, h); g.closePath();
  g.fillStyle = 'rgba(232,160,76,.26)'; g.fill();
  g.strokeStyle = 'rgba(232,160,76,.5)'; g.lineWidth = 1; g.stroke();
}

/* ---- loading the stems ----------------------------------------------- */
async function karLoad() {
  karPrepShow(false);
  const tid = KAR.tid;
  const gen = KAR.gen;                       // torn down or reopened meanwhile? then this load is void
  const base = KAR.disc ? '/api/cdg/' + KAR.disc.id : '/api/karaoke/' + tid;
  let lyr, env;
  try {
    [lyr, env, KAR.words] = await Promise.all([
      api(KAR.disc ? base + '/lyrics' : '/api/lyrics/' + tid),
      api(base + '/envelope'),
      api(base + '/words').catch(() => null)     // optional: forced-alignment word times, or the disc's own
    ]);
  } catch (e) { if (gen === KAR.gen) { toast('Could not load the karaoke data'); karClose(); } return; }
  if (gen !== KAR.gen || !KAR.on) return;
  if (!lyr || !lyr.synced || !lyr.synced.length) {
    toast('No time-synced lyrics for this song'); karClose(); return;
  }
  KAR.env = env; KAR.hz = env.hz || 20; KAR.lyr = lyr.synced;
  KAR.dur = env.duration || (KAR.track && KAR.track.duration) || (KAR.disc && KAR.disc.duration) || 0;
  KAR.climax = env.climax || null;
  KAR.lines = karBuild(lyr.synced, env);
  if (!KAR.lines.length) { toast('No usable lyrics'); karClose(); return; }

  /* the app's own player steps aside; two stems take over */
  try { audio.pause(); } catch (e) {}
  /* a disc has no vocal to mix and no music to drop: those controls go */
  $('#karseg').hidden = !!KAR.disc; $('#karmus').hidden = !!KAR.disc;
  if (KAR.follow) { singLoad(base); return; }

  /* Wherever the main player is pointed is where the singer hears the song.
     A Sonos room gets one rendered mix and the page keeps time from the
     speaker; this device mixes the two stems itself. */
  KAR.remote = (OUT.kind === 'sonos' && outIps().length > 0);
  KAR.music = true;
  $$('#karmus button').forEach(b => b.classList.toggle('sel', b.dataset.m === '1'));
  if (KAR.remote) {
    KAR.aB = KAR.aV = KAR.gB = KAR.gV = null;
    KAR.vmode = 0;
    $$('#karseg button').forEach((b, i) => b.classList.toggle('sel', i === 0));
    stopPoll();                   // the main UI must not follow the room meanwhile
    karBuildEls();
    karDrawMap();
    KAR.idx = -1; KAR.waiting = false; KAR.motes = [];
    KAR.rc = { t0: performance.now(), p0: 0, playing: false, lastP: -1, hold: 0, adj: 0, adjT: 0, ended: false };
    await karCast(KAR.startAt || 0); KAR.startAt = 0;
    if (gen !== KAR.gen || !KAR.on) return;
    clearInterval(KAR.rpoll);
    KAR.rpoll = setInterval(karRemotePoll, 300);
    karPaintPlay();
    cancelAnimationFrame(KAR.raf);
    karFrame();
    singLeadStart();
    return;
  }

  [KAR.aB, KAR.aV].forEach(a => { if (a) { try { a.pause(); a.src = ''; a.load(); } catch (e) {} } });
  if (KAR.disc) {
    /* a disc is one backing track with the vocals already gone: one player, no mixing */
    KAR.aB = new Audio(base + '/audio.mp3'); KAR.aB.preload = 'auto';
    KAR.aV = null; KAR.gB = KAR.gV = null;
  } else {
    KAR.ctx = KAR.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (KAR.ctx.state === 'suspended') { try { await KAR.ctx.resume(); } catch (e) {} }
    if (gen !== KAR.gen || !KAR.on) return;
    KAR.aB = new Audio('/api/karaoke/' + tid + '/backing.opus');
    KAR.aV = new Audio('/api/karaoke/' + tid + '/vocals.opus');
    [KAR.aB, KAR.aV].forEach(a => { a.preload = 'auto'; a.crossOrigin = 'anonymous'; });
    KAR.gB = KAR.ctx.createGain(); KAR.gV = KAR.ctx.createGain();
    KAR.ctx.createMediaElementSource(KAR.aB).connect(KAR.gB).connect(KAR.ctx.destination);
    KAR.ctx.createMediaElementSource(KAR.aV).connect(KAR.gV).connect(KAR.ctx.destination);
    KAR.gB.gain.value = 1;
    karSetVocals(0);
  }

  karBuildEls();
  karDrawMap();
  KAR.idx = -1; KAR.waiting = false; KAR.motes = [];
  ['play', 'pause'].forEach(ev => KAR.aB.addEventListener(ev, karPaintPlay));
  ['playing', 'waiting'].forEach(ev => KAR.aB.addEventListener(ev, () => singReport()));   // a stall starts or ends
  KAR.aB.addEventListener('ended', karEnded);
  try { await Promise.all(KAR.aV ? [KAR.aB.play(), KAR.aV.play()] : [KAR.aB.play()]); }
  catch (e) { if (gen === KAR.gen) toast('Tap the screen to start audio'); }
  if (gen !== KAR.gen || !KAR.on) return;
  if (KAR.startAt > 1) { karSeekTo(KAR.startAt); }
  KAR.startAt = 0;
  karPaintPlay();
  cancelAnimationFrame(KAR.raf);
  karFrame();
  singLeadStart();
}

/* ---- the speaker as the clock ------------------------------------------ */
/* Sonos plays no Opus and takes one stream, so the server renders the chosen
   music/vocal setting into an MP3 once and the room plays that like any track.
   Changing the setting mid-song re-casts from the current position: a short
   hiccup, and the price of not mixing in the browser. */
async function karCast(at) {
  if (!KAR.on || !KAR.remote) return;
  const body = { ips: outIps(), music: KAR.music, vocals: KAR.vmode, at: at || 0 };
  let r = null;
  try { r = await post((KAR.disc ? '/api/cdg/' + KAR.disc.id : '/api/karaoke/' + KAR.tid) + '/cast', body); } catch (e) { r = null; }
  const now = performance.now();
  if (r && r.ok) {
    if (r.duration && !KAR.dur) KAR.dur = r.duration;
    KAR.rc.t0 = now; KAR.rc.p0 = at || 0; KAR.rc.playing = true; KAR.rc.lastP = -1;
    KAR.rc.hold = now + 2500;       // a room reports the old position for a beat
    KAR.rc.adj = 0; KAR.rc.ended = false;
    if (r.errors && r.errors.length) toast('One room did not answer');
  } else {
    KAR.rc.playing = false;
    toast('The speaker refused the karaoke stream' + (r && r.detail ? ': ' + r.detail : ''));
  }
  karPaintPlay();
}

/* Where the room is in the song, to the frame. The speaker reports whole
   seconds, so the clock free-runs from an anchor; the anchor moves only when
   a report proves it wrong, and then eases over half a second so the words
   never jump (rule 6). Local playback never comes through here. */
function karClock() {
  const rc = KAR.rc; if (!rc) return 0;
  const now = performance.now();
  let t = rc.playing ? rc.p0 + (now - rc.t0) / 1000 : rc.p0;
  if (rc.adj) {
    const u = Math.min(1, (now - rc.adjT) / 500);
    t -= rc.adj * (1 - u);
    if (u >= 1) rc.adj = 0;
  }
  return Math.max(0, t);
}
function karAnchor(target) {
  const rc = KAR.rc, now = performance.now();
  rc.adj += (target - karClock());    // ease from where the clock was to where it should be
  rc.adjT = now; rc.t0 = now; rc.p0 = target;
}
async function karRemotePoll() {
  if (!KAR.on || !KAR.remote || !OUT.ip) return;
  let st;
  try { st = await api('/api/sonos/pos?ip=' + encodeURIComponent(OUT.ip)); } catch (e) { return; }
  const rc = KAR.rc, now = performance.now();
  if (!rc || now < rc.hold) return;
  const p = st.position || 0;
  if (st.duration && !KAR.dur) KAR.dur = st.duration;
  if (st.state === 'PLAYING') {
    if (!rc.playing) { rc.playing = true; rc.t0 = now; rc.ended = false; karPaintPlay(); }
    const pred = rc.p0 + (now - rc.t0) / 1000;
    if (p !== rc.lastP) {
      /* the count just turned over: the true position is p plus at most one
         poll interval, so p plus half of one is the best estimate */
      rc.lastP = p;
      if (Math.abs(pred - (p + 0.15)) > 0.25) karAnchor(p + 0.15);
    } else if (pred < p || pred > p + 1.4) {
      karAnchor(p + 0.5);            // gross error: a seek landed, or a stall
    }
  } else if (st.state === 'PAUSED_PLAYBACK' || st.state === 'STOPPED') {
    const was = rc.playing;
    if (was) { rc.p0 = karClock(); rc.adj = 0; rc.playing = false; }
    if (Math.abs(rc.p0 - p) > 1.2 && !(st.state === 'STOPPED' && p === 0)) rc.p0 = p;
    if (st.state === 'STOPPED' && KAR.dur && rc.p0 > KAR.dur - 8 && !rc.ended) { rc.ended = true; karEnded(); }
    if (was) karPaintPlay();
  }
}
function karRecast() {
  clearTimeout(KAR.recastT);
  KAR.recastT = setTimeout(() => { if (KAR.on && KAR.remote) karCast(karClock()); }, 250);
}

/* ---- play / pause ---------------------------------------------------- */
function karTogglePlay() {
  if (KAR.remote) {
    const rc = KAR.rc; if (!rc) return;
    if (rc.ended) { karCast(0); return; }
    if (rc.playing) {
      rc.p0 = karClock(); rc.adj = 0; rc.playing = false;
      remoteCtl('Pause').catch(() => {});
    } else {
      rc.t0 = performance.now(); rc.playing = true; rc.hold = performance.now() + 1200;
      remoteCtl('Play').catch(() => {});
    }
    karPaintPlay();
    return;
  }
  if (!KAR.aB) return;
  if (KAR.aB.paused) {
    if (KAR.ctx && KAR.ctx.state === 'suspended') { try { KAR.ctx.resume(); } catch (e) {} }
    if (KAR.aV) { try { KAR.aV.currentTime = KAR.aB.currentTime; } catch (e) {} }
    Promise.all([KAR.aB.play(), KAR.aV ? KAR.aV.play() : null]).catch(() => {});
  } else {
    KAR.aB.pause(); if (KAR.aV) KAR.aV.pause();
  }
  karPaintPlay();
}
function karPaintPlay() {
  const b = $('#karplay'); if (!b) return;
  const playing = KAR.remote ? !!(KAR.rc && KAR.rc.playing)
                             : !!(KAR.aB && !KAR.aB.paused && !KAR.aB.ended);
  b.innerHTML = playing ? I.pause : I.play;
  b.title = playing ? 'Pause' : 'Play';
  singReport();                 // phones following the room hear about a play or pause at once
}

/* ---- lyric timing ---------------------------------------------------- */
function karSyncShow() {
  const v = $('#karsyncv'); if (!v) return;
  const ms = Math.round(KAR.offset * 1000);
  v.classList.toggle('set', ms !== 0);
  v.textContent = ms === 0 ? 'Lyrics in time'
    : 'Lyrics ' + (Math.abs(ms) / 1000).toFixed(1) + ' s ' + (ms > 0 ? 'later' : 'earlier');
}
function karNudge(d) {
  /* a minute either way: a chart LRC can be for a radio edit that drops a
     whole intro */
  KAR.offset = Math.max(-60, Math.min(60, Math.round((KAR.offset + d) * 10) / 10));
  karSyncShow();
  singReport();
  /* saved per song, after the presses stop: the LRC is off by the same
     amount every time this song is sung. Line ends are re-read from the
     envelope at the same moment, since they depend on where the words sit. */
  clearTimeout(KAR.offTimer);
  KAR.offTimer = setTimeout(() => {
    if (KAR.tid == null && !KAR.disc) return;
    post(KAR.disc ? '/api/cdg/' + KAR.disc.id + '/offset' : '/api/karaoke/offset/' + KAR.tid,
         { offset_ms: Math.round(KAR.offset * 1000) }).catch(() => {});
    karRebuildLines();
  }, 700);
}
function karRebuildLines() {
  if (!KAR.on || !KAR.lyr) return;
  KAR.lines = karBuild(KAR.lyr, KAR.env);
  karBuildEls();
  KAR.idx = -1; KAR.waiting = false; KAR.measured = false;
  KAR.ribs.forEach(r => { if (r.el && r.el.parentNode) r.el.parentNode.removeChild(r.el); });
  KAR.ribs = [];
}
/* press for a tenth, hold for a run, hold longer for half-second steps */
function karHold(btn, d) {
  let t = 0, n = 0, held = false;
  const step = () => { n++; karNudge(n > 12 ? d * 5 : d); };
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); held = true; n = 0; step();
    clearTimeout(t);
    t = setTimeout(function rep() { step(); t = setTimeout(rep, 110); }, 450);
  });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev =>
    btn.addEventListener(ev, () => { clearTimeout(t); if (ev !== 'pointerup') held = false; }));
  btn.onclick = () => { if (held) { held = false; return; } karNudge(d); };   // keyboard / remote
}

/* ---- seeking ---------------------------------------------------------- */
/* Both stems jump together; the rate controller in karFrame then trims any
   difference. Ribbons belong to the moment they were drawn, so they go. */
function karSeekTo(sec) {
  if (KAR.follow) return;                    // the room has the transport; a phone only follows
  if (!KAR.aB && !KAR.remote) return;
  const dur = KAR.dur || (KAR.aB && KAR.aB.duration) || 0;
  sec = Math.max(0, Math.min(dur ? dur - 0.5 : sec, sec));
  if (KAR.remote) {
    /* the room is told where to go and the clock believes it at once; the
       poll is held off while the speaker catches up */
    const rc = KAR.rc;
    if (rc) { rc.p0 = sec; rc.t0 = performance.now(); rc.adj = 0; rc.lastP = -1; rc.hold = performance.now() + 1500; rc.ended = false; }
    fanOut(ip => post('/api/sonos/seek', { ip, seconds: sec })).catch(() => {});
  } else {
    try { KAR.aB.currentTime = sec; } catch (e) {}
    if (KAR.aV) { try { KAR.aV.currentTime = sec; KAR.aV.playbackRate = 1; } catch (e) {} }
  }
  KAR.ribs.forEach(r => { if (r.el && r.el.parentNode) r.el.parentNode.removeChild(r.el); });
  KAR.ribs = [];
  $('#karhead2').style.left = (dur ? sec / dur * 100 : 0) + '%';
  setTimeout(singReport, 60);              // once the element has taken the new position
}
function karSeekBy(d) {
  if (KAR.remote) karSeekTo(karClock() + d);
  else if (KAR.aB) karSeekTo(KAR.aB.currentTime + d);
}
(function () {
  const w = $('#karmapwrap'); if (!w) return;
  let down = false;
  const at = e => {
    const r = w.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
    karSeekTo(f * (KAR.dur || (KAR.aB && KAR.aB.duration) || 0));
  };
  w.addEventListener('pointerdown', e => { if (!KAR.on) return; down = true; at(e); e.preventDefault(); });
  w.addEventListener('pointermove', e => { if (down) at(e); });
  addEventListener('pointerup', () => { down = false; });
  addEventListener('pointercancel', () => { down = false; });
})();

function karSetMusic(on) {
  KAR.music = !!on;
  if (KAR.gB) {
    const now = KAR.ctx.currentTime;
    KAR.gB.gain.cancelScheduledValues(now);
    KAR.gB.gain.setValueAtTime(KAR.gB.gain.value, now);
    KAR.gB.gain.linearRampToValueAtTime(KAR.music ? 1 : 0, now + 0.12);
  }
  $$('#karmus button').forEach(b => b.classList.toggle('sel', (b.dataset.m === '1') === KAR.music));
  /* music off with the voice off is silence, which nobody asked for */
  if (!KAR.music && KAR.vmode === 0) karSetVocals(2);
  else if (KAR.remote && KAR.on) karRecast();
}

function karSetVocals(v) {
  KAR.vmode = v;
  const g = v === 0 ? 0 : (v === 1 ? 0.22 : 1);
  if (KAR.gV) {
    const now = KAR.ctx.currentTime;
    KAR.gV.gain.cancelScheduledValues(now);
    KAR.gV.gain.setValueAtTime(KAR.gV.gain.value, now);
    KAR.gV.gain.linearRampToValueAtTime(g, now + 0.12);   // a ramp, never a click
  }
  $$('#karseg button').forEach((b, i) => b.classList.toggle('sel', i === v));
  if (KAR.remote && KAR.on) karRecast();
}

/* ---- the loop -------------------------------------------------------- */
function karFrame() {
  if (!KAR.on) return;
  KAR.raf = requestAnimationFrame(karFrame);
  if (KAR.follow) singSteer();
  const A = KAR.aB; if (!A && !KAR.remote) return;
  const el = KAR.remote ? karClock() : A.currentTime;
  /* the lyric clock: audio time minus the singer's nudge. Positive offset
     means the words arrive later than the LRC file says. The envelope and
     the visuals stay on the audio clock -- they were measured from it. */
  const lt = el - KAR.offset;

  /* The voice follows the backing track rather than running its own race.
     Two media elements never start together to the millisecond, and 40 ms of
     lead is audible as the voice arriving early. A seek only lands within a
     frame or so, so it is kept for gross error; the rest is a small playback
     rate nudge that converges silently and holds. */
  if (KAR.aV && !KAR.follow && !KAR.aV.seeking && !KAR.aV.paused) {
    const err = KAR.aV.currentTime - el;            // +ve: voice ahead
    if (Math.abs(err) > 0.25) {
      try { KAR.aV.currentTime = el; } catch (e) {}
      KAR.aV.playbackRate = 1;
    } else if (Math.abs(err) > 0.004) {
      KAR.aV.playbackRate = Math.max(0.97, Math.min(1.03, 1 - err * 0.6));
    } else if (KAR.aV.playbackRate !== 1) KAR.aV.playbackRate = 1;
  }

  const e = karEnvAt(el);
  KAR.el = el;                               // the backdrop engine reads the envelope at this clock
  KAR.smooth += (e - KAR.smooth) * 0.12;

  const inClimax = KAR.climax && el >= KAR.climax[0] && el < KAR.climax[1];
  const build = KAR.climax && el > KAR.climax[0] - 16 && el < KAR.climax[0]
    ? (el - (KAR.climax[0] - 16)) / 16 : (inClimax ? 1 : 0);
  const b1 = $('#kb1'), b2 = $('#kb2'), b3 = $('#kb3');
  if (b1 && !document.body.classList.contains('karon')) {     // the classic glow; hidden when the app's backdrop is behind the lyrics
    b1.style.transform = 'scale(' + (1 + KAR.smooth * .13 + build * .1).toFixed(3) + ')';
    b1.style.opacity = (.55 + KAR.smooth * .45 + build * .3).toFixed(3);
    b2.style.transform = 'scale(' + (1 + KAR.smooth * .08).toFixed(3) + ')';
    b2.style.opacity = (.5 + KAR.smooth * .3).toFixed(3);
    b3.style.transform = 'scale(' + (1 + KAR.smooth * .16).toFixed(3) + ')';
    b3.style.opacity = (.28 + KAR.smooth * .5 + build * .35).toFixed(3);
  }

  const cv = $('#karemb');
  if (cv) {
    if (cv.width !== cv.clientWidth) { cv.width = cv.clientWidth; cv.height = cv.clientHeight; }
    karDrawMotes(cv.getContext('2d'), cv);
  }

  const dur = KAR.dur || (A && A.duration) || 1;
  $('#karhead2').style.left = (el / dur * 100) + '%';
  $('#karel').textContent = fmtD(el);
  $('#karre').textContent = '-' + fmtD(Math.max(0, dur - el));

  if (!KAR.measured) { if (karMeasure()) karLayout(Math.max(0, KAR.idx)); }

  /* which line are we in, or how long until the next one */
  let idx = -1;
  for (let i = 0; i < KAR.lines.length; i++) {
    if (lt >= KAR.lines[i].t && lt < KAR.lines[i].e) { idx = i; break; }
  }

  if (idx < 0) {
    /* Between lines. The lyrics never leave -- the upcoming line is already on
       screen, unfilled, so there is nothing to re-find when the voice returns
       and the countdown is only a chip in the corner. */
    let ni = -1;
    for (let i = 0; i < KAR.lines.length; i++) if (KAR.lines[i].t > lt) { ni = i; break; }
    if (ni < 0) ni = KAR.lines.length - 1;
    const left = KAR.lines[ni].t - lt;
    if (KAR.idx !== ni) {
      if (KAR.idx >= 0 && KAR.idx < ni && KAR.els[KAR.idx]) {
        const r = KAR.els[KAR.idx].getBoundingClientRect();
        karShed(r.left + r.width / 2, r.top + r.height / 2, karEnvAt(KAR.lines[KAR.idx].e - .3));
      }
      KAR.idx = ni; KAR.waiting = true; karLayout(ni);
    }
    const chip = $('#karchip');
    if (left > 3.5) { chip.classList.add('on'); $('#karcd').textContent = Math.ceil(left); }
    else chip.classList.remove('on');
    return;
  }
  $('#karchip').classList.remove('on');

  const L = KAR.lines[idx];
  if (idx !== KAR.idx) {
    if (KAR.idx >= 0 && KAR.els[KAR.idx]) {
      const r = KAR.els[KAR.idx].getBoundingClientRect();
      karShed(r.left + r.width / 2, r.top + r.height / 2, karEnvAt(KAR.lines[KAR.idx].e - .3));
    }
    KAR.idx = idx; KAR.waiting = false; karLayout(idx);
  } else if (KAR.waiting) { KAR.waiting = false; karLayout(idx); }

  /* word fill: continuous, never a discrete pop. Estimated timings are always
     a little wrong, and a sweep hides the error where a jump advertises it. */
  const cur = KAR.els[idx]; if (!cur) return;
  const kws = cur.querySelectorAll('kw');
  for (let k = 0; k < kws.length; k++) {
    const s0 = karWordAt(L, k);
    const s1 = (k + 1 < kws.length) ? karWordAt(L, k + 1) : L.e;
    const on = lt >= s0, active = lt >= s0 && lt < s1;
    kws[k].className = (on ? 'lit' : '') + (active ? ' on' : '');
    if (!active && kws[k].style.transform) kws[k].style.transform = '';
    if (active) {
      /* Breathing type: the word being sung swells with the recorded voice.
         A transform, so it costs no layout and cannot re-wrap the line. */
      kws[k].style.transform = 'scale(' + (1 + e * 0.10).toFixed(3) + ')';
      if (L.rib && L.rib.k === k && !kws[k].getAttribute('data-rib')) {
        kws[k].setAttribute('data-rib', '1');
        const rb = document.createElement('div');
        rb.className = 'krib';
        rb.style.left = (kws[k].offsetLeft + kws[k].offsetWidth) + 'px';
        rb.style.top = (kws[k].offsetTop + kws[k].offsetHeight) + 'px';
        rb.style.width = '1px';
        cur.appendChild(rb);
        KAR.ribs.push({ el: rb, t0: el, span: L.rib.span });
      }
    }
  }
  KAR.ribs.forEach(r => {
    const p = Math.max(0, Math.min(1, (el - r.t0) / Math.max(.2, r.span)));
    r.el.style.transform = 'scaleX(' + (p * 200).toFixed(1) + ')';
    r.el.style.opacity = (1 - p * .25).toFixed(2);
  });
}

/* ---- singing along on a phone ------------------------------------------ */
/* The karaoke screen reports where it is in the song (/api/karaoke/live) and
   shows a QR code for /?sing=1. A phone that opens it follows: it plays the
   song itself through two <audio> elements, backing and vocal, and the singer
   picks Backing, Lead or Full by muting one or the other -- iOS honours `muted`
   where it ignores `volume`, and nothing has to reload mid-song. The elements
   are unlocked once by the Join tap (phones play nothing without one) and kept
   for every song after. As on the TV, the phone's own backing track is its
   lyric clock; a playback-rate nudge keeps that clock on the room's, and a seek
   is kept for when it is far out. */
const SILENT = 'data:audio/wav;base64,UklGRnQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgA==';
const SING = {

  if (SING.phase !== 'align' && SING.phase !== 'run') { singAlign('start:' + SING.phase); return; }

/* ---- closing --------------------------------------------------------- */
/* Silence and forget everything the karaoke screen is playing: the two stem
   players, their timers, and a room's rendered mix. Called by karClose, and by
   karOpen when the screen is already open, because an <audio> that loses its
   last reference does not stop -- it plays on, invisible, until the page dies.
   That is how two versions of one song came to play at once on the TV. */
function karTeardown() {
  KAR.gen++;                                 // any karLoad still in flight gives up
  if (!KAR.follow) singLeadStop();
  clearInterval(KAR.poll);
  cancelAnimationFrame(KAR.raf);
  [KAR.aB, KAR.aV].forEach(a => { if (a) { try { a.pause(); a.src = ''; a.load(); } catch (e) {} } });
  KAR.aB = KAR.aV = null;
  clearInterval(KAR.rpoll); clearTimeout(KAR.recastT);
  if (KAR.remote) {
    KAR.remote = false;
    remoteCtl('Stop').catch(() => {});     // the instrumental must not carry on in the room
    if (OUT.kind === 'sonos') startPoll();  // the main UI follows the room again

}

  if (lm) lm.onclick = function () { singLatNudge(-0.05); };
  if (lp) lp.onclick = function () { singLatNudge(0.05); };
  if (lv) { lv.title = 'Reset'; lv.onclick = function () { SING.lat = 0; singLatNudge(0); }; }
  singLatShow();
  var fs = $('#karfst');
  if (fs) fs.onclick = singUnblock;
  /* a phone that refused to start the sound gets it from any tap on the screen */
  var kr = $('#kar');
  if (kr) kr.addEventListener('pointerdown', function () { if (KAR.follow && SING.blocked) singUnblock(); });
  var sg = $('#singgo');
  if (sg) sg.onclick = singJoin;
  /* ?sing=1 is the QR code's address: this device follows the room's karaoke */
  if (/[?&]sing=1/.test(location.search)) {
    $('#sing').hidden = false;
    SING.poll = setInterval(singPoll, 1000);
    singPoll();
  }
  $$('#karseg button').forEach(function (b, i) {
    b.onclick = function () { karSetVocals(i); };
  });
  $$('#karmus button').forEach(function (b) {
    b.onclick = function () { karSetMusic(b.dataset.m === '1'); };
  });
  var sm = $('#karsyncm'), sp = $('#karsyncp'), sv = $('#karsyncv');
  if (sm) karHold(sm, -0.1);
  if (sp) karHold(sp, 0.1);
  if (sv) { sv.title = 'Reset'; sv.onclick = function () { KAR.offset = 0; karNudge(0); }; }
  var kp = $('#karplay');
  if (kp) kp.onclick = karTogglePlay;
  /* the karaoke controls are focusable for the remote; the timeline too, so
     left/right can seek from it */
  $$('#karback, #karplay, #karseg button, #karmus button, #karsyncm, #karsyncp, #karsyncv, #karmapwrap').forEach(regChrome);
  var mw = $('#karmapwrap'); if (mw) mw.tabIndex = 0;
})();
</script>
</body>
</html>
